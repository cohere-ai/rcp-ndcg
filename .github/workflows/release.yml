# Publish a release: on a tag v<version>, build the three distributions (rcp-ndcg, rcp-ndcg-core, rcp-ndcg-vllm),
# check each version against the tag, publish every package to its own PyPI project with trusted publishing (OIDC,
# no secret), and attach the constraints file to the GitHub release.
#
# Each package publishes through its own GitHub environment, because PyPI identifies a pending trusted publisher by
# owner, repository, workflow file and environment only (not the project name). One-time setup on pypi.org, done:
# for each project in the table below, add a trusted publisher (a pending one before the first upload) with owner
# cohere-ai, repository rcp-ndcg, workflow release.yml and the environment from the table; the environments exist in
# the repository's settings (one protection rule each, set by the owner).
#
#   | PyPI project  | GitHub environment |
#   |---------------|--------------------|
#   | rcp-ndcg      | pypi               |
#   | rcp-ndcg-core | pypi-core          |
#   | rcp-ndcg-vllm | pypi-vllm          |

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: build rcp-ndcg-core, rcp-ndcg and rcp-ndcg-vllm
        run: |
          # The three published distributions, one --package per invocation (uv refuses a repeated flag),
          # so the unpublished fourth workspace member, rcp-ndcg-test, is never swept in. No plugin
          # wheels: the folded models ship inside rcp-ndcg-vllm (layout-move item 3).
          uv build --package rcp-ndcg-core --out-dir dist
          uv build --package rcp-ndcg --out-dir dist
          uv build --package rcp-ndcg-vllm --out-dir dist
      - name: the versions are the tag's
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "dist/rcp_ndcg-${version}-py3-none-any.whl" "dist/rcp_ndcg-${version}.tar.gz"
            "dist/rcp_ndcg_core-${version}-py3-none-any.whl" "dist/rcp_ndcg_core-${version}.tar.gz"
            "dist/rcp_ndcg_vllm-${version}-py3-none-any.whl" "dist/rcp_ndcg_vllm-${version}.tar.gz"
          )
          ls -a dist
          for file in "${expected[@]}"; do test -f "$file" || { echo "missing $file: the tag is not the version"; exit 1; }; done
          test "$(find dist -type f -not -name '.*' | wc -l)" -eq "${#expected[@]}" || { echo "dist/ holds other versions"; exit 1; }
      - name: each package pins its sibling at the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          version = sys.argv[1]
          # (manifest, sibling, required): the pin is exactly `==<version>` through PEP 508 spelling and PEP 503
          # name normalisation, read with tomllib (never by matching TOML text). The vllm manifest names rcp-ndcg
          # at most -- the lean package may drop the dependency -- but every manifest the release builds must exist:
          # a missing manifest is an error, never "nothing to check".
          CHECKS = (
              ("rcp-ndcg/pyproject.toml", "rcp-ndcg-core", True),
              ("rcp-ndcg-vllm/pyproject.toml", "rcp-ndcg", False),
          )
          # name, optional [extras], then the specifier: "rcp-ndcg[calibrate]==0.0.1" -> ("rcp-ndcg", "==0.0.1")
          requirement_re = re.compile(r"^\s*([A-Za-z0-9][A-Za-z0-9._-]*)\s*(?:\[[^\]]*\])?\s*(.*)$")

          for path, name, required in CHECKS:
              manifest = Path(path)
              if not manifest.is_file():
                  raise SystemExit(f"{path} is not in this tree: the release builds it, so it must pin {name}=={version}")
              project = tomllib.loads(manifest.read_text(encoding="utf-8"))["project"]
              runtime = list(project.get("dependencies", []))
              declared = list(runtime)
              # Every declaration, in any scope, must be the exact pin: a stale pin hiding in an extra makes
              # `pip install <sibling>[<extra>]` unresolvable at tag time. The REQUIRED pin sits in the runtime
              # dependencies (`pip install` resolves it); the vllm manifest may omit the dependency altogether.
              for extra in project.get("optional-dependencies", {}).values():
                  declared += extra

              def pins_of(specs):
                  return [
                      re.sub(r"[\s()]", "", m.group(2))  # "( == 0.0.1 )" and "== 0.0.1" are the exact pin "==0.0.1"
                      for requirement in specs
                      if (m := requirement_re.match(requirement.split(";", 1)[0]))
                      and re.sub(r"[-_.]+", "-", m.group(1).lower()) == re.sub(r"[-_.]+", "-", name.lower())  # PEP 503
                  ]

              expected = f"=={version}"
              pins = pins_of(declared)
              if not (pins_of(runtime) if required else pins):
                  if required:
                      raise SystemExit(f"{path} does not declare {name}: it must pin {name}{expected} exactly")
                  print(f"{path} does not depend on {name}")
                  continue
              if any(pin != expected for pin in pins):
                  raise SystemExit(f"{name} must be pinned {expected} exactly in {path}; found {pins}")
              print(f"{path} pins {name}{expected}")
          PY
      - name: the requirements-constraints.txt is the lock's export
        run: python3 .github/scripts/check_constraints.py
      - name: twine check every file
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-rcp-ndcg-core
          path: dist/rcp_ndcg_core-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-rcp-ndcg
          path: dist/rcp_ndcg-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-rcp-ndcg-vllm
          path: dist/rcp_ndcg_vllm-*

  # One publish job per package, each with its own environment: the PyPI project in it is a pending trusted publisher
  # identified by owner, repository, workflow file and environment only.
  publish-core:
    name: publish rcp-ndcg-core to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-rcp-ndcg-core
          path: dist/rcp-ndcg-core
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist/rcp-ndcg-core

  # rcp-ndcg pins rcp-ndcg-core==<version> exactly, so the core must exist on PyPI first.
  publish-rcp-ndcg:
    name: publish rcp-ndcg to PyPI
    needs: publish-core
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-rcp-ndcg
          path: dist/rcp-ndcg
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist/rcp-ndcg

  # rcp-ndcg-vllm pins rcp-ndcg==<version> exactly (and the core through it): every moment of the rollout must
  # install, so it publishes only after both siblings are on PyPI (PyPI files are immutable; a published
  # rcp-ndcg-vllm whose siblings failed would be uninstallable forever).
  publish-vllm:
    name: publish rcp-ndcg-vllm to PyPI
    needs: [build, publish-core, publish-rcp-ndcg]
    runs-on: ubuntu-latest
    environment: pypi-vllm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-rcp-ndcg-vllm
          path: dist/rcp-ndcg-vllm
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist/rcp-ndcg-vllm

  github-release:
    name: GitHub release with the constraints file
    needs: [publish-core, publish-rcp-ndcg, publish-vllm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-rcp-ndcg
          path: dist/rcp-ndcg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-rcp-ndcg-core
          path: dist/rcp-ndcg-core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-rcp-ndcg-vllm
          path: dist/rcp-ndcg-vllm
      # The rendered jobs install against the constraints file attached here.
      - run: gh release create "$GITHUB_REF_NAME" requirements-constraints.txt dist/*/* --verify-tag --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
