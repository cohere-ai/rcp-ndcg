# Publish a release: on a tag v<version>, build the three distributions (rcp-ndcg, rcp-ndcg-core, rcp-ndcg-vllm),
# check each version against the tag, publish every package to its own PyPI project with trusted publishing (OIDC,
# no secret), and attach the constraints file to the GitHub release.
#
# Each package publishes through its own GitHub environment, because PyPI identifies a pending trusted publisher by
# owner, repository, workflow file and environment only (not the project name). One-time setup on pypi.org, done:
# for each project in the table below, add a trusted publisher (a pending one before the first upload) with owner
# cohere-ai, repository rcp-ndcg, workflow release.yml and the environment from the table; the environments exist in
# the repository's settings (one protection rule each, set by the owner).
#
#   | PyPI project  | GitHub environment |
#   |---------------|--------------------|
#   | rcp-ndcg      | pypi               |
#   | rcp-ndcg-core | pypi-core          |
#   | rcp-ndcg-vllm | pypi-vllm          |

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: build rcp-ndcg, rcp-ndcg-core and rcp-ndcg-vllm
        run: |
          # The three published packages, by name (never a glob of all workspace members: the
          # unpublished test package under packages/ is a member and must never be built or published).
          uv build --package rcp-ndcg --package rcp-ndcg-core --out-dir dist
          # rcp-ndcg-vllm is deliberately outside the uv workspace: build it from its own directory.
          (cd packages/rcp-ndcg-vllm && uv build --out-dir ../../dist)
      - name: the versions are the tag's
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "dist/rcp_ndcg-${version}-py3-none-any.whl" "dist/rcp_ndcg-${version}.tar.gz"
            "dist/rcp_ndcg_core-${version}-py3-none-any.whl" "dist/rcp_ndcg_core-${version}.tar.gz"
            "dist/rcp_ndcg_vllm-${version}-py3-none-any.whl" "dist/rcp_ndcg_vllm-${version}.tar.gz"
          )
          ls -a dist
          for file in "${expected[@]}"; do test -f "$file" || { echo "missing $file: the tag is not the version"; exit 1; }; done
          test "$(find dist -type f -not -name '.*' | wc -l)" -eq "${#expected[@]}" || { echo "dist/ holds other versions"; exit 1; }
          grep -qx "  \"rcp-ndcg-core==${version}\"," pyproject.toml || { echo "rcp-ndcg does not pin rcp-ndcg-core==${version}"; exit 1; }
          grep -qx "  \"rcp-ndcg==${version}\"," packages/rcp-ndcg-vllm/pyproject.toml || { echo "rcp-ndcg-vllm does not pin rcp-ndcg==${version}"; exit 1; }
      - name: the constraints file is the lock's export
        run: |
          command=$(sed -n '2s/^#    //p' requirements-constraints.txt)
          eval "${command/ -o requirements-constraints.txt/ --no-header -o $RUNNER_TEMP/exported.txt}"
          diff <(grep -v '^#' requirements-constraints.txt) <(grep -v '^#' "$RUNNER_TEMP/exported.txt")
      - name: twine check every file
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-rcp-ndcg-core
          path: dist/rcp_ndcg_core-*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-rcp-ndcg
          path: dist/rcp_ndcg-*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-rcp-ndcg-vllm
          path: dist/rcp_ndcg_vllm-*

  # One publish job per package, each with its own environment: the PyPI project in it is a pending trusted publisher
  # identified by owner, repository, workflow file and environment only.
  publish-core:
    name: publish rcp-ndcg-core to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-rcp-ndcg-core
          path: dist/rcp-ndcg-core
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/rcp-ndcg-core

  # rcp-ndcg pins rcp-ndcg-core==<version> exactly, so the core must exist on PyPI first.
  publish-rcp-ndcg:
    name: publish rcp-ndcg to PyPI
    needs: publish-core
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-rcp-ndcg
          path: dist/rcp-ndcg
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/rcp-ndcg

  publish-vllm:
    name: publish rcp-ndcg-vllm to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-vllm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-rcp-ndcg-vllm
          path: dist/rcp-ndcg-vllm
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/rcp-ndcg-vllm

  github-release:
    name: GitHub release with the constraints file
    needs: [publish-core, publish-rcp-ndcg, publish-vllm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-rcp-ndcg
          path: dist/rcp-ndcg
      - uses: actions/download-artifact@v4
        with:
          name: dist-rcp-ndcg-core
          path: dist/rcp-ndcg-core
      - uses: actions/download-artifact@v4
        with:
          name: dist-rcp-ndcg-vllm
          path: dist/rcp-ndcg-vllm
      # The rendered jobs install against the constraints file attached here.
      - run: gh release create "$GITHUB_REF_NAME" requirements-constraints.txt dist/*/* --verify-tag --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
