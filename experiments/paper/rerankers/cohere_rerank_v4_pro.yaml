# rerank-v4.0-pro: a reranker config (rcp_ndcg.retrieval.RerankerConfig) for
# `rcp-ndcg retrieval rerank --reranker <this file>`. Hosted API (Cohere Rerank 4), no GPU; the key
# is read from CO_API_KEY or COHERE_API_KEY, and `base_url` is omitted: the profile's public URL.
api: cohere
model: rerank-v4.0-pro
instruction: none  # the paper's hosted path sent the bare query
