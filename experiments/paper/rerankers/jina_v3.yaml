# jinaai/jina-reranker-v3, served: a reranker config (rcp_ndcg.retrieval.RerankerConfig) for
# `rcp-ndcg retrieval rerank --reranker <this file>`. Served by recipe `jina-reranker-v3`
# (JinaForRanking, listwise: the whole candidate set travels in one prompt; reference:
# experiments/paper/rerankers/reference/jina.py). `base_url` is the placeholder the runner's
# engines overlay (serve.reranker) replaces; `model` is the --served-model-name.
# What is sent: the rerank client cuts every (query, document) pair to the 8192-token pair budget,
# settling the shared query at its 4096-token share whenever it exceeds it, and sends the cut spans
# with no per-text request caps (no max_tokens_per_query, max_tokens_per_doc or
# truncate_prompt_tokens). The checkpoint's own per-text caps (query 512, document 2048, applied
# before templating by its rerank()) are therefore NOT applied on this served path: a query over 512
# tokens or a document over 2048 tokens reaches the model longer than the paper's in-process
# reference saw it. `listwise: true` — a batch_size is refused, the model scores the whole set in
# one prompt.
api: rerank
base_url: http://127.0.0.1:8000/v1
model: jina-reranker-v3
revision: d7d7e73b6ea138ced340b83865931b5dfb6c97aa
tokenizer: jinaai/jina-reranker-v3@d7d7e73b6ea138ced340b83865931b5dfb6c97aa
max_tokens: 8192
query_max_tokens: 4096
instruction: none
use_activation: false  # the raw score is stored -- the paper reference calls the checkpoint's own rerank() (reference/jina.py)
listwise: true

# No `recipe:` pointer on this config (docs-firstcontact Q1's strict mapping form): its explicit
# CONTENT disagrees with the shipped recipe's declared block -- the paper reproduces the source
# release's path (the raw logit stored, `use_activation: false`) where the recipe declares the model
# card's serving (`use_activation: true`; jina_v3's paper budgets 8192/4096 also differ from its
# recipe's 3219/512). A pointer's content must equal the recipe's or is refused, naming both values;
# this config keeps every explicit field, and the recipe itself serves the card's path.
