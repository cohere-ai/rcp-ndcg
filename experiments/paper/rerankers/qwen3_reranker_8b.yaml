# Qwen/Qwen3-Reranker-8B, served: a reranker config (rcp_ndcg.retrieval.RerankerConfig) for
# `rcp-ndcg retrieval rerank --reranker <this file>`. Served by recipe `qwen3-reranker-8b`
# (the hf_overrides, score template and budgets of rcp-ndcg-vllm; reference:
# experiments/paper/rerankers/reference/qwen3.py). `base_url` is the placeholder the runner's
# engines overlay (serve.reranker) replaces; `model` is the --served-model-name.
# Budgets are the paper's: the 8192-token pair budget (MAX_SEQ_LENGTH), queries capped at 4096
# (MAX_QUERY_LENGTH); the release's in-process path passed the bare query, hence `instruction: none`.
api: rerank
base_url: http://127.0.0.1:8000/v1
model: qwen3-reranker-8b
revision: 77d193c791ed757ca307ee72715aa132723da912
tokenizer: Qwen/Qwen3-Reranker-8B@77d193c791ed757ca307ee72715aa132723da912
max_tokens: 8192
query_max_tokens: 4096
instruction: none
use_activation: false  # the raw yes-logit is stored -- the paper reference applies softmax client-side (reference/qwen3.py)

# No `recipe:` pointer on this config (docs-firstcontact Q1's strict mapping form): its explicit
# CONTENT disagrees with the shipped recipe's declared block -- the paper reproduces the source
# release's path (the raw logit stored, `use_activation: false`) where the recipe declares the model
# card's serving (`use_activation: true`; jina_v3's paper budgets 8192/4096 also differ from its
# recipe's 3219/512). A pointer's content must equal the recipe's or is refused, naming both values;
# this config keeps every explicit field, and the recipe itself serves the card's path.
