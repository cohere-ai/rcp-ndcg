# zeroentropy/zerank-1, served: a reranker config (rcp_ndcg.retrieval.RerankerConfig) for
# `rcp-ndcg retrieval rerank --reranker <this file>`. Served by recipe `zerank-1-reranker` (the
# classifier_from_token, score template and logit_sigma of rcp-ndcg-vllm; reference:
# experiments/paper/rerankers/reference/zerank.py). `base_url` is the placeholder the runner's
# engines overlay (serve.reranker) replaces; `model` is the --served-model-name. The checkpoint
# is zeroentropy/zerank-1-reranker (`zerank-1` is a Hub redirect to it).
# Budgets are the paper's: the 8192-token pair budget (whole-prompt right truncation), queries
# capped at 4096; the release's in-process path passed the bare query, hence `instruction: none`.
api: rerank
base_url: http://127.0.0.1:8000/v1
model: zerank-1
revision: d03c467e29e29c0a16a130a86ce3b62d30116a2c
tokenizer: zeroentropy/zerank-1-reranker@d03c467e29e29c0a16a130a86ce3b62d30116a2c
max_tokens: 8192
query_max_tokens: 4096
instruction: none
use_activation: false  # the raw logit is stored -- the paper reference applies sigmoid(yes/5) client-side (reference/zerank.py)

# No `recipe:` pointer on this config (docs-firstcontact Q1's strict mapping form): its explicit
# CONTENT disagrees with the shipped recipe's declared block -- the paper reproduces the source
# release's path (the raw logit stored, `use_activation: false`) where the recipe declares the model
# card's serving (`use_activation: true`; jina_v3's paper budgets 8192/4096 also differ from its
# recipe's 3219/512). A pointer's content must equal the recipe's or is refused, naming both values;
# this config keeps every explicit field, and the recipe itself serves the card's path.
