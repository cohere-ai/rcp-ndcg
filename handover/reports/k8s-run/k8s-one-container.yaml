# k8s-run lane, shape (a): the one-container shape.
#
# A single-replica encoder engine runs in the coordinator's own pod (the phase container is the engine's
# image; the supervision script starts the engine, waits for readiness, runs the retrieve step, stops the
# engine). The client block is recipe qwen3-embedding-0.6b's own (the shipped recipe's client block,
# inlined because the coordinator's uvx environment installs rcp-ndcg[calibrate,hf,s3,azure] and does not
# carry the serving package; the engine command installs rcp-ndcg-vllm and serves the shipped recipe id).
label: k8s-one-container
dataset:
  uri: jsonl:gs://cohere-dev-central-2/fabian/rcp-ndcg-k8s-run/20261014-k8srun/dataset
candidates:
  from: retrieval
  depth: 8
  retrieval:
    kind: dense
    encoder:
      api: openai_embeddings
      request_shape: text
      max_tokens: 8192
      template:
        query:
        - fixed: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
        - content: query
        document:
        - content: document
        anchor: last
        add_special_tokens: true
      on_overflow: cut
      empty_doc: send
      instruction: none
      normalize: true
      mrl_kind: truncation
      mrl_range: [32, 1024]
      model: qwen3-embedding-0.6b
      revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      tokenizer: Qwen/Qwen3-Embedding-0.6B@97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
steps: [retrieve]
limit: 3
serve:
  encoder:
    image: vllm/vllm-openai:v0.31.0
    command: ["bash", "-lc", "python3 -m pip install --quiet --no-index --trusted-host rcp-ndcg-k8srun-wheels --find-links http://rcp-ndcg-k8srun-wheels:8080 uv && python3 -m pip install --quiet --no-deps --no-index --trusted-host rcp-ndcg-k8srun-wheels --find-links http://rcp-ndcg-k8srun-wheels:8080 rcp-ndcg-vllm==0.0.1 && exec rcp-ndcg-vllm serve qwen3-embedding-0.6b --port 8000"]
    resources: {gpus: 1}
    replicas: 1
    startup_timeout_s: 1800
    outage_timeout_s: 300
runner:
  name: kubernetes
  options:
    context: gke-us-central1-prod
    namespace: default
    service_account: svc-modeling
    node_selector: {cohere.com/mode: gpu, nvidia.com/gpu.product: NVIDIA-B200}
    tolerations:
    - {key: nvidia.com/gpu, operator: Equal, value: present, effect: NoSchedule}
    wheelhouse: http://rcp-ndcg-k8srun-wheels:8080
    constraints: http://rcp-ndcg-k8srun-wheels:8080/requirements-constraints.txt
    resources: {cpus: 8, memory_gb: 32, time_limit_s: 3600}
    # pip refuses a plain-HTTP find-links host unless it is trusted (uv does not); the engine command
    # installs uv and the plugin itself, this keeps the coordinator's uv bootstrap on the same host.
    env: {PIP_TRUSTED_HOST: rcp-ndcg-k8srun-wheels}
    backoff_limit: 0
    ttl_seconds_after_finished: 900
mirror: gs://cohere-dev-central-2/fabian/rcp-ndcg-k8s-run/20261014-k8srun/runs/one-container
