spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rcp-ndcg
        rcp-ndcg/job: rcp-20261014-073159-k8s-statefulset-ca56ec
    spec:
      restartPolicy: Never
      containers:
      - name: phase-1
        image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
        command:
        - bash
        - -c
        - "#!/usr/bin/env bash\nset -euo pipefail\nexport UV_CACHE_DIR=/scratch/uv-cache\nexport UV_LINK_MODE=copy\nexport HF_HOME=/scratch/hf\nexport TMPDIR=/scratch/tmp/coordinator\nexport RCP_NDCG_ENGINES='{\"judge\": {\"urls\": [\"http://rcp-20261014-073159-k8s-statefulset-ca56ec-64e053df-0.rcp-20261014-073159-k8s-statefulset-ca56ec-64e053df.default.svc:8000/v1\", \"http://rcp-20261014-073159-k8s-statefulset-ca56ec-64e053df-1.rcp-20261014-073159-k8s-statefulset-ca56ec-64e053df.default.svc:8000/v1\"], \"wait_on_outage_s\": 300}}'\nexport CUDA_VISIBLE_DEVICES=''\nexport PIP_TRUSTED_HOST=rcp-ndcg-k8srun-wheels\nmkdir -p \"$TMPDIR\"\nrcp_ndcg_any_ready() {  # PORT PATH HOST...\n  local port=\"$1\" path=\"$2\"; shift 2\n  for host in \"$@\"; do\n    python3 -c 'import sys, urllib.request; urllib.request.urlopen(sys.argv[1], timeout=5)' \"http://$host:$port$path\" >/dev/null 2>&1 && return 0\n  done\n  return 1\n}\nrcp_ndcg_wait_ready() {  # PID_VAR TIMEOUT PORT PATH HOST...\n  local pid_var=\"\
          $1\" timeout=\"$2\" port=\"$3\" path=\"$4\"; shift 4\n  local deadline=$((SECONDS + timeout)) status\n  echo \"rcp-ndcg: waiting up to $timeout s for an engine replica to answer $path\" >&2\n  until rcp_ndcg_any_ready \"$port\" \"$path\" \"$@\"; do\n    if [[ -n \"${!pid_var:-}\" ]] && ! kill -0 \"${!pid_var}\" 2>/dev/null; then\n      status=0\n      wait \"${!pid_var}\" || status=$?\n      printf -v \"$pid_var\" ''\n      echo \"rcp-ndcg: the engine exited with status $status before it answered $path; its output is above\" >&2\n      exit 1\n    fi\n    if ((SECONDS >= deadline)); then\n      echo \"rcp-ndcg: no engine replica answered $path within $timeout s (serve.startup_timeout_s); stopping the job\" >&2\n      exit 1\n    fi\n    sleep 10\n  done\n}\nrcp_ndcg_wait_gone() {  # TIMEOUT PORT PATH HOST...\n  local timeout=\"$1\" port=\"$2\" path=\"$3\"; shift 3\n  local deadline=$((SECONDS + timeout))\n  while rcp_ndcg_any_ready \"$port\" \"$path\" \"$@\"; do\n    if ((SECONDS\
          \ >= deadline)); then\n      echo \"rcp-ndcg: port $port still answers $path ${timeout} s after its engine was stopped: the next phase would talk to it\" >&2\n      return 1\n    fi\n    sleep 10\n  done\n}\nrcp_ndcg_wait_ready RCP_NDCG_ENGINE_PID_REMOTE 3600 8000 /v1/models rcp-20261014-073159-k8s-statefulset-ca56ec-64e053df-0.rcp-20261014-073159-k8s-statefulset-ca56ec-64e053df.default.svc rcp-20261014-073159-k8s-statefulset-ca56ec-64e053df-1.rcp-20261014-073159-k8s-statefulset-ca56ec-64e053df.default.svc\nif ! command -v uvx >/dev/null; then\n  python3 -m pip install --quiet --no-index --find-links http://rcp-ndcg-k8srun-wheels:8080 --target \"${TMPDIR:-/tmp}/rcp-ndcg-uv\" uv\n  export PATH=\"${TMPDIR:-/tmp}/rcp-ndcg-uv/bin:$PATH\"\nfi\nexec uvx --from 'rcp-ndcg[calibrate,hf,s3,azure]==0.0.1' --constraints http://rcp-ndcg-k8srun-wheels:8080/requirements-constraints.txt --find-links http://rcp-ndcg-k8srun-wheels:8080 --no-index rcp-ndcg run resume --run /scratch/runs/20261014-073159-k8s-statefulset-ca56ec\
          \ --mirror gs://cohere-dev-central-2/fabian/rcp-ndcg-k8s-run/20261014-k8srun/runs/statefulset --only tournament\n"
        volumeMounts:
        - name: scratch
          mountPath: /scratch
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 8
            memory: 32Gi
          limits:
            cpu: 8
            memory: 32Gi
      volumes:
      - name: scratch
        emptyDir: {}
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      serviceAccountName: svc-modeling
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      nodeSelector:
        cohere.com/mode: gpu
        nvidia.com/gpu.product: NVIDIA-B200
