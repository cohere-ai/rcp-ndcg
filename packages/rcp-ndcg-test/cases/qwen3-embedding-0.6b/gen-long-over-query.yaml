notes: 'A query over max_tokens 8192: the client cuts the query content and must keep the 19-id frame
  and the anchor; a naive first-8192-token cut of the rendered ids drops the anchor and diverges at the
  pooled token (measured in the research). Generated long/medium inputs were built once by a seeded generator
  (never generated at test time; the exact texts are embedded verbatim in this file): Python random.Random(20251006)
  (Mersenne Twister, stable across CPython versions) over a fixed 32-word vocabulary (sailing and observation
  terms: harbour lantern merchant anchorage tide current compass latitude longitude cargo expedition cartographer
  isthmus monsoon vessel provisioning reef soundings azimuth sextant astrolabe keelballast bowsprit mizzen
  topsail windward leeward fathom nautical almanac observatory chronometer), sentences of 8-14 words;
  each generated input is a consecutive, non-overlapping slice of that single word stream, trimmed to
  its target token count, and no two inputs of a case share words (the two medium documents and the longest
  document are reused verbatim in the other mixed-length batch cases). Short inputs are hand-written topical
  sentences. Inputs are embedded verbatim in this file (never generated at test time). Rendered lengths
  measured with the recipe''s tokenizer (client.tokenizer: Qwen/Qwen3-Embedding-0.6B @ 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3);
  the rendered query shape is the 19-id frame (Instruct: ... Query:) + the query content + the post-processor
  anchor (id 151643), except that the frame''s trailing colon fuses with a capital first letter of the
  content into one token (e.g. '':M''), so every rendered count below is measured, never derived; the
  rendered document shape is content + anchor. Measured: q1 = 8520 rendered ids, 8192 after the cut, 104.0%
  of the 8192 budget, d1 = 19 rendered ids.'
