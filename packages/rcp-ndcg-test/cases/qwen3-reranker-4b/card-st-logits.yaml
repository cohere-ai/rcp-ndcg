id: qwen3-reranker-4b/card-st-logits
recipe: qwen3-reranker-4b
role: rerank
strata:
  modality: text
  length: short
  batch: mixed_length
inputs:
  instruction: Given a web search query, retrieve relevant passages that answer the query
  queries:
  - id: q1
    text: What is the capital of China?
  documents:
  - id: d1
    text: The capital of China is Beijing.
  - id: d2
    text: Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.
source:
  kind: model_card
  url: https://huggingface.co/Qwen/Qwen3-Reranker-4B
  revision: 22e683669bc0f0bd69640a1354a6d0aebcfeede5
  section: Using Sentence Transformers
  quote: |-
    query = "What is the capital of China?"
    documents = [
        "The capital of China is Beijing.",
        "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.",
    ]

    pairs = [(query, doc) for doc in documents]
    scores = model.predict(pairs)
    print(scores)
    # [  6.4375 -14.375 ]

    rankings = model.rank(query, documents)
    print(rankings)
    # [{'corpus_id': 0, 'score': 6.4375}, {'corpus_id': 1, 'score': -14.375}]
expected:
  kind: scores
  values:
  - - 6.4375
    - -14.375
  tolerance:
    abs: 1.0
  origin: published
  status: published_unverified
notes: 'The card''s Sentence Transformers example, inputs and both printed outputs verbatim (raw logit differences and the ranking; one query, two documents of different lengths, so batch mixed_length). The card''s default prompt injects exactly the instruction recorded in inputs.instruction, which is also the instruction the recipe''s template frame carries fixed (the recipe''s instruction mode is none), so the recipe''s rendered prompt equals the card''s construction. Values are one row (one query) with one column per document in inputs.documents order. The card''s two follow-on snippets in this section (the Sigmoid-activation one-liner and the custom-instruction prompts snippet) print no outputs and add no new inputs beyond this example, so they are listed in the lane report, not made cases. The card prints raw logit differences (CrossEncoder without an activation, as numpy''s shortest round-trip representation of exact bf16 values: the print itself adds no rounding, and abs 5e-4 is kept as a conservative reading bound); the family''s checkpoints are bf16, whose ULP at |logit| ~ 14 is 0.0625; the declared tolerance abs 1.0 covers the reading bound, the bf16 ULP, and the measured sensitivity of the extreme-negative logit tail across devices (see the reproduction note below): the robust comparisons are the probability scale and the exact rank order (the card-st-ranking case), not 3-decimal logit equality. The served head scores a probability (use_activation true, sigmoid of x.(W_yes - W_no)); convert a probability p to the comparable logit difference with ln(p/(1-p)) before comparing. No CPU reproduction: the size exceeds the brief''s CPU budget (<= 1B parameters).'
