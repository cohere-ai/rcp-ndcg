notes: >-
  model_card case, transformers Basic Usage Example - this is the recipe's reference runtime
  (scripts/qwen3_vl_embedding.py, vendored verbatim as the recipe's reference.py). The card prints
  ~16 significant digits, so rounding is negligible: tolerance abs 2e-3 is the declared bf16
  margin (the checkpoint dtype; the example loads the model with its default dtype). Image columns
  (d2, d3): stand-in media as in card-sentence-transformers - the wave recomputes those cells from
  the reference with media/stand_in.png. CPU reproduction declined: 2B parameters exceeds the 1B
