notes: 'From the card''s ''Using Transformers'' example (scripts/qwen3_vl_reranker.py, the recipe''s declared serving referent): one query, three documents (text / image URL / text+image), printed scores [0.8613124489784241, 0.6757137179374695, 0.8125371336936951] (full float32 repr, sigmoid probabilities on the recipe''s score_scale). Only the text document is a case input: the image-bearing documents fetch https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen-VL/assets/demo.jpeg, an asset with no licence allowing redistribution in an Apache-2.0 repository, and a synthetic stand-in would not reproduce the card''s numbers; their printed scores (0.6757137179374695 for the image document, 0.8125371336936951 for text+image) are preserved in source.quote. To reproduce them, fetch that image into media/ and extend this case (owner''s call). The card produced these numbers with the custom instruction recorded in inputs.instruction; this recipe pins instruction: none (the default instruction is fixed frame text), so the served client cannot send it. Reproducing the card''s number needs the card''s own script with this instruction; the recipe''s reference.py always renders the default instruction and will NOT reproduce it (declared divergence; the card''s own two runtimes differ by ~2e-3 on the same inputs: the card''s sentence-transformers run prints sigmoid-activated 0.8594 (its printed logit 1.8125 recomputes to a sigmoid of 0.8597) vs 0.8613 here). Tolerance: the card prints a full float32 repr, so rounding is negligible; abs 0.01 is the declared bf16 margin (probability scale) for kernel/batching nondeterminism. The model is 2B, above the 1B CPU limit, so no CPU score reproduction was run; the render was checked on CPU: the pair renders to 113 tokens (113 post-expansion; text only, no expansion) with the card''s instruction, 115 with the recipe''s default instruction.'
