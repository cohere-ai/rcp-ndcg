  queries:
  - id: q1
    text: What causes the northern lights?
  documents:
  - id: d1
    text: The northern lights appear when charged particles from the sun collide with gases in Earth's atmosphere, producing glowing curtains of green, red and violet light near the poles.
  - id: d2
    text: Charged particles from the solar wind are guided by Earth's magnetic field toward the polar regions. At altitudes between roughly one hundred and three hundred kilometres they excite oxygen and nitrogen atoms and molecules; the excited gases release the energy as light, with green from atomic oxygen at lower altitudes, red from oxygen higher up, and blue and violet from nitrogen. The shape and movement of the displays trace the field lines and the varying solar wind, which is why auroral activity follows the eleven-year solar cycle and intensifies during geomagnetic storms. valve after kiln beyond vaccine above aqueduct lighthouse generator concrete marsh basalt green harvest coast with lens dredge panel season virus particle battery canyon dusk up tide irrigation harbour drainage inspector sail among erosion on into kettle pump geyser energy rocket brew was and behind nebula immune engine emission canal conifer column orchard toward solstice rope trial maintenance filter lichen pipeline altitude ocean by the copper mast around tension beacon vineyard moss tidal rotation weather compass over distill keeper without through dune metamorphic photon is galaxy gravity cambium rocky near crampon glacier delta tundra within curtain under electricity across magnetism except oxygen steel fossil an sedimentary silicon against inverter avalanche mortar about beam from for anchor log violet plus orbit wheat at fern freighter solar mycorrhizae reservoir of in filament sunlight harness savanna nitrogen equinox sediment were understory arch foundation spectrum barley to memory before along dose meadow deciduous crystal canopy atmosphere mill igneous bridge turbine between response compression wetland vessel aurora rite stratum tilt crevasse granite ferment semiconductor telescope probe summit antibody propellant mineral a levee alloy bark polar reef rescue hemisphere rigging lamp fjord spore plateau during station basin geology estuary valley current beneath axis below c