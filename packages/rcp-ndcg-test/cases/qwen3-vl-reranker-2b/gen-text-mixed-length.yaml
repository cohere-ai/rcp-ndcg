  documents:
  - id: d1
    text: The northern lights appear when charged particles from the sun collide with gases in Earth's
      atmosphere, producing glowing curtains of green, red and violet light near the poles.
  - id: d2
    text: Charged particles from the solar wind are guided by Earth's magnetic field toward the polar
      regions. At altitudes between roughly one hundred and three hundred kilometres they excite oxygen
      and nitrogen atoms and molecules; the excited gases release the energy as light, with green from
      atomic oxygen at lower altitudes, red from oxygen higher up, and blue and violet from nitrogen.
      The shape and movement of the displays trace the field lines and the varying solar wind, which is
      why auroral activity follows the eleven-year solar cycle and intensifies during geomagnetic storms.
