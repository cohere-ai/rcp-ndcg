notes: 'Generated by make_long_inputs.py (alongside; template bank + random.Random(seed), word-for-word
  trim onto the target). Lengths measured with tokenizer.json @ e54485ebab921f2c18c4d092b3f4c40dcca26781
  (sha256 e56427d66f44411c2dec1288b236f6d2c3eeafd611d1d0e2e92ad9301616e1e7), the embedded 1024-token
  truncation reset before counting (recipe gap G5). Text prompts are raw, not chat: "Query: " +
  text.strip() and "Document: " + text, whole render stripped. The fixed head encodes to 3 tokens
  standalone (with its trailing space); in a rendered prompt the space merges into the first content
  token, so the head contributes 2 there. Queries keep every token, documents drop scoring_skip_ids
  positions (32 standalone-punctuation ids + 9 specials at the revision). query q1: rendered prompt
  13 tokens. query q2: rendered prompt 9 tokens. Image documents travel as an image-only user message
  through the checkpoint''s chat template (no text part; the "Document: " head does NOT apply):
  prompt = [im_start, user, newline, vision_start] + N image-pad tokens + [vision_end, im_end, newline],
  N = ceil(H/32) * ceil(W/32) of the smart-resized image. Images are documents only (recipe gap
  G3): the pipeline must never send an image query. uniform batch: every document of the case sits
  in one length stratum (uniform does not mean identical lengths; mixed_length marks cases that
  straddle strata). doc_small_1 is 256x256 px (64 patch tokens expected), doc_small_2 is 512x384
  px (192 expected), doc_small_3 is 448x336 px (the processor resizes to 32-px multiples; the T0
  probe pins the exact count). Image prompts are always short here: the 1280-patch budget caps them
  at about 1287 tokens, far under the 8192 budget, so image x long_over is not an applicable cell.
  Media are synthetic (geometric page patterns, no third-party material), produced by media/make_media.py
  alongside; regenerate with `python media/make_media.py`. expected.values stays null until the
  GPU wave fills it from the reference implementation and the engine (origin reference, status pending_gpu).
  tolerance abs 0.02 is the initial gate: the research R1/R6 equivalence bound (about 1e-2 at fp16
  vector storage) with a 2x margin, for bf16 serving, fp16 transfer (recipe embed_dtype float16)
  and fp32 MaxSim; the wave must restate it against the measured fp32-storage agreement (R6).'
