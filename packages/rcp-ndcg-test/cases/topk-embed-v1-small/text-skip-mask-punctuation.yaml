notes: 'Generated by make_long_inputs.py (alongside; template bank + random.Random(seed), word-for-word
  trim onto the target). Lengths measured with tokenizer.json @ e54485ebab921f2c18c4d092b3f4c40dcca26781
  (sha256 e56427d66f44411c2dec1288b236f6d2c3eeafd611d1d0e2e92ad9301616e1e7), the embedded 1024-token
  truncation reset before counting (recipe gap G5). Text prompts are raw, not chat: "Query: " +
  text.strip() (3-token head) and "Document: " + text, whole render stripped (3-token head); queries
  keep every token, documents drop scoring_skip_ids positions (32 standalone-punctuation ids + 9
  specials at the revision). query q1: rendered prompt 17 tokens. query q2: rendered prompt 9 tokens.
  doc d1: rendered prompt 123 tokens, 90 kept after the document-side scoring_skip_ids mask. doc
  d2: rendered prompt 95 tokens, 73 kept after the document-side scoring_skip_ids mask. The document-side
  keep-mask is load-bearing here: the recorded kept counts are the vector counts the reference produces
  (document tokens whose id is not in scoring_skip_ids; recipe gap G1). Queries keep punctuation
  tokens (the reference''s asymmetry, R10). Until the recipe''s keep_mask field lands, a served
  document vector set is a superset of the reference''s and the wave''s per-token count check fails
  on this case by construction. expected.values stays null until the GPU wave fills it from the
  reference implementation and the engine (origin reference, status pending_gpu). tolerance abs
  0.02 is the initial gate: the research R1/R6 equivalence bound (about 1e-2 at fp16 vector storage)
  with a 2x margin, for bf16 serving, fp16 transfer (recipe embed_dtype float16) and fp32 MaxSim;
  the wave must restate it against the measured fp32-storage agreement (R6).'
