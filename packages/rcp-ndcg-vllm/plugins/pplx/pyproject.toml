[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rcp-ndcg-vllm-pplx"
version = "0.0.1"
description = "vLLM plugin that serves perplexity-ai/pplx-embed-v2-context-9b-preview as a multi-chunk pooling model (rcp-ndcg lane plug-pplx)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
  { name = "RCP-nDCG contributors" },
]
keywords = ["information-retrieval", "vllm", "plugin", "embedding", "multi-vector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# Deliberately no dependencies: the distribution is installed with
# `pip install --no-deps` into the engine image, which already carries vLLM,
# torch and transformers (the only things this package imports at runtime).
# A dependency here would either fight the image's own pins or break the
# --no-deps freeze contract checked by scripts/check_no_deps_freeze.sh.
dependencies = []

[project.entry-points."vllm.general_plugins"]
rcp_vllm_pplx = "rcp_vllm_pplx:register"

[project.urls]
Homepage = "https://github.com/cohere-ai/rcp-ndcg"
Repository = "https://github.com/cohere-ai/rcp-ndcg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
