[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcp-ndcg-vllm"
version = "0.0.1"
description = "vLLM serving recipes for retrieval models, the equivalence harness, the engine recorder and the GPU wave runner."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
  { name = "RCP-nDCG contributors" },
]
keywords = ["information-retrieval", "vllm", "rerank", "embedding", "serving"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# Deliberately without vllm: the engine image carries it, and a torch pin here
# would fight every vLLM release.  rcp-ndcg IS a hard dependency (one schema: the
# recipe's client block IS the product's endpoint config; stage 1 runs the
# product's fit).  The reference environment (torch, transformers) is NOT a
# dependency of this package: the reference runs as a subprocess
# (requirements-reference.txt).
dependencies = [
  "rcp-ndcg==0.0.1",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "tokenizers>=0.21",
]

[project.optional-dependencies]
# The package's own CPU test suite (pytest, jinja2 for the served-template check,
# tokenizers for the fixture tokenizer).
test = [
  "pytest>=8.0",
  "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/cohere-ai/rcp-ndcg"
Repository = "https://github.com/cohere-ai/rcp-ndcg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The node script ships inside the package too: a wheel-installed rcp-ndcg-vllm carries its own wave 0
# (submit.sh mounts it from the checkout; an installed package finds it next to the module).
"rcp_ndcg_vllm.jobs" = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
