[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcp-ndcg-vllm"
version = "0.0.1"
description = "vLLM serving recipes for retrieval models, the equivalence harness, the engine recorder and the GPU wave runner."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
  { name = "RCP-nDCG contributors" },
]
keywords = ["information-retrieval", "vllm", "rerank", "embedding", "serving"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# Deliberately without vllm: the engine image carries it, and a torch pin here
# would fight every vLLM release.  This package talks to the engine over HTTP
# (rcp-ndcg and rcp-ndcg-vllm never import each other; they meet at the URL).
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
# The package's own CPU test suite (pytest, jinja2 for the served-template check,
# tokenizers for the fixture tokenizer).
test = [
  "pytest>=8.0",
  "jinja2>=3.1",
  "tokenizers>=0.21",
]

[project.urls]
Homepage = "https://github.com/cohere-ai/rcp-ndcg"
Repository = "https://github.com/cohere-ai/rcp-ndcg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
