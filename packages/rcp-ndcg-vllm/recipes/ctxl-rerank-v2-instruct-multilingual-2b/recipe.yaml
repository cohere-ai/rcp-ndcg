# ContextualAI/ctxl-rerank-v2-instruct-multilingual-2b served with stock vLLM, paper-exact.
#
# Paper reference: experiments/paper/rerankers/reference/contextual.py (ContextualRerank, moved
# unchanged from the former src/rcp_ndcg/retrieval/external_rerankers.py) with the paper config
# experiments/paper/rerankers/ctxl_rerank_2b.yaml (batch_size 16) and the paper budget
# MAX_SEQ_LENGTH = 8192 (retrieval/cross_encoder.py:42; the paper's own served path also capped
# queries at MAX_QUERY_LENGTH = 4096, cross_encoder.py:46). The served prompt is the paper's
# two-line frame (document before query, " ??" tail); the research lane (r-ctxl) measured every
# claim below on the checkpoint's config and tokenizer files, and proved the template render
# byte-identical to the paper prompt on CPU (the score path needs weights, so it is the GPU wave's).
# The audit-synth corrections for r-ctxl are applied throughout (stored/bf16 weight sizes, the
# vLLM line cites re-verified at the v0.31.0 tag, the ~14.0k-token long-doc magnitude).
id: ctxl-rerank-v2-instruct-multilingual-2b
model: ContextualAI/ctxl-rerank-v2-instruct-multilingual-2b
revision: "6ffef5dc552583b8db58dc4a87f79f7aee78d2d9"
role: rerank
input: [text]
scoring: pointwise
licence: CC-BY-NC-SA-4.0
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  min_version: "0.31.0"
  startup_timeout_s: 1800
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides:
    architectures: [Qwen3ForSequenceClassification]
    # "!" is token id 0 of this checkpoint's tokenizer (the relevance logit's vocabulary row,
    # read from tokenizer.json at the pinned revision; 1_LogitScore/config.json true_token_id 0).
    classifier_from_token: ["!"]
    method: no_post_processing
  # R10: the template file MUST ship and be passed with --chat-template. Without it vLLM only
  # logs a warning and then concatenates the query and documents with no frame at all.
  chat_template: template.jinja
  # The raw-logit server default: the classify pooler's built-in activation for a 1-label head is
  # sigmoid, and the paper's score is the raw logit. The client also sends use_activation: false
  # per request; this covers any client that does not (pooling_params._merge_default_parameters).
  pooler_config: {use_activation: false}
  trust_remote_code: false
  # The paper budget (MAX_SEQ_LENGTH); must stay >= client.max_tokens (8192).
  max_model_len: 8192
  dtype: bfloat16
  plugin: null
  extra_args: []
client:
  api: rerank
  recipe: "vllm v0.31.0: --runner pooling, hf_overrides Qwen3ForSequenceClassification + classifier_from_token [\"!\"] + method no_post_processing, --chat-template template.jinja, pooler_config use_activation false (1-row score head = the lm_head row of token id 0, raw logit, no sigmoid)"
  tokenizer: "ContextualAI/ctxl-rerank-v2-instruct-multilingual-2b@6ffef5dc552583b8db58dc4a87f79f7aee78d2d9"
  max_tokens: 8192
  query_max_tokens: 4096
  template:
    pair:
      - {fixed: "Check whether a given document contains information helpful to answer the query.\n<Document> "}
      - {content: document}
      - {fixed: "\n<Query> "}
      - {content: query}
      # The anchor tail: the paper prompt (and the score) ends here - the causal LM's final
      # position, whose vocabulary-0 logit is the relevance score. Reserved by every cut.
      - {fixed: " ??"}
    anchor: last
    add_special_tokens: {pair: true}
  instruction: fold
  use_activation: false
  on_overflow: cut
  empty_doc: send
  request_shape: text
reference:
  kind: transformers
  score_scale: logit
  entry: reference.py
  # The paper code truncates the WHOLE prompt from the right (truncation=True at 8192), so over
  # the cap it drops the trailing " ??" anchor and the query behind it; the served path reserves
  # the anchor and cuts the content spans only. The deviation is declared, not copied.
  known_deviations: [anchor_drop_over_cap]
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/ContextualAI/ctxl-rerank-v2-instruct-multilingual-2b @ 6ffef5dc552583b8db58dc4a87f79f7aee78d2d9: config.json (Qwen3ForCausalLM, bfloat16, id2label {0: LABEL_0}), tokenizer.json (ByteLevel post-processor, id 0 = \"!\"), tokenizer_config.json (model_max_length 131072, truncation_side unset), 1_LogitScore/config.json (true_token_id 0), config_sentence_transformers.json (activation_fn Identity)"
  - "vLLM v0.31.0 (image vllm/vllm-openai:v0.31.0, every line below read at the tag): config/model.py:2279 (the ForSequenceClassification suffix maps to runner pooling + convert classify), model_executor/models/registry.py:201 (Qwen3ForCausalLM), model_executor/models/adapters.py:593-617 (the 1-row score head lifted from lm_head[classifier_from_token]) and :659 (SEQ_CLS_LOAD_METHODS), model_executor/layers/pooler/activations.py:134-139 (a <2-label head's default activation is sigmoid), model_executor/layers/pooler/seqwise/heads.py:194 (the per-request use_activation flag), pooling_params.py:111-128 (_merge_default_parameters fills unset request fields from the pooler config), entrypoints/pooling/scoring/io_processor.py:693-705 (/rerank renders roles query and document through --chat-template), entrypoints/pooling/scoring/protocol.py:72 (the rendered prompt is tokenized with add_special_tokens=True)"
  - "rcp-ndcg: src/rcp_ndcg/retrieval/cross_encoder.py:42,46 (MAX_SEQ_LENGTH 8192, MAX_QUERY_LENGTH 4096), experiments/paper/rerankers/ctxl_rerank_2b.yaml, experiments/paper/rerankers/reference/contextual.py (the paper-exact ContextualRerank this reference.py derives from)"
  - "research lane r-ctxl: /root/repos/rcp-ndcg-lanes/research/r-ctxl/out/ (report.md, digest.md, reference_common.py, recipe-ctxl-rerank-v2-instruct-multilingual-2b.yaml, score-template-2b.jinja) with the audit-synth corrections for r-ctxl (research/audit-synth/out/corrections.md)"
notes: >-
  Template: the shipped template.jinja is the research lane's score template re-written dual-mode:
  when the harness's stage-1 check renders it with the query/document/instruction variables (the
  query already carrying the client's fold) it renders the reference-exact prompt, and otherwise it
  falls back to the messages-based body (the engine's safe_apply_chat_template passes exactly two
  messages, roles query and document), so the engine renders the same prompt bit-exactly without
  the vendor template's pitfalls (the vendor chat_template.jinja reads the instruction only from a
  system message vLLM never sends, and would silently drop it). The template adds no instruction of
  its own: the client's instruction mode is fold (the product's Task:/Query: fold, which the paper's
  served path applied and the paper's in-process reference never received an instruction), so the
  instruction rides inside the query span and stage 1's template check proves the file renders
  exactly what fit renders. R10: the template file MUST ship with the engine - served without
  --chat-template, vLLM only logs a warning and then concatenates query and documents with no
  frame. The wave's T0 smoke should probe it (a /tokenize of one rendered prompt must carry the
  frame and end with the " ??" anchor token). Budget: max_tokens 8192 is the paper's MAX_SEQ_LENGTH,
  counted as the engine sees the whole prompt (frame + document + query + anchor); query_max_tokens
  4096 is the paper's MAX_QUERY_LENGTH (its own served path sent it as max_tokens_per_query), which
  binds on pair overflow only - the query is cut to it first and the document keeps the rest, every
  cut a content-span cut with the " ??" anchor reserved. The paper's in-process path instead
  right-truncates the whole prompt at 8192 (document first, so a long document pushes the query and
  the anchor out of the prompt): that drop is the declared anchor_drop_over_cap deviation, reported
  per pair at stage 2, non-gating; the gates run on the under-cap pairs, whose renders are
  byte-identical. Residual long-query note: the reference has no query-side cap, so a query between
  4096 tokens and the pair budget diverges by design on an over-share pair (served query head vs
  reference whole query) - the paper's own served behaviour, bounded by the same query share; a
  pairs file that keeps queries at or under MAX_QUERY_LENGTH never hits it. Scores: the served
  score is the raw logit of vocabulary position 0 at the final position (use_activation false on
  the client and in the pooler config); the fp32 score head vs the reference's bf16 head is
  bounded by the logit gate (an unmeasured RFC proposal, not a measured bound - audit-synth's
  correction of the r-ctxl decline reason). No plugin: the architecture override, the chat
  template and the pooler config suffice on the stock v0.31.0 image.
