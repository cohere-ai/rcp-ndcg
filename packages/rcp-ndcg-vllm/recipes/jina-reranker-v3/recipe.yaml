# jinaai/jina-reranker-v3, served with stock vLLM (image vllm/vllm-openai:v0.31.0, native JinaForRanking).
#
# The declared pair shape below mirrors the engine's own 1-vs-1 prompt builder byte for byte
# (vLLM JinaRankingIOProcessorMixin.format_docs_prompts_func, itself byte-identical to the
# checkpoint's modeling.py at the pinned revision; both verified by the research lane's instrument).
# The specials are written by name and resolved from the recipe tokenizer's added tokens; nothing
# is typed literally.  The listwise N-passage prompt is the engine's own builder too; the pair shape
# is the per-pair frame the product's text budget reserves and cuts against.
id: jina-reranker-v3
model: jinaai/jina-reranker-v3
revision: "d7d7e73b6ea138ced340b83865931b5dfb6c97aa"
role: rerank
input: [text]
scoring: listwise
licence: cc-by-nc-4.0
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  min_version: "0.31.0"
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides: {}
  chat_template: null
  # The score's scale is content (raw cosine): pin the server-side default too, so any client
  # that does not send use_activation cannot silently scale the scores (the sweep's rule: both
  # the server default and the wire field, as ctxl and zerank-1-small do).
  pooler_config: {use_activation: false}
  trust_remote_code: false
  max_model_len: 131072
  dtype: bfloat16
  plugin: null
  extra_args: []
client:
  api: rerank
  # Identity content (client_config keeps it, and fills the recipe id when absent): the merged
  # product's serving settings the client cannot read.
  recipe: "vllm v0.31.0: --runner pooling; the server-side Jina ranking prompt builder and the marker-token projector pooler (float32 cosine, use_activation false); the request caps max_tokens_per_doc 2048 / max_tokens_per_query 512"
  request_shape: text
  template:
    pair:
      - fixed: "{special:im_start}system\nYou are a search relevance expert who can determine a ranking of the passages based on how relevant they are to the query. If the query is a question, how relevant a passage is depends on how well it answers the question. If not, try to analyze the intent of the query and assess how well each passage satisfies the intent. If an instruction is provided, you should follow the instruction when determining the ranking.{special:im_end}\n{special:im_start}user\nI will provide you with 1 passages, each indicated by a numerical identifier. Rank the passages based on their relevance to query: "
      - content: query
      - fixed: "\n<passage id=\"0\">\n"
      - content: document
      - fixed: "{special:embed_token}\n</passage>\n<query>\n"
      - content: query
      - fixed: "{special:rerank_token}\n</query>{special:im_end}\n{special:im_start}assistant\n{special:<think>}\n\n{special:</think>}\n\n"
    anchor: marker
    anchor_markers: [embed_token, rerank_token]
    add_special_tokens: true
  instruction: none
  tokenizer: "jinaai/jina-reranker-v3@d7d7e73b6ea138ced340b83865931b5dfb6c97aa"
  max_tokens: 3219
  query_max_tokens: 512
  on_overflow: cut
  empty_doc: omit_zero
  use_activation: false
  listwise: true
reference:
  kind: remote_code
  score_scale: cosine
  entry: reference.py
  # The reference is faithful to the checkpoint's own per-text truncation (decode-back, 512/2048)
  # and never ports the client's cut (the operator's 09x rule). The markers survive every cut
  # (they ride in the engine-built frame), but over-cap spans differ from the client's verbatim
  # cuts -- over-cap rows are the declared non-gating table.
  known_deviations: ["over_cap_cut_differs"]
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/jinaai/jina-reranker-v3 (repo; sha d7d7e73b6ea138ced340b83865931b5dfb6c97aa re-checked against https://huggingface.co/api/models/jinaai/jina-reranker-v3)"
  - "https://huggingface.co/jinaai/jina-reranker-v3/raw/d7d7e73b6ea138ced340b83865931b5dfb6c97aa/config.json (architectures JinaForRanking; max_position_embeddings 131072; torch_dtype bfloat16)"
  - "https://huggingface.co/jinaai/jina-reranker-v3/raw/d7d7e73b6ea138ced340b83865931b5dfb6c97aa/modeling.py (rerank(): block_size 125, max_doc_length 2048, max_query_length 512, flush at >=125 docs or capacity <= 2048; _truncate_texts; format_docs_prompts_func; projector 1024->512->ReLU->512; ids 151670/151671)"
  - "https://huggingface.co/jinaai/jina-reranker-v3/raw/d7d7e73b6ea138ced340b83865931b5dfb6c97aa/added_tokens.json (embed_token 151670, rerank_token 151671)"
  - "https://huggingface.co/jinaai/jina-reranker-v3/raw/d7d7e73b6ea138ced340b83865931b5dfb6c97aa/README.md (licence CC BY-NC 4.0)"
  - ".refs/vllm@v0.31.0 vllm/model_executor/models/registry.py (JinaForRanking; :269 at the .refs HEAD d0d6e5f3a, :278 at the tag); vllm/model_executor/models/jina.py:44-146 (JinaForRanking, DispatchPooler token_embed, hard-coded ids 151670/151671, float32 cosine)"
  - ".refs/vllm@v0.31.0 vllm/entrypoints/pooling/scoring/io_processor.py:754-812 (JinaRankingIOProcessorMixin.format_docs_prompts_func, the server-side builder; no chat template on this path), :830-883 (one query's whole candidate set in one prompt), vllm/entrypoints/pooling/scoring/protocol.py:21-44 (max_tokens_per_query/max_tokens_per_doc defaults 0 = off; instruction via chat_template_kwargs) and vllm/entrypoints/pooling/scoring/utils.py:42-54 (truncate_text_to_tokens, the per-text offset slice the request caps apply)"
  - ".refs/vllm@v0.31.0 vllm/entrypoints/pooling/embed/io_processor.py:656-700 (JinaRankingTokenEmbedIOProcessor: POST /pooling task token_embed, docs-then-query, for the client-side block replication)"
  - ".refs/vllm@v0.31.0 tests/models/language/pooling/test_jina_reranker_v3.py:25-41 (listwise dependence: 0.345703125 1-vs-1 vs 0.294921875 1-vs-N; TOL 0.01), :50,62 (serving flags)"
  - "experiments/paper/rerankers/jina_v3.yaml (the paper's served-path config; recipe: jina-reranker-v3)"
  - "experiments/paper/rerankers/reference/jina.py (the paper-exact in-process reference this reference.py derives from)"
  - "experiments/paper/rerankers/reference/jina.py (the paper's JinaRerank harness, moved unchanged out of the removed src/rcp_ndcg/retrieval/external_rerankers.py:397-455 when retrieval unified -- the old line cites name that pre-unification tree: empty docs score 0.0, index re-alignment; predict() at :65-76)"
  - "src/rcp_ndcg/cli/retrieval.py:132 (the paper reranks depth-150 pools -- the CLI's rerank depth default; :133 at the lanes' base)"
  - "research record: research/r-jina3/out/ (report.md, digest.md, recipe-draft.yaml, reference-draft.py, review/guard.md); corrections r-jina3 rows in research/audit-synth/out/corrections.md; ANCHOR-FINDING.md; REVIEW-LOG.md R10/R20"
notes: >-
  Score: raw cosine similarity in [-1, 1] (float32) of the projector-transformed states at the two
  marker tokens (embed_token 151670 per document, rerank_token 151671 for the query); no sigmoid,
  softmax, temperature or scale, so use_activation is explicitly false -- pinned both as the wire
  field and as serve.pooler_config's server-side default (a request that leaves it unset merges
  the pooler default, and the token_embed task's built-in default is true: vllm/pooling_params.py
  _set_default_parameters at the tag), so any caller of the engine gets the raw-cosine scale.  The model is listwise: one
  query's whole candidate set travels in one prompt, built SERVER-SIDE by vLLM's native Python
  builder (JinaRankingIOProcessorMixin.format_docs_prompts_func), which is byte-identical to the
  checkpoint's modeling.py (measured by the research instrument; re-verified at the v0.31.0 tag).
  NO chat-template file ships on purpose (serve.chat_template: null): this architecture's prompt
  builder is Python, not a jinja template, and vLLM never consults a chat template on the Jina path;
  the R10 warn-and-concatenate fallback belongs to template-driven io processors.  The declared pair
  template mirrors that builder's 1-vs-1 render byte for byte (stage 1's render check proves it);
  the N-passage listwise prompt is the engine's own builder with the same frame.  The query appears
  twice (the intro line and the <query> block): the declared pair shape spans it twice. The pair
  fit binds on overflow only (an under-budget pair ships whole); the rerank client settles the
  shared query span once per call -- whenever the query exceeds its share (query_max_tokens 512)
  it ships at it, recorded once in the census under the doc id <query> -- and fills both spans
  with the settled query, exactly the checkpoint's single truncation. Per-shape query cap
  (checked for the sweep's query_max_tokens item): the reference truncates queries at 512
  tokens (the checkpoint's max_query_length, decode-back, modeling.py _truncate_texts) --
  query_max_tokens 512 declares exactly it.  Budget: max_tokens 3219 = the measured fixed frame (147 tokens, empty content,
  pinned tokenizer) + query_max_tokens 512 TWICE (the query spans the prompt two times -- the intro
  line and the <query> block -- so the budget reserves both copies) + 2048 (the checkpoint's
  per-document cap); 147 + 2*512 + 2048 = 3219 is the checkpoint's own worst-case 1-vs-1 prompt, and
  every pair within its per-text caps (query <= 512, document <= 2048) renders under this budget
  uncut.  The client's document cut therefore binds at 3072 - 2*q_tokens (q = the fitted query's
  tokens), at or above the checkpoint's 2048 cap for every declared query; documents over the cap
  then bind at the engine's per-text max_tokens_per_doc=2048 -- the consumer MUST send the engine's
  request fields max_tokens_per_doc=2048 and max_tokens_per_query=512 on every rerank request (vLLM
  defaults are 0 = off, while the checkpoint truncates 2048/512 per text BEFORE templating on every
  call; the two rules were measured byte-identical on a 4000-token document).  Without those request
  fields a document in (2048, 3072 - 2*q] would reach the model uncut where the paper truncated it.
  Product gap (this recipe cannot fix
  it, report to the owner): today's served client sends no max_tokens_per_doc, sends
  max_tokens_per_query=4096, hard-codes truncate_prompt_tokens=8192 (a right cut that silently drops
  later passages and the <query> block on prompts over 8192 tokens -- never send it), folds dataset
  instructions into the query text as "Task: ..." (this recipe's instruction is none: the paper
  sends the bare query), and does not filter empty documents (empty_doc: omit_zero declares the
  paper's rule: whitespace-only documents score exactly 0.0 without a model call).  EQUIVALENCE HAS
  TWO REGIMES.  (1) Single-block (fewer than 125 documents AND residual capacity 131072 - 2*q_len
  strictly above 2048 after every document -- the flush test is <=): POST /rerank with the whole
  candidate set equals the paper's scores up to bf16 numerics (vLLM's own tolerance 0.01; the gate
  is |delta| <= 0.01 on cosine, median Kendall tau >= 0.98).  (2) The paper's NORMAL regime at depth
  150: the checkpoint's rerank() blocks documents -- simulated with modeling.py's own constants, 150
  cap-length (2048-token) documents block as [63, 63, 24] (the token-capacity flush binds at ~63
  docs/block), short documents (<= ~1018 tokens) reach the 125-doc cap first ([125, 25]); each block
  gets its own query embed, the block weight is max((1+cos)/2) over its documents, the FINAL query
  embed is the block-weighted average and every document is scored against it in float32.  No single
  /rerank request can express that, and a full 150-document cap-length pool cannot even fit one
  prompt (lower bound: 150*2048 = 307,200 content tokens > max_model_len 131,072).  Equal-to-the-
  paper serving of depth-150 pools must replicate the block loop over POST /pooling (task
  token_embed): input [doc_1..doc_k, query] (the LAST item is the query) returns the projected
  512-d embeds in docs-then-query order; the client chunks documents exactly like rerank(), scores
  each block in float32, weights blocks by max((1+cos)/2), averages the query embeds, and emits the
  final float32 cosines.  That loop is not expressible in the recipe schema (a product gap: no
  block-loop field, no per-document budget next to the pair budget) -- reported, not worked around.
  HEADROOM for that client (record-audit-corrected numbers): rerank()'s capacity loop counts only
  document bodies, but each passage costs 13-16 wrapper+joiner prompt tokens on top of its body (the
  record's own averages: 13.86/document at a 63-document block, 14.28 at 150; the exact +/-1 boundary
  moves with BPE merges at the passage joins and the intro's passage-count digits), plus 151 fixed
  tokens for the record's zero-document probe render (a render that still carries both copies of its
  9-token probe query; the query-free frame measures 134, and the formula's 2*q_len term reserves the
  query).  A client flush rule must keep 125*15 + 151 + 2*q_len + 2048 under the spare capacity
  (conservative: the measured worst case sits ~100 tokens lower), or vLLM refuses blocks the paper
  scored.
  Reference: the checkpoint's remote code (transformers AutoModel, auto_map, trust_remote_code=true,
  revision pinned) -- kind: remote_code; its environment is documented in requirements-reference.txt
  beside reference.py.  The reference stays faithful to the checkpoint's per-text truncation
  (decode-back, 2048/512 -- exactly as rerank() stages the texts) and never ports the client's cut
  (the operator's 09x rule); the served client cuts verbatim prefixes against its pair budget.
  Both honour the anchors (the markers ride in the engine-built frame), but the over-cap cuts
  differ -- so the recipe declares reference.known_deviations: over_cap_cut_differs, and over-cap
  pairs are reported in the non-gating table while only under-cap pairs gate.  The checkpoint also
  sanitizes the two marker tokens out of the user text before formatting; the declared template
  cannot express that, so a pairs row whose query or document contains a marker literal would fail
  stage 1's render check by design -- keep marker literals out of evaluated inputs.  Stage 1's render
  check is likewise a byte comparison for pairs whose contents sit at or under the checkpoint's
  per-text caps: the client's room-bound cut is 3072 - 2*q_tokens, so a pairs row whose document
  sits between the checkpoint's per-text cap (2048) and that cut renders differently on the two
  sides (the checkpoint truncates, the declared budget does not yet bind), and evaluated pairs
  therefore keep documents at or under 2048 tokens and queries at or under 512 (147 + 2*512 + 2048
  = 3219 = the budget, so such pairs always render uncut); over-budget behaviour rides the
  declared over_cap_cut_differs table (reported, not gated), where the engine's per-text caps
  (max_tokens_per_doc/max_tokens_per_query) still keep the served prompt equal to the reference's
  per-text truncation.  An over-share query (over 512 tokens) is a
  declared divergence row: the client settles the query verbatim at its 512-token share while the
  checkpoint truncates decode-back (both honour the cap; the boundary bytes can differ), so
  evaluated pairs keep queries at or under 512 tokens.
