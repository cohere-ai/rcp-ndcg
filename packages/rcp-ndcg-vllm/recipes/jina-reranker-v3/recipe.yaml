# jinaai/jina-reranker-v3, served with stock vLLM (image vllm/vllm-openai:v0.31.0, native JinaForRanking).
#
# The declared pair shape below mirrors the engine's own 1-vs-1 prompt builder byte for byte
# (vLLM JinaRankingIOProcessorMixin.format_docs_prompts_func, itself byte-identical to the
# checkpoint's modeling.py at the pinned revision; both verified by the research lane's instrument).
# The specials are written by name and resolved from the recipe tokenizer's added tokens; nothing
# is typed literally.  The listwise N-passage prompt is the engine's own builder too; the pair shape
# is the per-pair frame the product's text budget reserves and cuts against.
id: jina-reranker-v3
model: jinaai/jina-reranker-v3
revision: "d7d7e73b6ea138ced340b83865931b5dfb6c97aa"
role: rerank
input: [text]
scoring: listwise
licence: cc-by-nc-4.0
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  min_version: "0.31.0"
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides: {}
  chat_template: null
  pooler_config: {}
  trust_remote_code: false
  max_model_len: 131072
  dtype: bfloat16
  plugin: null
  extra_args: []
client:
  api: rerank
  request_shape: text
  template:
    pair:
      - fixed: "{special:im_start}system\nYou are a search relevance expert who can determine a ranking of the passages based on how relevant they are to the query. If the query is a question, how relevant a passage is depends on how well it answers the question. If not, try to analyze the intent of the query and assess how well each passage satisfies the intent. If an instruction is provided, you should follow the instruction when determining the ranking.{special:im_end}\n{special:im_start}user\nI will provide you with 1 passages, each indicated by a numerical identifier. Rank the passages based on their relevance to query: "
      - content: query
      - fixed: "\n<passage id=\"0\">\n"
      - content: document
      - fixed: "{special:embed_token}\n</passage>\n<query>\n"
      - content: query
      - fixed: "{special:rerank_token}\n</query>{special:im_end}\n{special:im_start}assistant\n{special:<think>}\n\n{special:</think>}\n\n"
    anchor: marker
    anchor_markers: [embed_token, rerank_token]
    add_special_tokens: true
  instruction: none
  tokenizer: "jinaai/jina-reranker-v3@d7d7e73b6ea138ced340b83865931b5dfb6c97aa"
  max_tokens: 3219
  query_max_tokens: 512
  on_overflow: cut
  empty_doc: omit_zero
  use_activation: false
  listwise: true
reference:
  kind: remote_code
  score_scale: cosine
  entry: reference.py
  known_deviations: []
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/jinaai/jina-reranker-v3 (repo; sha d7d7e73b6ea138ced340b83865931b5dfb6c97aa re-checked against https://huggingface.co/api/models/jinaai/jina-reranker-v3)"
  - "https://huggingface.co/jinaai/jina-reranker-v3/raw/d7d7e73b6ea138ced340b83865931b5dfb6c97aa/config.json (architectures JinaForRanking; max_position_embeddings 131072; torch_dtype bfloat16)"
  - "https://huggingface.co/jinaai/jina-reranker-v3/raw/d7d7e73b6ea138ced340b83865931b5dfb6c97aa/modeling.py (rerank(): block_size 125, max_doc_length 2048, max_query_length 512, flush at >=125 docs or capacity <= 2048; _truncate_texts; format_docs_prompts_func; projector 1024->512->ReLU->512; ids 151670/151671)"
  - "https://huggingface.co/jinaai/jina-reranker-v3/raw/d7d7e73b6ea138ced340b83865931b5dfb6c97aa/added_tokens.json (embed_token 151670, rerank_token 151671)"
  - "https://huggingface.co/jinaai/jina-reranker-v3/raw/d7d7e73b6ea138ced340b83865931b5dfb6c97aa/README.md (licence CC BY-NC 4.0)"
  - ".refs/vllm@v0.31.0 vllm/model_executor/models/registry.py (JinaForRanking; :269 at the .refs HEAD d0d6e5f3a, :278 at the tag); vllm/model_executor/models/jina.py:44-146 (JinaForRanking, DispatchPooler token_embed, hard-coded ids 151670/151671, float32 cosine)"
