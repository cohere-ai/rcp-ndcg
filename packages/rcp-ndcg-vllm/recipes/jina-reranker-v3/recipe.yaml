notes: >-
  Score: raw cosine similarity in [-1, 1] (float32) of the projector-transformed states at the two
  marker tokens (embed_token 151670 per document, rerank_token 151671 for the query); no sigmoid,
  softmax, temperature or scale, so use_activation is explicitly false.  The model is listwise: one
  query's whole candidate set travels in one prompt, built SERVER-SIDE by vLLM's native Python
  builder (JinaRankingIOProcessorMixin.format_docs_prompts_func), which is byte-identical to the
  checkpoint's modeling.py (measured by the research instrument; re-verified at the v0.31.0 tag).
  NO chat-template file ships on purpose (serve.chat_template: null): this architecture's prompt
  builder is Python, not a jinja template, and vLLM never consults a chat template on the Jina path;
  the R10 warn-and-concatenate fallback belongs to template-driven io processors.  The declared pair
  template mirrors that builder's 1-vs-1 render byte for byte (stage 1's render check proves it);
  the N-passage listwise prompt is the engine's own builder with the same frame.  The query appears
  twice (the intro line and the <query> block): the declared pair shape spans it twice, and the
  product's fit cuts it once to query_max_tokens and fills both spans, exactly the checkpoint's
  single truncation.  Budget: max_tokens 3219 = the measured fixed frame (147 tokens, empty content,
  pinned tokenizer) + query_max_tokens 512 TWICE (the query spans the prompt two times -- the intro
  line and the <query> block -- so the budget reserves both copies) + 2048 (the checkpoint's
  per-document cap); 147 + 2*512 + 2048 = 3219 is the checkpoint's own worst-case 1-vs-1 prompt, and
  every pair within its per-text caps (query <= 512, document <= 2048) renders under this budget
  uncut.  The client's document cut therefore binds at 3072 - 2*q_tokens (q = the fitted query's
  tokens), at or above the checkpoint's 2048 cap for every declared query; documents over the cap
  then bind at the engine's per-text max_tokens_per_doc=2048 -- the consumer MUST send the engine's
  request fields max_tokens_per_doc=2048 and max_tokens_per_query=512 on every rerank request (vLLM
  defaults are 0 = off, while the checkpoint truncates 2048/512 per text BEFORE templating on every
  call; the two rules were measured byte-identical on a 4000-token document).  Without those request
  fields a document in (2048, 3072 - 2*q] would reach the model uncut where the paper truncated it.
  Product gap (this recipe cannot fix
  it, report to the owner): today's served client sends no max_tokens_per_doc, sends
  max_tokens_per_query=4096, hard-codes truncate_prompt_tokens=8192 (a right cut that silently drops
  later passages and the <query> block on prompts over 8192 tokens -- never send it), folds dataset
  instructions into the query text as "Task: ..." (this recipe's instruction is none: the paper
  sends the bare query), and does not filter empty documents (empty_doc: omit_zero declares the
  paper's rule: whitespace-only documents score exactly 0.0 without a model call).  EQUIVALENCE HAS
  TWO REGIMES.  (1) Single-block (fewer than 125 documents AND residual capacity 131072 - 2*q_len
  strictly above 2048 after every document -- the flush test is <=): POST /rerank with the whole
  candidate set equals the paper's scores up to bf16 numerics (vLLM's own tolerance 0.01; the gate
  is |delta| <= 0.01 on cosine, median Kendall tau >= 0.98).  (2) The paper's NORMAL regime at depth
  150: the checkpoint's rerank() blocks documents -- simulated with modeling.py's own constants, 150
  cap-length (2048-token) documents block as [63, 63, 24] (the token-capacity flush binds at ~63
  docs/block), short documents (<= ~1018 tokens) reach the 125-doc cap first ([125, 25]); each block
  gets its own query embed, the block weight is max((1+cos)/2) over its documents, the FINAL query
  embed is the block-weighted average and every document is scored against it in float32.  No single
  /rerank request can express that, and a full 150-document cap-length pool cannot even fit one
  prompt (lower bound: 150*2048 = 307,200 content tokens > max_model_len 131,072).  Equal-to-the-
  paper serving of depth-150 pools must replicate the block loop over POST /pooling (task
  token_embed): input [doc_1..doc_k, query] (the LAST item is the query) returns the projected
  512-d embeds in docs-then-query order; the client chunks documents exactly like rerank(), scores
  each block in float32, weights blocks by max((1+cos)/2), averages the query embeds, and emits the
  final float32 cosines.  That loop is not expressible in the recipe schema (a product gap: no
  block-loop field, no per-document budget next to the pair budget) -- reported, not worked around.
  HEADROOM for that client (record-audit-corrected numbers): rerank()'s capacity loop counts only
  document bodies, but each passage costs 13 wrapper+joiner prompt tokens at passage ids 0-8 (14 at
  ids 9-99, 15 at ids 100+ -- the step lands at the 10th document because the intro's passage count
  grows "9" -> "10") on top of its body, plus 151 fixed tokens for the zero-document render (the
  digest's earlier "13/doc + 132 fixed" double-subtracted one document body; 13/doc itself holds
  only for single-digit passage ids).  A client flush rule must keep
  125*15 + 151 + 2*q_len + 2048 under the spare capacity, or vLLM refuses blocks the paper scored.
  Reference: the checkpoint's remote code (transformers AutoModel, auto_map, trust_remote_code=true,
  revision pinned) -- kind: remote_code; its environment is documented in requirements-reference.txt
  beside reference.py.  The reference truncates per text (decode-back) where the served client cuts
  verbatim prefixes; both honoured the anchors on every probed document, so no
  known_deviations is declared and over-cap pairs stay inside the gates.  The checkpoint also
  sanitizes the two marker tokens out of the user text before formatting; the declared template
  cannot express that, so a pairs row whose query or document contains a marker literal would fail
  stage 1's render check by design -- keep marker literals out of evaluated inputs.  Stage 1's render
  check is likewise a byte comparison for pairs whose contents sit at or under the checkpoint's
  per-text caps: the client's room-bound cut is 3072 - 2*q_tokens, so a pairs row whose document
  sits between the checkpoint's per-text cap (2048) and that cut renders differently on the two
  sides (the checkpoint truncates, the declared budget does not yet bind), and evaluated pairs
  therefore keep documents at or under 2048 tokens and queries at or under 512 (147 + 2*512 + 2048
  = 3219 = the budget, so such pairs always render uncut); over-budget behaviour is audited by
  stage 1's own over-length samples (anchors only) and gated in stage 2, where the engine's per-text
  caps make the served prompt equal the reference's.
