# Qwen/Qwen3-Reranker-4B: paper-exact serving recipe (vLLM, out-of-the-box image).
#
# Paper reference: experiments/paper/rerankers/reference/qwen3.py (QwenOGRerank, unchanged
# behaviour; the paper's in-process numbers rest on it), batch_size 8 per
# experiments/paper/rerankers/qwen3_reranker_4b.yaml. Research: research/r-qwen3-rer/out/
# (report, digest, check_tokens.py) with the audit-synth corrections applied.
id: qwen3-reranker-4b
model: Qwen/Qwen3-Reranker-4B
revision: "22e683669bc0f0bd69640a1354a6d0aebcfeede5"
role: rerank
input: [text]
scoring: pointwise
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0"}
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides:
    # Turns the Qwen3ForCausalLM checkpoint into the 1-label sequence-classification
    # head (W_yes - W_no, float32 diff, sigmoid): native at this engine, no --convert.
    architectures: [Qwen3ForSequenceClassification]
    classifier_from_token: ["no", "yes"]
    is_original_qwen3_reranker: true
  # The template file ships in this directory and the argv names it (REVIEW-LOG R10:
  # without it the engine only WARNS at startup, because is_original_qwen3_reranker is
  # set, then silently concatenates the prompts per request). It is the paper-exact
  # frame patched with one trailing newline: the engine's renderer drops the file's
  # final newline, and the paper prompt ends with a double newline (token 271 of this
  # tokenizer); the stock example file renders one newline short of the reference
  # (measured on 3/3 probe pairs).
  chat_template: template.jinja
  # The score head's activation pinned server-side and on the wire (one family rule):
  # the classify pooler's default for a 1-label head is sigmoid
  # (vllm/model_executor/layers/pooler/activations.py at the v0.31.0 tag), and
  # pooler_config is the engine-side default every /rerank request merges with
  # (vllm/pooling_params.py _merge_default_parameters); the pin covers any client that
  # does not send the field. client.use_activation below sends the same value on the wire.
  pooler_config: {use_activation: true}
  trust_remote_code: false
  max_model_len: 10000        # the model card's own serving value; >= the 8192 budget
  dtype: bfloat16             # the paper pipeline's DTYPE
  plugin: null
  extra_args: []
client:
  api: rerank
  recipe: "vLLM v0.31.0 pooling runner; Qwen3ForCausalLM converted to Qwen3ForSequenceClassification in-engine (hf_overrides: classifier_from_token [no, yes], is_original_qwen3_reranker); the paper chat template (template.jinja); sigmoid-activated 1-label score head; client-side pair cut at 8192 tokens"
  tokenizer: "Qwen/Qwen3-Reranker-4B@22e683669bc0f0bd69640a1354a6d0aebcfeede5"
  max_tokens: 8192            # MAX_SEQ_LENGTH (the paper's pair budget; frame reserved)
  query_max_tokens: 4096      # MAX_QUERY_LENGTH: the query's share of the pair budget
  template:
    pair:
      - fixed: "{special:im_start}system\nJudge whether the Document meets the requirements based on the Query and the Instruct provided. Note that the answer can only be \"yes\" or \"no\".{special:im_end}\n{special:im_start}user\n<Instruct>: Given a web search query, retrieve relevant passages that answer the query\n<Query>: "
      - {content: query}
      - fixed: "\n<Document>: "
      - {content: document}
      - fixed: "{special:im_end}\n{special:im_start}assistant\n{special:<think>}\n\n{special:</think>}\n\n"
    anchor: last
    add_special_tokens: true   # the routes' default; this tokenizer's post-processor appends nothing
  instruction: none            # the client sends no instruction; the template's fixed default
                               # instruction is the paper's (config_sentence_transformers.json);
                               # per-row instructions are dropped, as in the paper runs
  use_activation: true         # the served head is a probability (sigmoid); the reference's
                               # softmax([no, yes])[yes] is the same scale (serve.pooler_config
                               # pins the same value server-side)
  request_shape: text
  batch_size: 8                # documents per request, the paper's 4B config
  on_overflow: cut             # content spans only, anchors reserved, template re-attached
  empty_doc: send
reference:
  kind: transformers           # AutoModelForCausalLM + the manual chat markers, the model
                               # card's own recipe, at the paper's bfloat16
  score_scale: probability     # softmax([no, yes])[yes] in [0, 1]
  entry: reference.py
  # One over-cap policy family-wide (the sweep's one family decision): the reference keeps every
  # anchor and cuts over-cap content the paper's way (the joint longest_first pair cut), never
  # copying the client's cut -- so the harness reports over-cap rows non-gating and gates
  # under-cap rows exactly. The old anchor_drop_over_cap label was wrong: this reference never
  # drops an anchor (prefix and suffix reserved and re-attached).
  known_deviations: [over_cap_cut_differs]
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/Qwen/Qwen3-Reranker-4B (sha 22e683669bc0f0bd69640a1354a6d0aebcfeede5): README.md, config.json, config_sentence_transformers.json, chat_template.jinja; revision re-checked against the Hub API"
  - "vLLM d0d6e5f3a (image vllm/vllm-openai:v0.31.0; d0d6e5f3a is 376 commits ahead of the v0.31.0 tag, 27 behind; adapters.py and the score examples are zero-diff tag->d0d6e5f3a per the research measurement, while models/config.py, io_processor.py, renderers/hf.py, registry.py and config/model.py differ by error-output plumbing and config bookkeeping - the line numbers below hold at d0d6e5f3a, and in the tag build io_processor's warning and concatenation sit about 29 lines earlier): examples/pooling/score/qwen3_reranker_offline.py; examples/pooling/score/template/qwen3_reranker.jinja (685 B, one trailing newline short of the paper prompt); vllm/model_executor/models/adapters.py:566-571 (score_weight float32 diff) and :307 (as_seq_cls_model); vllm/model_executor/models/config.py:783-801; vllm/entrypoints/pooling/scoring/io_processor.py:460-476 (the startup warning when is_original_qwen3_reranker is set without a template), :659-737 (get_score_prompt: the chat template is applied to [query, document] messages; without one the prompts are concatenated, :697-698); vllm/entrypoints/pooling/scoring/protocol.py:38-65 (the request instruction's route into chat_template_kwargs) and the stock template's instruction-default chain (examples/pooling/score/template/qwen3_reranker.jinja:4-6); vllm/renderers/hf.py:826-833 (safe_apply_chat_template)"
  - "no Qwen3ForSequenceClassification entry exists in vllm/model_executor/models/registry.py: the mapping is the suffix table at vllm/config/model.py:2318 -> _normalize_arch (registry.py:1286) -> as_seq_cls_model (vllm/model_executor/model_loader/utils.py:280)"
