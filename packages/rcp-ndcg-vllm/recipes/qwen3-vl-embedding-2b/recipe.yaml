notes: >-
  Frame: the model reads every input through its chat template - a system turn carrying the
  instruction, a user turn carrying the content, then the assistant header; the pooled token is the
  tokenizer post-processor's endoftext (id 151643) appended after it. The card frames a query exactly
  like a document: every usage example encodes queries without an instruction of their own, so the
  default "Represent the user's input." applies to both sides (format_model_input; the
  sentence-transformers prompts.default). The template therefore declares a query shape and a
  document shape with the same frame; the recipe's test renders the checkpoint's own
  chat_template.jinja at the pinned revision (hash-pinned) for one query and one document and
  requires both declared shapes to render the same strings. No template file ships (serve.chat_template
  null): the text rows ride the completion-style route, which applies no chat template at all - the
  frame is the client's declared template and the engine's post-processor appends the anchor - and a
  chat-shaped request would resolve the checkpoint's own chat_template.jinja at the pinned revision.
  The harness's template-render check renders one string per row and cannot tell two shapes apart, so
  it does not run here; the recipe's test takes its place against the checkpoint's file. A custom
  instruction is a different serving mode - a new template and judgement family, not this recipe (the
  pairs files carry no instruction field, and the reference refuses rows that carry one). The card's
  empty-input rule renders the text NULL, hence empty_doc: send_text "NULL" -- declared, but not yet
  applied by the product: the embed client applies empty_doc after the template render, so a templated
  role's empty document ships as an empty user turn, not NULL (a known product gap, being fixed in
  the product; the recipe's test pins it as a strict xfail), so the pairs files carry no empty
  documents until then. No query_max_tokens: the card
  caps the WHOLE prompt (MAX_LENGTH 8192) for both sides alike, mirrored by client.max_tokens.

  Budgets: client.max_tokens is the declared policy, reserved frame-first with the content span cut
  (on_overflow: cut); the embed client fits every request to it before shipping. The card's own
  truncation (the processor's truncation=True at max_length 8192) right-cuts the whole prompt: the
  frame's tail is cut and only the post-processor's endoftext is re-appended - the declared
  anchor_drop_over_cap deviation. reference.py renders exactly that cut (by character offsets on the
  rendered prompt, never a decode). What the harness does today, in stage 1 and stage 2 alike: it treats
  a text as over cap only when a cut's own content tokens (no frame) exceed client.max_tokens (8192);
  those rows are reported in the non-gating table under the declared deviation. A text that overflows
  only with the 20-token frame (content of at most 8192 tokens, render over 8192: content from about
  8173 tokens) is gated, and fails there, because the card cuts its frame tail and the client does
  not. The pairs files must keep every query and document within 8172 content tokens.

  Media (the pixel pin). Serve: serve.mm_processor_kwargs pins {min_pixels: 4096, max_pixels: 1843200} under the
  nested images_kwargs scope - ONE shape across the media recipes, decided from the v0.31.0 tag source:
  the nested dict reaches the HF processor's images_kwargs (and through it the resize) and the vLLM-side
  image token budget, while the flat form also re-sizes every video clip (see sources). Capacity: one
  media item per request (serve.limit_mm_per_prompt image=1 video=1; client.max_images and max_videos
  carry the same numbers). Client half: client.image_policy declares the same pixel numbers, but the
  product cannot apply them yet - its qwen3_vl geometry refuses any budget below the stock floor
  (65536 px), even when serve pins the engine to the very same budget, so no image_processor is
  declared and the client can neither resize nor count an image here. On top of that the declared
  request_shape text carries no media parts: the product refuses an image or video item on this route
  with a typed CapabilityError, and its messages route would wrap the already-framed text in the chat
  template a second time. Media therefore travel nowhere today - loudly refused, never silently
  changed. Two product changes unblock them (requested): an image budget the client may declare
  below the family's stock floor when the engine is pinned to it, and a messages lowering that sends
  the content and leaves the frame to the engine's template. The GPU wave must then run the pixel-pin
  probe-image engine check (the served prompt-token count for one probe image at the pinned budget).

  Video, ONE declared sampling policy on every side (the reconciliation): a clip is sampled to 64
  uniformly spaced frames over its whole length - client.video_policy {num_frames: 64, wire:
  video_url, engine_video_pinning: true}: the client sends the container as a video_url part (the
  multimodal embeddings lowering emits video_url per the policy) and the engine samples exactly those
  64 frames, pinned with --media-io-kwargs '{"video": {"num_frames": 64}}' (serve.extra_args), which
  engine_video_pinning declares and the GPU wave must verify at /tokenize. It supersedes both older
  samplers: the served defaults of the checkpoint's video processor (fps 2, min_frames 4, max_frames
  768) and the card script's container route (fps 1, max_frames 64). The reference side follows the
  same rule through the card's frame-list route (sample_frames at num_segments 64 keeps a 64-frame list
  unchanged), and reference.py refuses media rows loudly until a media wave supplies them. Not
  reconciled, and open for that wave: the per-clip pixel budget - the engine and the client's
  container count use the checkpoint's video size (4096..25165824 px per clip), the card script caps a
  clip at total_pixels 7864320 (and 786432 px per frame).

  Media equivalence is token-level only (measured on CPU: identical ids for text, image,
  image+text, video template, page image); the pairs files for both stages carry plain non-empty text
  and no instruction field.
