notes: >-
  Frame: the model reads every input through its chat template - a system turn carrying the
  instruction, a user turn carrying the content, then the assistant header; the pooled token is the
  tokenizer post-processor's endoftext (id 151643) appended after it. The card frames a query exactly
  like a document: every usage example encodes queries without an instruction of their own, so the
  default "Represent the user's input." applies to both sides (format_model_input; the
  sentence-transformers prompts.default). The template therefore declares a query shape and a
  document shape with the same frame; the recipe's test renders the checkpoint's own
  chat_template.jinja at the pinned revision (hash-pinned) for one query and one document and
  requires both declared shapes to render the same strings. No template file ships (serve.chat_template
  null): every item rides the messages route as one conversation carrying its content only, and the
  engine frames it with the checkpoint's own chat_template.jinja - its default system message is the
  card's instruction, and with add_generation_prompt true (sent; vLLM's chat routes default it to false)
  it closes with the assistant header, so the engine's render is the declared frame, once;
  add_special_tokens true (sent) appends the endoftext anchor. The harness's template check reads that
  checkpoint file at the pinned revision and renders it over every conversation the client sends. A
  custom instruction is a different serving mode - a new template and judgement family, not this recipe
  (the pairs files carry no instruction field, and the reference refuses rows that carry one). The card's
  empty-input rule renders the text NULL, hence empty_doc: send_text "NULL": the client decides on the
  content before the frame, so an empty document ships NULL inside the user turn, as the card renders
  it. No query_max_tokens: the card caps the WHOLE prompt (MAX_LENGTH 8192) for both sides alike,
  mirrored by client.max_tokens.

  Budgets: client.max_tokens is the declared policy, reserved frame-first with the content span cut
  (on_overflow: cut) and an item's media tokens reserved whole beside it; the embed client fits every
  request to it before shipping. The card's own truncation (the processor's truncation=True at
  max_length 8192) right-cuts the whole prompt: the frame's tail is cut and only the post-processor's
  endoftext is re-appended - the declared anchor_drop_over_cap deviation. reference.py renders exactly
  that cut (by character offsets on the rendered prompt, never a decode). The harness reports, in stage
  1 and stage 2 alike, every text the client changed (its processing record: a budget cut counted with
  the frame) in the non-gating table under the declared deviation, and gates every other text exactly.

  Media (the pixel pin). Serve: serve.mm_processor_kwargs pins {min_pixels: 4096, max_pixels: 1843200} under the
  nested images_kwargs scope - ONE shape across the media recipes, decided from the v0.31.0 tag source:
  the nested dict reaches the HF processor's images_kwargs (and through it the resize) and the vLLM-side
  image token budget, while the flat form also re-sizes every video clip (see sources). The checkpoint's
  own default is 4096..1310720 px (preprocessor_config.json), so the pin is load-bearing: unpinned, a
  page the client prepares above 1310720 px is resized again and counts other tokens. Capacity: one
  media item per request (serve.limit_mm_per_prompt image=1 video=1; client.max_images and max_videos
  carry the same numbers). Client half: image_processor qwen3_vl and client.image_policy with the same
  pixel numbers and engine_pixel_pinning true - the declaration that admits the card's 4096 px floor
  below the family's stock 65536 px - so the client resizes every image exactly as the card's
  fetch_image does (qwen-vl-utils smart_resize, factor 32) and counts it as the engine does. Media ride
  the messages route only, each item its own conversation, media before text (the card's
  format_model_input order). The harness's media stage holds the client's sent images (count, placement,
  prepared geometry, tokens) to reference.py --mode media and, against the engine, the engine's media
  count to the client's; the negative control that unpins the budget fails it (the pin's 1843200 px ceiling
  leaves the checkpoint's own 1310720).

  Video, ONE declared sampling policy on every side (the reconciliation): a clip is sampled to 64
  uniformly spaced frames over its whole length - client.video_policy {num_frames: 64, wire:
  video_url, engine_video_pinning: true}: the client sends the container as a video_url part (the
  multimodal embeddings lowering emits video_url per the policy) and the engine samples exactly those
  64 frames, pinned with --media-io-kwargs '{"video": {"num_frames": 64}}' (serve.extra_args), which
  engine_video_pinning declares and the GPU wave must verify at /tokenize. It supersedes both older
  samplers: the served defaults of the checkpoint's video processor (fps 2, min_frames 4, max_frames
  768) and the card script's container route (fps 1, max_frames 64). The reference side follows the
  same rule through the card's frame-list route (sample_frames at num_segments 64 keeps a 64-frame list
  unchanged). Not reconciled, and open for a video wave: the per-clip pixel budget - the engine and the
  client's container count use the checkpoint's video size (4096..25165824 px per clip), the card script
  caps a clip at total_pixels 7864320 (and 786432 px per frame); the media stage reports a container's
  tokens without gating them, and the generated media request set carries no clip.
