id: qwen3-vl-reranker-2b
model: Qwen/Qwen3-VL-Reranker-2B
revision: "4bd860ac4f15ad1897a214615cccc700f8f71818"
role: rerank
input: [text, image]
scoring: pointwise
licence: apache-2.0
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  min_version: "0.31.0"
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null            # not needed: the ForSequenceClassification suffix resolves to
                           # native Qwen3VLForConditionalGeneration wrapped by as_seq_cls_model
                           # (pooling/classify); config/model.py:1950 at checkout a5bd0b085
  hf_overrides:
    architectures: ["Qwen3VLForSequenceClassification"]
    classifier_from_token: ["no", "yes"]   # quoted: YAML reads a bare no as false. Order is
                                           # load-bearing: tokens[0]=no(false), tokens[1]=yes(true)
                                           # -> score head W[yes]-W[no] (adapters.py:532-539)
    is_original_qwen3_reranker: true       # sets method from_2_way_softmax, num_labels=1
                                           # (model_executor/models/config.py:784-815;
                                           # adapters.py:389-396)
  chat_template: template.jinja
  pooler_config: {}        # leave every pooler field unset: an empty PoolerConfig is the
                           # engine's defaults (LAST-token pooling, sigmoid with num_labels=1,
                           # fp32 head); the runner renders --pooler-config {} and changes nothing
  trust_remote_code: false # no auto_map, no model .py in the repo; the card sets it defensively
  max_model_len: 32768     # model card context length; config.json allows 262144
  dtype: bfloat16          # config.json dtype
  plugin: null             # native vLLM class + the conversion covers scoring; no plugin
  mm_processor_kwargs: {min_pixels: 4096, max_pixels: 1310720}   # the reference's numbers (R20);
                                                                 # 1280 tokens/image at max_pixels
  extra_args: []           # the wave runner passes --served-model-name <recipe id>; the client's
                           # model field is the same id, so name validation passes
client:
  api: rerank
  request_shape: text
  recipe: "vllm v0.31.0 pooling/classify: Qwen3VLForSequenceClassification via as_seq_cls_model;
    hf_overrides {architectures, classifier_from_token [no, yes], is_original_qwen3_reranker};
    served chat template template.jinja; pooler defaults (LAST, sigmoid, fp32 head), no
    pooler_config; mm_processor_kwargs min_pixels 4096 / max_pixels 1310720"
  tokenizer: "Qwen/Qwen3-VL-Reranker-2B@4bd860ac4f15ad1897a214615cccc700f8f71818"
  max_tokens: 8192         # the model's whole input as the engine sees it (rendered template,
                           # instruction, query and document together), cut client-side BEFORE
                           # sending: the engine's truncate_prompt_tokens right-cuts the composed
                           # prompt and loses the assistant tail (research case 12)
  query_max_tokens: 4096   # the query's share of the pair budget; the product's own served
                           # reranker caps the query at 4096 (src/rcp_ndcg/retrieval/
                           # cross_encoder.py:46 MAX_QUERY_LENGTH, sent as max_tokens_per_query);
                           # the document gets the rest. The reference caps the whole pair, not
                           # the query alone, but a declared share is required so an over-long
                           # query never eats the document's budget
  template:
    pair:
      - {fixed: "{special:im_start}system\nJudge whether the Document meets the requirements based on the Query and the Instruct provided. Note that the answer can only be \"yes\" or \"no\".{special:im_end}\n{special:im_start}user\n<Instruct>: Given a search query, retrieve relevant candidates that answer the query.<Query>:"}
      - {content: query}
      - {fixed: "\n<Document>:"}
      - {content: document}
      - {fixed: "{special:im_end}\n{special:im_start}assistant\n"}
    anchor: last            # the model scores at the last position: the assistant tail is the
                            # anchor every cut must keep (the card's script re-appends the last
                            # 5 ids for exactly this reason)
    add_special_tokens: true  # the scoring route tokenizes the rendered prompt with
                              # add_special_tokens=true (protocol build_tok_params); the Qwen
                              # post-processor appends nothing (measured), so ids are unchanged
  instruction: none        # the endpoint never sends an instruction field: the engine's template
                           # falls back to the card's default instruction, which is pinned as the
                           # fixed frame text above, so the declared render matches the engine for
                           # every request the client sends. A run-level instruction is dropped by
                           # declared policy; a different instruction means a new template file
                           # and a new recipe. instruction: field would leave the declared render
                           # with an empty span where the engine substitutes the default, and
                           # instruction: fold renders Task:/Query: inside <Query>: -- a
                           # structurally wrong prompt for this model (research, field vs fold).
  use_activation: true     # sigmoid probability, matching reference.score_scale: probability
                           # (PoolerClassify num_labels<2 -> F.sigmoid,
                           # activations.py:118-141; per-request use_activation=false would ask
                           # for the raw (W_yes-W_no).h_last logit instead)
  on_overflow: cut
  empty_doc: send_text     # the card's script sends the literal text "NULL" for an empty side
  empty_doc_text: "NULL"   # (format_mm_instruction); the served render of an empty document
                           # would otherwise be '<Document>:' with nothing (research case 8)
reference:
  kind: transformers       # the card's scripts/qwen3_vl_reranker.py is the serving referent;
                           # NOT the sentence-transformers referent (1_*/ modules.json declares
                           # Identity activation = raw logits and a different default prompt)
  score_scale: probability # sigmoid(W_yes - W_no . h_last), fp32 head
  entry: reference.py
  known_deviations: [anchor_drop_over_cap]  # the card's script truncates over-cap pairs itself
                                            # (keep every special token and the first
                                            # (8192 - specials) non-special tokens, re-append the
                                            # last 5 ids) -- a different kept-content set than the
                                            # client's offset-based cut, so over-cap scores are
                                            # reported non-gating and the gates run under cap
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/Qwen/Qwen3-VL-Reranker-2B @ 4bd860ac4f15ad1897a214615cccc700f8f71818
     (README.md, config.json, preprocessor_config.json, chat_template.jinja,
     additional_chat_templates/reranker.jinja, scripts/qwen3_vl_reranker.py,
     1_LogitScore/config.json)"
  - "https://huggingface.co/api/models/Qwen/Qwen3-VL-Reranker-2B (sha re-checked at recipe time:
     4bd860ac4f15ad1897a214615cccc700f8f71818)"
  - "https://github.com/vllm-project/vllm/blob/v0.31.0/examples/pooling/score/template/qwen3_vl_reranker.jinja
     (the served template; this recipe's copy rewrites the two expression blocks to the
     query/document variable convention with a messages fallback, byte-equal under the engine's
     render)"
  - "vllm renderers/hf.py:697 safe_apply_chat_template; scoring/protocol.py:38-66 (the /rerank
     instruction field merged into chat_template_kwargs); scoring/io_processor.py:1032
     get_score_prompt, :1139-1169 the chat-template render and the ChatTemplateResolutionError
     fallback (checkout a5bd0b085; the rerank-path files were verified tag-identical or
     diffed-unrelated by research/r-qwen3vl-rer)"
  - "vllm model_executor/models/config.py:784-815 (is_original_qwen3_reranker -> method
     from_2_way_softmax + classifier_from_token); model_executor/models/adapters.py:389-396
     (num_labels=1) and :473-552 load_weights_using_from_2_way_softmax with the fp32 head
     W[true] - W[false] at :532-539; vllm/config/model.py:1950 (the ForSequenceClassification
     suffix -> pooling/classify); model_executor/layers/pooler/activations.py:118-141
     (PoolerClassify, num_labels<2 -> sigmoid); model_executor/models/interfaces_base.py:160
     (default LAST pooling)"
  - "research/r-qwen3vl-rer/out/{report.md,digest.md,check_template.py,reference-draft.py,
     recipe-draft.yaml}: the 12-case CPU template-equivalence check (28/28), the served-vs-card
     render equality for text, instruction, image, video and media-both-sides shapes, and the
     four measured divergences (empty doc, multi-text-part side, instruction \"\", truncation)"
  - "research/audit-synth/out/corrections.md table r-qwen3vl-rer: image tokens are 1280/image at
     max_pixels 1310720 (the draft's 5120 was a 4x unit error); min_pixels pinned to the
     reference's 4096 (the 4095-vs-4096 same-bucket claim does not hold for thin strips);
     text+>=2 images per side bypasses the engine's multi-item guard (declared unmeasured gap)"
  - "research/ANCHOR-FINDING.md (cuts never touch anchors); REVIEW-LOG.md rows R10 (the template
     file must ship: without it the engine only warns and falls back to un-templated pair
     encoding) and R20 (pin mm_processor_kwargs and use the same numbers in the client media
     policy)"
notes: |
  Pointwise cross-encoder scored at the last position: served score = sigmoid((W_yes - W_no)
  . h_last) with an fp32 head; yes=9693, no=2152 (the snapshot vocab, equal to the repo's
  1_LogitScore/config.json; matches classifier_from_token ["no", "yes"] order). The recipe
  targets the card's transformers-script referent (sigmoid, default instruction "Given a search
  query, retrieve relevant candidates that answer the query."), not the sentence-transformers
  referent (config_sentence_transformers.json declares Identity activation = raw logits and a
  different default prompt).

  Instruction policy (declared): the client never sends the /rerank instruction field
  (instruction: none) and the engine's template default -- the card's default instruction --
  is pinned as fixed frame text in the template. The declared render therefore matches the
  engine for every request the client sends. A run that needs a different instruction must ship
  a new template file and a new recipe (a changed frame is a new judgement family and never
  pools with this one).

  Served template (template.jinja): vLLM v0.31.0's qwen3_vl_reranker.jinja with its two
  expression blocks rewritten to the recipe variable convention (query, document, instruction)
  and a messages fallback, so the file renders byte-identically both the way the harness's
  stage-1 template check calls it and the way the engine calls it (messages + the instruction
  chat-template kwarg; verified equal against the untouched upstream file). R10: the file must
  ship with the recipe -- without --chat-template the engine logs a startup warning
  (is_original_qwen3_reranker is set) and falls back to un-templated pair encoding; the
  per-request ChatTemplateResolutionError path degrades scores silently.

  Media policy (R20): serve.mm_processor_kwargs pins min_pixels 4096 / max_pixels 1310720 --
  the reference script's own numbers, so the engine and the reference resize identically by
  construction (the repo's preprocessor default min_pixels 4095 can tip one image token for thin
  strips). Image-token budget: 1280 tokens/image at max_pixels (px/1024 after the 2x2 merge;
  the draft's 5120 was a 4x unit error); the client's media reservation (fit's media_tokens)
  must reserve the same numbers once the media wiring lands (nothing consumes them client-side
  on this branch -- a declared product gap), and video is out of scope (input: [text, image]). Declared unmeasured:
  image grid expansion counts need the GPU wave's engine /tokenize probe (R20 p-media
  engine_check); a side carrying text plus >= 2 images bypasses vLLM's multi-item guard --
  the engine hoists placeholders to the front of the side and joins the texts with a newline,
  which the reference cannot express; keep one media item per side.

  Empty sides: the recipe pins empty_doc send_text with the card's own "NULL" placeholder
  (empty_doc_text "NULL") as the declared policy. Declared product gap: nothing consumes
  empty_doc on this branch (the consumer lands with the clients lane), so the rerank client
  sends an empty document as-is today, and the served render of an empty side ('<Query>:' or
  '<Document>:' with nothing) diverges from the reference, which sends "NULL" on an empty side
  (research case 8 measured exactly this for documents). The stage-1 render check goes red
  loudly on any empty-side pair -- the wave's gate data carries none -- and the policy binds
  once the client wiring lands. An empty QUERY has no product field at all: avoid empty queries
  (a data error upstream), never a silent default.

  Stage 1 on CPU proves: the declared pair shape renders byte-identically to the served
  template file (and hence to the card's reference prompt), the anchors survive every
  over-length cut, and fit's render equals the reference subprocess's render. The GPU wave
  (stages 2-3) must still check: score-level equivalence against the ~4.0 GB weights, the
  engine's /tokenize agreement, the template mount (T0), and image-expansion token counts.
