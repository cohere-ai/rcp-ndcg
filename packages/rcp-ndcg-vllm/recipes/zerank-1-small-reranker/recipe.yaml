# Serving recipe: zeroentropy/zerank-1-small-reranker on stock vLLM v0.31.0, for rcp-ndcg.
#
# zeroentropy/zerank-1-small and zeroentropy/zerank-1-small-reranker are ONE repository (the former
# 307-redirects to the latter; identical files, live-checked sha a65fd51c450e9b47fdddab98e31166ecad21af8d,
# unchanged at recipe time). The recipe id is the canonical Hub repo name, never the redirecting alias.
# Base: Qwen3-1.7B by config match — 25/26 shared config keys equal (27 keys vs 26, the extra key is
# auto_map, transformers_version 4.51.3 vs 4.51.0 is the only shared key that differs; measured at recipe
# time). The card's "Base Model: Qwen/Qwen3-4B" row contradicts its own "Parameters: 1.7B" and the config.
#
# The served score is sigmoid(l_Yes / 5) at the last token, the paper reference ZerankRerank
# (experiments/paper/rerankers/reference/zerank.py): the "Yes" row of the LM head (tied to embed_tokens,
# id 9454 = "Yes" of this tokenizer, a single token) becomes a 1-label score head online. vLLM sets
# num_labels = len(classifier_from_token) = 1 for method no_post_processing (models/adapters.py), one label
# makes the classify pooler apply sigmoid (layers/pooler/activations.py:140), and logit_sigma=5 divides the
# logit before it (config/pooler.py:98-109; heads.py applies activation((logit - logit_mean) / logit_sigma),
# logit_mean unset). The paper's numbers rest on the in-process reference; this recipe serves the same
# checkpoint so stage 2 can prove them equal.
#
# Serve (also what serve_argv below renders):
#   vllm serve zeroentropy/zerank-1-small-reranker --revision a65fd51c... \
#     --runner pooling \
#     --hf-overrides '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token":
#                      ["Yes"], "method": "no_post_processing"}' \
#     --pooler-config '{"logit_sigma": 5, "use_activation": true}' \
#     --chat-template zerank_score_template.jinja \
#     --max-model-len 32768 --dtype bfloat16
# --chat-template is LOAD-BEARING (R10): without it the score path silently falls back to raw
# query+document pair encoding, and this converted architecture gets no warning (the startup warning fires
# only for is_original_qwen3_reranker; io_processor.py:460-476 warn, :701-710 fallback). Stage 1 proves the
# declared pair shape renders byte-identically to this file.
id: zerank-1-small-reranker
model: zeroentropy/zerank-1-small-reranker
revision: "a65fd51c450e9b47fdddab98e31166ecad21af8d"   # live HF API check at recipe time: unchanged
role: rerank
input: [text]
scoring: pointwise
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0"}
resources: {gpus: 1}          # ~3.4 GB bf16 weights (single shard); 1 GPU
serve:
  runner: pooling
  convert: null               # auto resolves to `classify` from the ForSequenceClassification suffix;
                              # passing --convert classify is equivalent
  hf_overrides:
    architectures: ["Qwen3ForSequenceClassification"]
    classifier_from_token: ["Yes"]     # single token, id 9454 (measured on this revision's tokenizer.json)
    method: no_post_processing         # score head := the "Yes" LM-head row; num_labels := 1 is automatic.
                                       # Dropping either override silently yields the config's 2-label
                                       # softmax head - a different model (research risk R7).
  chat_template: zerank_score_template.jinja
  pooler_config:
    logit_sigma: 5           # sigmoid(l_Yes / 5); logit_mean stays None
    use_activation: true     # the 1-label head's default is already sigmoid; pinned so the served scale
                             # is explicit, and mirrored on the wire by client.use_activation below
  trust_remote_code: false   # measured: AutoConfig returns the native Qwen3Config with auto_map present
                             # AND modeling_zeranker.py staged; the engine never executes the remote code
  max_model_len: 32768       # the card's declared context (config max_position_embeddings is 40960);
                             # the paper's pair budget is the client's 8192 below
  dtype: bfloat16            # the checkpoint's torch_dtype and the paper's DTYPE
  plugin: null
  extra_args: []
client:
  api: rerank
  recipe: "vllm v0.31.0: --runner pooling, hf_overrides Qwen3ForSequenceClassification + classifier_from_token [Yes] + method no_post_processing, --chat-template zerank_score_template.jinja, pooler logit_sigma 5 + use_activation true (sigmoid(l_Yes/5) at the last token, 1-label head)"
  tokenizer: "zeroentropy/zerank-1-small-reranker@a65fd51c450e9b47fdddab98e31166ecad21af8d"
  max_tokens: 8192           # the paper's whole-pair budget (MAX_SEQ_LENGTH, retrieval/cross_encoder.py:42):
                             # the frame, the query and the document together, in this tokenizer's tokens;
                             # content spans are cut client-side, inside the frame, anchors reserved
  query_max_tokens: 4096     # the served path's query share (MAX_QUERY_LENGTH, cross_encoder.py:46: what
                             # the former served client sent as max_tokens_per_query). It binds on overflow
                             # only: a pair under budget is sent byte-identical to the uncut render, so
                             # queries between 4096 tokens and the budget still reach the engine whole,
                             # matching the reference (which caps no query); over-cap pairs are reported
                             # separately (known_deviations below). See notes for the >4096-query policy.
  template:
    pair:
      - {fixed: "{special:im_start}system\n"}
      - {content: query}
      - {fixed: "{special:im_end}\n{special:im_start}user\n"}
      - {content: document}
      - {fixed: "{special:im_end}\n{special:im_start}assistant\n"}
    anchor: last             # the assistant generation prompt: the position the score head reads
    add_special_tokens: true # the scoring route tokenizes the rendered string with add_special_tokens=True
                             # (scoring/protocol.py:69-74); for this tokenizer it is measured to add no
                             # tokens (empty render included), so the overhead is the frame alone
  instruction: none          # the family takes no instruction parameter; the reference raises on one. A
                             # dataset task text, when a run passes one, is dropped on the served path and
                             # in the reference alike (the paper pipeline never passed one)
  on_overflow: cut
  empty_doc: send            # the paper sends an empty document as the empty string; no omit rule
  request_shape: text
  listwise: false
  use_activation: true       # the served score is the probability sigmoid(l_Yes / 5) (the reference's
                             # score_scale); raw logits would be a different stored score
reference:
  kind: transformers
  score_scale: probability   # sigmoid(l_Yes / 5) in [0, 1]
  entry: reference.py
  known_deviations: [anchor_drop_over_cap]   # the paper's code truncates the WHOLE rendered prompt from
                                             # the right at 8192 (at forward time), which drops the
                                             # assistant header - the anchor - on over-cap pairs; the
                                             # served path reserves it and cuts the content instead
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/zeroentropy/zerank-1-small-reranker @ a65fd51c450e9b47fdddab98e31166ecad21af8d
    (card README; config.json: Qwen3ForCausalLM, bfloat16, hidden 2048, 28 layers, tie_word_embeddings,
    max_position_embeddings 40960, auto_map; tokenizer.json + tokenizer_config.json: chat template,
    pad '...' set, padding right; 1_LogitScore/config.json: true_token_id 9454). https://huggingface.co/
    zeroentropy/zerank-1-small 307-redirects to it (live check at recipe time; same sha)."
  - "https://huggingface.co/Qwen/Qwen3-1.7B — the base checkpoint by config match: 25/26 shared keys equal
    (27 keys vs 26; the extra key is auto_map; transformers_version 4.51.3 vs 4.51.0 differs). The card's
    'Base Model: Qwen/Qwen3-4B' row is wrong (audit-synth correction for r-zerank1)."
  - "vLLM v0.31.0 / d0d6e5f3a (read at the .refs/vllm checkout, 376 commits past the v0.31.0 tag;
    pooling diff error-handling only in the named scoring files — r-zerank1 report R9):
    vllm/model_executor/models/adapters.py:307 as_seq_cls_model, :593 load_weights_no_post_processing
    (score head := the classifier_from_token lm_head row, num_labels := 1); vllm/config/model.py:2295-2342
    (the ForSequenceClassification suffix -> runner pooling / convert classify), :2079-2091 head_dtype
    (pooling defaults to an fp32 score head; --hf-overrides '{\"head_dtype\": \"model\"}' disables);
    vllm/config/pooler.py:98-109,140-141 (logit_mean/logit_sigma); vllm/model_executor/layers/pooler/
    activations.py:140 (num_labels < 2 -> sigmoid); .../seqwise/heads.py:170-200 (the /5, the per-request
    use_activation); vllm/entrypoints/pooling/scoring/io_processor.py (get_score_prompt def :634, the
    chat-template render over query/document messages, :706-724; :654-668 the query/document
    pre-truncation hooks; :661-699 default_tokenizer_encode, the un-templated pair-encode fallback taken
    when the template file is missing, :706-710); vllm/entrypoints/pooling/
    scoring/protocol.py:69-74 (add_special_tokens=True on the score route); vllm/renderers/hf.py:780-845
    (safe_apply_chat_template, the renderer the engine calls); vllm/renderers/params.py get_encode_kwargs."
  - "rcp-ndcg: experiments/paper/rerankers/reference/zerank.py (the paper-exact ZerankRerank reference.py
    derives from) with experiments/paper/rerankers/reference/requirements.txt (its environment);
    experiments/paper/rerankers/zerank_1_small.yaml (the paper's served-path config: provider local,
    model zeroentropy/zerank-1-small); src/rcp_ndcg/retrieval/cross_encoder.py:42,46 (MAX_SEQ_LENGTH 8192,
    MAX_QUERY_LENGTH 4096), :268-269 (the former served call: max_tokens_per_query, truncate_prompt_tokens);
    src/rcp_ndcg/data/templates.py (TemplateSpec: the pair frame, the anchor, add_special_tokens);
    src/rcp_ndcg/data/preprocess.py:205 token_prefix, :933 fit (the content-only cut that reserves the
    frame); src/rcp_ndcg/inference/config.py RerankEndpoint (the client block IS this model)."
  - "research lane r-zerank1: /root/repos/rcp-ndcg-lanes/research/r-zerank1/out/ (report.md: the paper path,
    the flag-by-flag serve mechanism, risks R1-R10, the 21/21 prompt-equivalence measurement and the
    check_maxquery divergence table; digest.md; recipe-draft-zerank-1-small.yaml; reference-draft.py;
    zerank_reranker.jinja) and the audit-synth corrections for r-zerank1
    (research/audit-synth/out/corrections.md), applied here: the config-match is 25/26 shared keys (not 26),
    the recipe sources cite 21/21 (not 14/14) and that auto_map also differs, the prompt-equivalence guard's
    config fallback check is a measurement, not a gate, and the serve-time revision pin is rendered by the
    harness's serve_argv (--revision), closing the corrections' serve-time revision risk."
notes: >
  Template: zerank_score_template.jinja is the research lane's derived score template with the
  `messages is defined` guard: the engine's score route renders the zerank branch (query message to
  the system turn, document message to the user turn, unconditional assistant header) and the
  harness's stage-1 check renders the plain-text branch; both build the identical frame, and stage 1
  asserts the equality byte-for-byte (template_render_check). The content spans carry no trim
  filter: the served path renders the client's text as sent, byte-identical to the product's fit
  render and the reference's anchor-preserving render on every input; the PAPER strips query and
  document before rendering, so on whitespace-edged inputs the served prompt keeps that whitespace
  where the reference would drop it - a declared served-vs-reference difference (r-zerank1 report
  section 6 row 1; the research's own template file trimmed instead, which cannot be expressed in
  the product's TemplateSpec - the reference render mode implements the served render, so stage 1
  stays green either way; whitespace-edged rows are flagged by stage 2's gates, not silently).
  Known served-vs-reference differences, all inherited from the paper's own paths and recorded in
  the research report section 6/7: (1) the strip asymmetry above, clean inputs only in practice;
  (2) the reference truncates only the whole rendered prompt at 8192 from the right (declared
  known_deviations: anchor_drop_over_cap), the served path cuts the content spans and keeps the
  assistant header; the declared query_max_tokens 4096 is the served path's query share
  (cross_encoder.py MAX_QUERY_LENGTH, what the former served client sent as max_tokens_per_query),
  so a query over 4096 tokens is cut served-side while the reference keeps it whole - the r-zerank1
  research measured 904 prompt tokens lost at a 5000-token query under the former engine-side
  constant; the GPU wave should check the workload's query lengths (stage 1's render table and
  stage 2's over_cap rows name every affected pair); (3) the score-head matmul runs in fp32 on the
  engine (head_dtype default for pooling) and bf16 in the reference - expected well inside the
  probability gates; --hf-overrides '{"head_dtype": "model"}' is the closer-to-reference option if
  the gate ever fails. The paper's last prompt token is the newline after the assistant header
  (dropping it flips the render: the research lane's mutation M1); the template file ends with the
  header inside every branch. Budget: max_tokens 8192 is the paper's MAX_SEQ_LENGTH, counted as the
  engine sees the whole prompt (frame + query + document; the frame's fixed overhead measures 13
  tokens on this tokenizer, add_special_tokens adds none - both measured); query_max_tokens 4096 is
  the served path's query share, binding on overflow only. The checkpoint's card truncates the query
  at 2000 CHARACTERS pre-template and never token-truncates - the paper's whole-prompt token cut
  wins (r-zerank1 report section 6 row 1). trust_remote_code stays false: the native Qwen3Config
  loads with auto_map present and the remote code staged (measured; the engine never executes
  modeling_zeranker.py). GPU wave must check: T0 smoke that the engine loaded the chat template (a
  /tokenize probe of one rendered prompt must carry the frame; without the file this model gets NO
  warning and pair-encodes raw query+document - R10), the engine's /tokenize agreement (stage 1
  reports it not_run on CPU), the fp32-head epsilon (difference 3 above), and the query-length
  histogram (difference 2 above). reference.py derives from
  experiments/paper/rerankers/reference/zerank.py (the paper's ZerankRerank, unchanged in
  behaviour: strip, chat template, right padding, whole-prompt right cut at 8192, the "Yes" logit
  at the last non-pad position over 5, sigmoided); its --mode render implements the recipe's
  anchor-preserving served render (the reference environment has no rcp-ndcg), pinned byte-identical
  to the product's fit by the recipe tests. Environment: requirements-reference.txt beside
  reference.py (the paper reference's pins, minus flash-attn, which zerank.py never imports).
