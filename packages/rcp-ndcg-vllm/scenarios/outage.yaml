# T4 scenario 2: the text run (scenario 1's shape) with the judge engine killed mid-tournament.
#
# The judge is a run-scoped engine the driver owns (rcp_ndcg_vllm.e2e.ManagedEngine): engines the
# supervision script started would end the job when they exit, while replicas that live elsewhere are
# "restarted by whatever runs them, and the judge bounds the outage instead"
# (rcp_ndcg.runners.script.supervise).  Two sub-runs and a resume:
#
#   (a) the killed judge restarts after ~15 s: the run parks through the outage and finishes;
#   (b) the killed judge stays down past wait_on_outage_s (90 s here): the run fails with
#       BackendUnavailableError, and a `run resume` after the engine returns finishes it.
#
# Judge (owner, GPU-VALIDATION.md, "Judges for T4"): Qwen/Qwen3.8-27B-FP8.  The revision is the Hub
# commit (https://huggingface.co/api/models/Qwen/Qwen3.8-27B-FP8), checked 2026-10-13.
id: outage
description: >
  The text run with the judge engine killed mid-tournament: one sub-run parks through the outage and
  recovers when the engine restarts, one outlives wait_on_outage_s, fails with BackendUnavailableError
  and is finished by a resume.
mode: outage
dataset:
  uri: suite:nanobeir
  subset: NanoNFCorpusRetrieval
  revision: 4517f2cb9e342479725bf0931a329998b4d35038
limit: 10
depth: 30
steps: [retrieve, rerank, tournament, rubric, calibrate, evaluate]
encoder_recipe: qwen3-embedding-0.6b
rerank_recipe: qwen3-reranker-0.6b
judge:
  served_name: judge
  candidate: {model: Qwen/Qwen3.8-27B-FP8, revision: "017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"}
  command:
    - vllm
    - serve
    - Qwen/Qwen3.8-27B-FP8
    - --revision
    - "017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"
    - --served-model-name
    - judge
    - --host
    - "0.0.0.0"
    - --port
    - "{port}"
    - --tensor-parallel-size
    - "1"
    - --reasoning-parser
    - qwen3
    - --max-model-len
    - "131072"
    - --limit-mm-per-prompt
    - '{"image": 10}'
  config:
    temperature: null
    max_output_tokens: 16384
    context_tokens: 131072
    tokenizer: Qwen/Qwen3.8-27B-FP8@017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
    concurrency: 64
    decoding: json_schema
    image_processor: qwen3_vl
    max_images: 10
    # The outage clock: the recover sub-run's outage lasts ~15 s, the expiry sub-run's outlives this.
    wait_on_outage_s: 90
  slot: {port: 8120, vllm_port: 9120, cuda_visible_devices: "0", gpus: 1,
         startup_timeout_s: 3600, outage_timeout_s: 90}
slots:
  encoder: {port: 8100, vllm_port: 9100, cuda_visible_devices: "0", gpus: 1,
            startup_timeout_s: 1800, outage_timeout_s: 300}
  reranker: {port: 8110, vllm_port: 9110, cuda_visible_devices: "0", gpus: 1,
             startup_timeout_s: 1800, outage_timeout_s: 300}
runner_options:
  resources: {gpus: 0, cpus: 8, memory_gb: 32, time_limit_s: 28800}