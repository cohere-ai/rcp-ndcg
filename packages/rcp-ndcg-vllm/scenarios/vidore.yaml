# T4 scenario 4: one ViDoRe v3 subset with media — served VL encoder -> served VL judge.
#
# retrieve (Qwen3-VL-Embedding-2B over page images) -> tournament + rubric (served VL judge) ->
# calibrate + evaluate.  Media budgets on: the judge declares its image processor and per-request media
# limits, and the preprocessing pins the page-image pixel budget within the qwen3_vl engine budget
# (rcp_ndcg.data.resolution.PROCESSORS).
#
# Judge: the Flash-Next judge of the four-phase run (the owner named judges for the outage, identity and
# four-phase runs; the visual run uses the same judge as the four-phase run, see the lane report's open
# questions).  The Hub commits are checked 2026-10-07.
id: vidore
description: >
  One ViDoRe v3 subset (computer_science) with page images: served VL encoder -> served VL judge, media
  budgets on.
mode: run
dataset:
  uri: suite:vidore
  subset: computer_science
  revision: 4e5ca46e2f9c050b18a7f170c23e3ade66f78a4e
limit: 10
depth: 30
steps: [retrieve, tournament, rubric, calibrate, evaluate]
encoder_recipe: qwen3-vl-embedding-2b
preprocessing:
  # The page-image pixel budget (both bounds, within the qwen3_vl engine budget): images are resized to
  # it as the judge's processor would, so the engine keeps the prepared size.
  image: {min_px: 65536, max_px: 1048576}
judge:
  served_name: judge
  candidate: {model: nvidia/Qwen3.8-Flash-Next-NVFP4, revision: "fc694b54fb0174e0913e6adf86691ef85a4ead47"}
  command:
    - vllm
    - serve
    - nvidia/Qwen3.8-Flash-Next-NVFP4
    - --revision
    - "fc694b54fb0174e0913e6adf86691ef85a4ead47"
    - --served-model-name
    - judge
    - --host
    - "0.0.0.0"
    - --port
    - "{port}"
    - --tensor-parallel-size
    - "4"
    - --quantization
    - modelopt_fp4
    - --reasoning-parser
    - qwen3
    - --max-model-len
    - "131072"
    - --limit-mm-per-prompt
    - '{"image": 10}'
  fallback: {model: Qwen/Qwen3.8-Flash-Next-FP8, revision: "236dfdf285828023ca3bcd3f37366c58a3469b13",
            tokenizer: "Qwen/Qwen3.8-Flash-Next-FP8@236dfdf285828023ca3bcd3f37366c58a3469b13"}
  fallback_command:
    - vllm
    - serve
    - Qwen/Qwen3.8-Flash-Next-FP8
    - --revision
    - "236dfdf285828023ca3bcd3f37366c58a3469b13"
    - --served-model-name
    - judge
    - --host
    - "0.0.0.0"
    - --port
    - "{port}"
    - --tensor-parallel-size
    - "4"
    - --reasoning-parser
    - qwen3
    - --max-model-len
    - "131072"
    - --limit-mm-per-prompt
    - '{"image": 10}'
  config:
    temperature: null
    max_output_tokens: 16384
    context_tokens: 131072
    tokenizer: nvidia/Qwen3.8-Flash-Next-NVFP4@fc694b54fb0174e0913e6adf86691ef85a4ead47
    concurrency: 128
    decoding: json_schema
    image_processor: qwen3_vl
    max_images: 10
    wait_on_outage_s: 300
  slot: {port: 8120, vllm_port: 9120, cuda_visible_devices: "0,1,2,3", gpus: 4,
         startup_timeout_s: 3600, outage_timeout_s: 300}
slots:
  encoder: {port: 8100, vllm_port: 9100, cuda_visible_devices: "0", gpus: 1,
            startup_timeout_s: 1800, outage_timeout_s: 300}
runner_options:
  resources: {gpus: 0, cpus: 8, memory_gb: 32, time_limit_s: 28800}