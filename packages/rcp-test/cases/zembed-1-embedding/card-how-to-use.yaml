notes: 'The card''s only usage example (embed role). Cosine similarities printed to 4 decimals -> rounding abs 5e-4; declared bf16 margin 1.5e-3 (research r-zembed1: bf16-head drift ~1e-3 on 2560-d vectors; cosine of unit vectors keeps ~1e-3) -> tolerance abs 2e-3. The card''s snippet instantiates ''zeroentropy/zembed-1'' (no -embedding suffix); this case pins the recipe''s repo zeroentropy/zembed-1-embedding at revision cf13c81f3274394053d166740294f7eea4586f7a and reproduces the example''s inputs and printed outputs, not the loader call. Vectors are L2-normalized (modules.json module 2), so model.similarity is cosine; shapes printed by the card: (2560,) and (3, 2560). CPU reproduction NOT run: 4.0B params exceeds the brief''s <= 1B / 10-min CPU budget. Tokenizer-only CPU check at the pinned revision: rendered query 17 tokens, documents 26/24/26. GPU wave: verify the three similarities at 2560 dims.'
