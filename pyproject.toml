[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcp-ndcg"
version = "0.0.1"
description = "Calibrated relevance for retrieval evaluation: RCP-nDCG, listwise tournament + rubric, 2PL IRT, MTEB-compatible evaluator."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
  { name = "RCP-nDCG contributors" },
]
keywords = ["information-retrieval", "evaluation", "ndcg", "irt", "rerank", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # Deliberately without torch: it belongs to the ``[calibrate]`` extra below,
  # so a client-only install stays small.  ``rcp-ndcg run`` names the extra in its
  # error when the fit is reached without it.
  # The core is released in lockstep with this package: the same version, pinned.
  "rcp-ndcg-core==0.0.1",
  "numpy>=1.26",
  "pandas>=2.2",
  # Parquet artifacts (calibration queries/thetas tables).
  "pyarrow>=15.0",
  "scipy>=1.15",
  # BM25 (bm25s: numpy and scipy only) and its Snowball stemmers, so a keyword first stage runs on any install.
  "bm25s==0.2.13",
  "PyStemmer>=2.2",
  "pydantic>=2.0",
  "tqdm>=4.67",
  "click>=8.1",
  # Read only by ``rcp-ndcg --env-file``; the package never loads a .env file on its own.
  "python-dotenv>=1.0",
  # The judge client (llm/client.py) and the hosted embedding and rerank clients send their requests over
  # httpx through the shared transport (rcp_ndcg.inference); there is no second HTTP stack.
  "httpx>=0.27",
  # Storage: fsspec is the universal path layer (rcp_ndcg.storage); gcsfs keeps
  # gs:// URIs working out of the box.  Other protocols are extras below, so a
  # laptop install stays small.
  "fsspec>=2025.3.0",
  "gcsfs>=2025.3.0",
  "PyYAML>=6.0",
  # Pillow is core, not part of ``[local]``: the LLM-client venv -- which has no
  # torch -- must decode and re-encode page images to send them to a vision
  # judge, and ingest probes image dimensions to make token accounting exact.
  # Both happen outside the local execution stack.
  "Pillow>=10.0",
]

[project.optional-dependencies]
# Storage backends.  Each adds one fsspec implementation; `rcp_ndcg.storage`
# names the missing extra when a URI arrives for a protocol that is absent.
s3 = ["s3fs>=2025.3.0"]
azure = ["adlfs>=2024.7.0"]
# The Hugging Face Hub: hf:// paths, and the judge's tokenizer (`judge.tokenizer`), which sets text limits in tokens.
hf = ["huggingface-hub>=0.34", "tokenizers>=0.21"]
http = ["aiohttp>=3.10"]
# Local execution stack: what in-process models need on a single GPU host --
# dense retrieval (HF dense embedders like Octen / Qwen3-class, searched with
# the exact numpy/torch top-k; hosted embedding APIs need no local weights)
# and in-process reranking.  One
# torch / transformers / flash-attn pin shared across the lot; install it in
# its own environment (``uv sync --extra local`` on a CUDA host).
#
# Versions:
#   * torch 2.9.1 -- the only torch with an official Dao-AILab
#     flash-attn 2.8.3 prebuilt wheel for cp312 + cu12 + cxx11abi=TRUE
#     (matches PyPI torch wheels' ABI).
#   * transformers 5.8.x -- latest stable, validated against the HF dense
#     embedders and cross-encoders this extra ships.
#   * flash-attn 2.8.3 -- latest release with official prebuilt wheels.
#     Its setup.py auto-fetches the right wheel from
#     https://github.com/Dao-AILab/flash-attention/releases (uv runs it
#     with torch already installed via [tool.uv.extra-build-dependencies]
#     below).
#
# Linux-only because of the prebuilt flash-attn wheel (no macOS / arm64 wheel).
# On macOS / arm64 the heavy CUDA bits are
# skipped automatically.
local = [
  # GPU model execution.
  "torch==2.9.1",
  "transformers>=5.8,<6",
  "accelerate>=1.10",
  "flash-attn==2.8.3 ; sys_platform == 'linux'",
]

# MTEB: the public suites as mteb tasks (rcp_ndcg.eval.mteb), plus the
# HuggingFace ``datasets`` loader stack that reads corpus / queries / qrels
# splits.  Kept out of core ``[project.dependencies]`` because ``datasets``
# is large and only these readers need it.
mteb = [
  # 2.10.5 is the first release with the ViDoRe v3 tasks; the integration imports mteb 2.x modules.
  "mteb>=2.10.5",
  "datasets>=4.1",
]

# 2PL / Bradley-Terry / Rasch IRT calibration and the judging client's
# estimators.  Pure-PyTorch optimisers in ``rcp_ndcg_core.irt.*``; CPU-only is
# fine (the rendered jobs install torch from PyTorch's CPU index).
calibrate = [
  "torch>=2.0",
]

# vLLM in the same environment: the in-process vLLM encoder of the retrieval
# stack (``engine: vllm``), or a bare-metal engine.
vllm = [
  "vllm>=0.6",
]

# Data ingestion: the ``rcp-ndcg data convert`` readers ``hf`` and ``pdf``
# (``images`` needs nothing extra).
data = [
  "huggingface-hub>=0.34",
  # The Hub dataset loader behind the `hf` reader.
  "datasets>=4.1",
  # PDF -> page-image rendering for the `pdf` reader. pypdfium2 rather than
  # pymupdf: permissive licence, no system poppler, and a stable render scale.
  "pypdfium2>=4.30",
]

# Development & CI.  Includes ``[calibrate]``: the IRT fits are exercised by the
# test suite, and a dev environment that skips them would let a calibration
# regression through.  Includes ``[hf]``: the token-limit tests build a tokenizer.
# Tests for the heavier extras (``[local]``, ``[data]``) skip themselves when
# those are absent.
dev = [
  "rcp-ndcg[calibrate,hf]",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.5",
  "ruff>=0.6",
  "basedpyright>=1.18",
  "shellcheck-py>=0.10",
]

# The local documentation preview and its CI build (mkdocs-material; the pages are plain Markdown).
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10",
]

[project.scripts]
rcp-ndcg = "rcp_ndcg.cli.main:main"

# The one extension seam: job runners. The public ones are registered here like any plugin would be.
[project.entry-points."rcp_ndcg.runners"]
local = "rcp_ndcg.runners.local:LocalRunner"
slurm = "rcp_ndcg.runners.slurm:SlurmRunner"
kubernetes = "rcp_ndcg.runners.kubernetes:KubernetesRunner"

[project.urls]
Homepage = "https://github.com/cohere-ai/rcp-ndcg"
Repository = "https://github.com/cohere-ai/rcp-ndcg"
Paper = "https://arxiv.org/abs/2609.35739"

[tool.setuptools.packages.find]
where = ["src"]

# Package data: the prompts (rcp_ndcg/llm/prompts/*.txt) and the shipped judge configs (rcp_ndcg/llm/judges/*.yaml),
# loaded through importlib.resources. The JSON Schemas under schemas/ are generated from the models that ship
# (`rcp-ndcg schema export` writes them byte for byte), so the wheel carries them as models.
[tool.setuptools.package-data]
"*" = ["*.txt", "*.yaml"]
"rcp_ndcg.examples" = ["tiny/*.jsonl", "tiny/*.json", "runs/*.yaml"]

# ``[local]`` pins ``torch==2.9.1`` so the official Dao-AILab
# ``flash-attn==2.8.3`` prebuilt wheel resolves cleanly.  ``[vllm]``
# carries its own torch / transformers / flash-attn pins -- the two are
# not co-installable, so each belongs in its own environment.  Telling uv
# they conflict avoids cross-extra resolution attempts that would always
# fail.  Judges reach any engine (vLLM, SGLang) by URL, so serving needs
# nothing from this package.
# The repository is a uv workspace.  ``rcp-ndcg`` (this manifest) is the
# pipeline: storage, data, retrieval, judging, calibration, evaluation, runs and
# the CLI.  ``packages/rcp-ndcg-core`` is the metric, the gains, the protocols,
# the schemas and the IRT estimators (numpy + pydantic; the estimators need its
# [irt] extra: torch, scipy), released in lockstep with this package.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
rcp-ndcg = { workspace = true }
rcp-ndcg-core = { workspace = true }

[tool.uv]
conflicts = [
    [
        { extra = "local" },
        { extra = "vllm" },
    ],
]

# Make ``uv`` install ``torch`` into the build env *before* running
# ``flash-attn``'s ``setup.py``.  flash-attn imports torch at build time
# (to read torch's CUDA version and decide which prebuilt wheel to fetch
# from https://github.com/Dao-AILab/flash-attention/releases).  Without
# this, uv's hermetic build env would error out on ``import torch`` and
# fall back to a 30-60 minute source build.
#
# ``match-runtime = true`` ensures the build-env torch matches the
# project's runtime torch pin (2.9.1), so flash-attn picks the
# ``cu12torch2.9cxx11abiTRUE-cp312`` wheel that matches our project venv.
#
[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.pytest.ini_options]
# Collect the test tree only (experiments/ and examples/ are exercised through tests/).
testpaths = ["tests"]
# The judging client and the execution layers are async end to end; `auto` mode keeps
# `async def test_...` working without an @pytest.mark.asyncio on each one.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "network: needs the public HuggingFace Hub; the test also skips itself unless RCP_NDCG_NETWORK_TESTS=1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
# ruff >= 0.16 also formats fenced Python blocks inside Markdown. The snippets in
# the docs are laid out for a reader; tests/docs runs them instead. `ruff check`
# does not lint Markdown either way.
exclude = ["*.md"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.basedpyright]
include = ["src", "packages/rcp-ndcg-core/src"]
exclude = ["**/__pycache__"]
# "standard" rather than basedpyright's default "all": the strict-adjacent rules
# (reportAny, reportUnusedCallResult, reportMissingTypeArgument) fire thousands
# of times across code that is correct, and a check that always fails is a check
# nobody reads.
typeCheckingMode = "standard"
pythonVersion = "3.12"
# The optional stacks are absent by design in the environment CI type-checks in
# (that is the point of the zero-GPU spine), so an unresolved import of torch or
# sglang is expected rather than a defect. Real type errors in the code that
# *uses* them are still reported.
reportMissingImports = "none"
reportMissingModuleSource = "none"
# torch's stubs do not list `tensor`, `sum`, `device` and friends in __all__, so
# this rule flags most of the torch API as a private import. It says nothing
# about our code.
reportPrivateImportUsage = "none"
