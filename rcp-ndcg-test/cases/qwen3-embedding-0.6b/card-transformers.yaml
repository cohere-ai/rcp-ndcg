notes: |-
  tolerance = card rounding + declared bf16 margin. the card prints full float precision, so the rounding term is negligible. The card's example is the recipe's reference computation (transformers, last-token pooling, L2, fp32; max_length 8192). CPU fp32 reproduction (scratch repro_card.py, weights at revision 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3): [[0.7645565271377563, 0.1414250284433365], [0.1354975402355194, 0.5999548435211182]], max |delta| 3.0e-7 (reproduced). CPU bf16 (serving dtype) differs by <= 1.7e-3; the 0.01 tolerance is the declared bf16 margin with headroom for GPU hardware spread.
