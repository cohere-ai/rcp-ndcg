notes: 'The card''s Transformers example (the runtime this recipe''s reference implements: AutoModelForCausalLM, the manual prefix/suffix frame, truncation longest_first at max_length 8192). The card prints no output for this example, so the case exercises the card''s own path: expected.kind none, nothing compared. The card pairs queries[i] with documents[i] (zip): the pairs are (q1, d1) and (q2, d2). The recipe declares instruction: none and its template frame carries exactly this instruction, so the recipe''s render equals the card''s construction; the GPU wave runs the pairs through the served endpoint to exercise the card frame (no numbers compared). The card''s vLLM Usage section (0.6B and 4B cards) is a different runtime (generation logprobs, a double-newline frame) and is listed in the lane report, not made a case.'
