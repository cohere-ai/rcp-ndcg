id: qwen3-reranker-8b/card-st-logits
recipe: qwen3-reranker-8b
role: rerank
strata:
  modality: text
  length: short
  batch: mixed_length
inputs:
  instruction: Given a web search query, retrieve relevant passages that answer the query
  queries:
  - id: q1
    text: What is the capital of China?
  documents:
  - id: d1
    text: The capital of China is Beijing.
  - id: d2
    text: Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.
source:
  kind: model_card
  url: https://huggingface.co/Qwen/Qwen3-Reranker-8B
  revision: 77d193c791ed757ca307ee72715aa132723da912
  section: Using Sentence Transformers
  quote: |-
    query = "What is the capital of China?"
    documents = [
        "The capital of China is Beijing.",
        "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.",
    ]

    pairs = [(query, doc) for doc in documents]
    scores = model.predict(pairs)
    print(scores)
    # [  5.0625 -14.25  ]

    rankings = model.rank(query, documents)
    print(rankings)
    # [{'corpus_id': 0, 'score': 5.0625}, {'corpus_id': 1, 'score': -14.25}]
expected:
  kind: ranking
  values:
  - - d1
    - d2
  tolerance:
    rank_exact: true
  origin: published
  status: published_unverified
notes: 'The card''s Sentence Transformers example, inputs and both printed outputs verbatim (raw logit differences and the ranking; one query, two documents of different lengths, so batch mixed_length). The card''s default prompt injects exactly the instruction recorded in inputs.instruction, which is also the instruction the recipe''s template frame carries fixed (the recipe''s instruction mode is none), so the recipe''s rendered prompt equals the card''s construction. The expected ranking is the card''s own printed order: one row (one query) of document ids, d1 before d2. The card''s two follow-on snippets in this section (the Sigmoid-activation one-liner and the custom-instruction prompts snippet) print no outputs and add no new inputs beyond this example, so they are listed in the lane report, not made cases. The card prints raw logit differences (CrossEncoder without an activation, as numpy''s shortest round-trip representation of exact bf16 values); the family''s checkpoints are bf16, whose ULP at |logit| ~ 14 is 0.0625, so the raw values are not a stable comparison; the robust comparison is the exact rank order: this case compares the card''s own printed ranking (d1 before d2), not the raw logits, which the served path cannot produce (the head scores a probability: use_activation true, sigmoid of x.(W_yes - W_no); the card''s raw logit differences stay recorded above). No CPU reproduction: the size exceeds the brief''s CPU budget (<= 1B parameters).'
