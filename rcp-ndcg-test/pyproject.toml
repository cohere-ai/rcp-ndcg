[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcp-ndcg-test"
version = "0.0.1"
description = "The validation tooling for served models: the equivalence harness, the engine recorder, the verified emulators, the GPU wave runner and the reference cases (unpublished)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
  { name = "RCP-nDCG contributors" },
]
keywords = ["information-retrieval", "evaluation", "conformance", "vllm", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
# Unpublished on purpose (never on PyPI): the repository's CI, the product's pytest suite and the GPU waves
# install it from the workspace or the staged wheelhouse. It depends on the product and the lean serving
# package at the release's version, and never the other way round: neither published package names this one.
dependencies = [
  "rcp-ndcg==0.0.1",
  "rcp-ndcg-vllm==0.0.1",
  "numpy>=1.26",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.entry-points."rcp_ndcg.fake_transports"]
# The verified fake engines (the emulators of the observation corpora) live here; the product's offline
# fake (rcp_ndcg.inference.fake) routes a fake://<engine>-<version>/<recipe> URL through this provider.
rcp-ndcg-test = "rcp_ndcg_test.engines:transport_for"

[project.optional-dependencies]
# The package's own CPU test suite. The conformance and case loaders reach the tokenizer through the
# product's [hf] extra (declare it in the environment that measures token lengths, e.g. the dev extra).
test = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/cohere-ai/rcp-ndcg"
Repository = "https://github.com/cohere-ai/rcp-ndcg"

[tool.setuptools.packages.find]
where = ["src"]

# Package data: the fixture recipe, its tokenizer and its fixture cases (the shipped fake's end-to-end
# example) travel in the wheel, so a GPU-node client environment runs the suite from wheels alone.
# The real cases live at the package root under cases/ (written by the cases lanes; staged by the wave
# runner) -- they are repository data, not importable package data.
[tool.setuptools.package-data]
"rcp_ndcg_test" = [
  "py.typed",
  "fixtures/tokenizer.json",
  "fixtures/recipes/*/*",
  "fixtures/cases/*/*",
]
"rcp_ndcg_test.jobs" = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs the public HuggingFace Hub; the test also skips itself unless RCP_NDCG_NETWORK_TESTS=1",
  "offline: runs without the Hub even when it requests a Hub-backed fixture (the recipe gate's opt-out)",
]
