id: fixture-embed-edge
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
model: fixtures/DenseEmbedder
revision: "0123456789abcdef0123456789abcdef01234567"
role: embed
input: [text]
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0", startup_timeout_s: 60}
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides: {}
  chat_template: null
  pooler_config: {seq_pooling_type: LAST}
  trust_remote_code: false
  max_model_len: 512
  dtype: bfloat16
  plugin: null
  extra_args: []
client:
  api: openai_embeddings
  tokenizer: ../../tokenizer.json
  max_tokens: 128
  template:
    document:
      - {fixed: "doc: "}
      - {content: document}
    anchor: last
    add_special_tokens: true   # the end token is the anchor: the shape ends in content, the processor appends
  on_overflow: cut
  empty_doc: omit_zero
  normalize: true
reference:
  kind: transformers
  score_scale: cosine
  entry: reference.py
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources: []
notes: "A fixture for the declared-end-token escape hatch: the shape ends in a content span, the post-processor's end token is the anchor (add_special_tokens: true)."
