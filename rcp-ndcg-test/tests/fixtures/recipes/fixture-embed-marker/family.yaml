id: fixture-embed-marker
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: embed
input: [text]
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0", startup_timeout_s: 60}
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides: {}
  chat_template: null
  pooler_config: {}
  trust_remote_code: false
  max_model_len: 512
  dtype: bfloat16
  plugin: null
  extra_args: []
client:
  api: openai_embeddings
  tokenizer: ../../tokenizer.json
  max_tokens: 64
  template:
    document:
      - {fixed: "doc: "}
      - {content: document}
      - {fixed: "{special:sep}"}
    anchor: marker
    anchor_markers: [sep]
    add_special_tokens: false
  on_overflow: cut
  normalize: true
reference:
  kind: transformers
  score_scale: cosine
  entry: reference.py
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources: []
notes: "A fixture for the anchor: marker rules: a marker id the model reads, declared as data."
variants:
  - id: fixture-embed-marker
    model: fixtures/MarkerEmbedder
    revision: "0123456789abcdef0123456789abcdef01234567"
