id: fixture-embed-mrl
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: embed
input: [text]
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0", startup_timeout_s: 60}
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides: {is_matryoshka: true, matryoshka_dimensions: [2, 4, 8]}
  chat_template: null
  pooler_config: {seq_pooling_type: LAST}
  trust_remote_code: false
  max_model_len: 512
  dtype: bfloat16
  plugin: null
  extra_args: []
client:
  api: openai_embeddings
  tokenizer: ../../tokenizer.json
  max_tokens: 128
  template:
    document:
      - {fixed: "doc: "}
      - {content: document}
      - {fixed: " [END]"}
    anchor: last
  on_overflow: cut
  empty_doc: omit_zero
  normalize: true
  mrl_kind: truncation
  mrl_dims: [2, 4, 8]
  dimensions: 4
reference:
  kind: transformers
  score_scale: cosine
  entry: reference.py
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources: []
notes: "A fixture for the dense Matryoshka rules: the declared set [2, 4, 8], an engine-side selection of 4, and the engine's gate declared in serve.hf_overrides."
variants:
  - id: fixture-embed-mrl
    model: fixtures/DenseEmbedder
    revision: "0123456789abcdef0123456789abcdef01234567"
