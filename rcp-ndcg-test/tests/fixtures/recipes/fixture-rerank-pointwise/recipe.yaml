id: fixture-rerank-pointwise
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
model: fixtures/PointwiseReranker
revision: "0123456789abcdef0123456789abcdef01234567"
role: rerank
input: [text]
scoring: pointwise
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0", startup_timeout_s: 60}
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides:
    architectures: [FixtureForSequenceClassification]
    classifier_from_token: ["no", "yes"]
    is_original_fixture_reranker: true
  chat_template: template.jinja
  pooler_config: {use_activation: true}
  trust_remote_code: false
  max_model_len: 512
  dtype: bfloat16
  plugin: null
  extra_args: []
client:
  api: rerank
  tokenizer: ../../tokenizer.json
  max_tokens: 160
  query_max_tokens: 48
  template:
    pair:
      - {fixed: "SYSTEM: Judge whether the Document answers the Query. Answer yes or no. USER: Query: "}
      - {content: query}
      - {fixed: " Document: "}
      - {content: document}
      - {fixed: " ASSISTANT"}
    anchor: last
  instruction: fold
  use_activation: true
  on_overflow: cut
  empty_doc: send
reference:
  kind: transformers
  score_scale: probability
  entry: reference.py
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - https://example.invalid/model-card
notes: "A fixture for the tests; the stub engine and this reference compute the same deterministic numbers."
