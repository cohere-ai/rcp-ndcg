id: fixture-vl-video
schema_version: "1"   # the recipe file format version (decision 18)
role: embed
input: [text, image, video]
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0", startup_timeout_s: 60}
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides: {}
  chat_template: chat.jinja
  pooler_config: {seq_pooling_type: LAST}
  trust_remote_code: false
  max_model_len: 512
  dtype: bfloat16
  plugin: null
  mm_processor_kwargs: {"images_kwargs": {"min_pixels": 784, "max_pixels": 200704}}
  limit_mm_per_prompt: {"image": 2, "video": 1}
  extra_args: ["--media-io-kwargs", '{"video": {"num_frames": 4}}']
client:
  api: openai_embeddings
  request_shape: messages
  add_generation_prompt: true
  tokenizer: ../../tokenizer.json
  max_tokens: 400
  template:
    # The served chat template (chat.jinja) frames every conversation the same way (the fixture's card is
    # document-shaped), so the declared query frame must be that frame: stage 1 renders the engine's
    # conversation against the declared shape, and a different query frame would fail the template check.
    query:
      - {fixed: "doc: "}
      - {content: query}
      - {fixed: " [END]"}
    document:
      - {fixed: "doc: "}
      - {content: document}
      - {fixed: " [END]"}
    anchor: last
  image_processor: qwen2_vl
  image_policy: {min_px: 784, max_px: 200704, engine_pixel_pinning: true}
  max_images: 2
  max_videos: 1
  video_policy: {num_frames: 4, wire: video_url, engine_video_pinning: true}
  on_overflow: cut
  empty_doc: send
  normalize: true
reference:
  kind: transformers
  score_scale: cosine
  entry: reference.py
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources: []
notes: "A fixture for the media stage's video and interleaved rows: an embedder on the messages route that takes two images and one video per request (max_images 2, max_videos 1), its video sampling pinned to 4 uniformly spaced frames per clip (engine_video_pinning, --media-io-kwargs). Its reference consumes a side's parts in the given order (an interleaved-native card) and reports a video as the declared frame count."
variants:
  - id: fixture-vl-video
    model: fixtures/VisionEmbedder
    revision: "0123456789abcdef0123456789abcdef01234567"
