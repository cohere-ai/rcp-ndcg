[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcp-ndcg-vllm-topk"
version = "0.0.1"
description = "vLLM general plugin that serves topk-io/topk-embed-v1-small (multimodal late interaction) on the stock vllm/vllm-openai image."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
  { name = "RCP-nDCG contributors" },
]
keywords = ["information-retrieval", "vllm", "late-interaction", "multi-vector", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# Deliberately empty: the distribution installs into the engine image with
# `pip install --no-deps`, and every import it makes (torch, vllm,
# transformers, the stdlib) is already satisfied there.  Any dependency here
# would make a --no-deps install incomplete or pull a second torch into the
# image; the freeze check (tests/check_no_deps_install.py) asserts a
# --no-deps install changes `pip freeze` by exactly this distribution.
dependencies = []

[project.entry-points."vllm.general_plugins"]
# Loaded by every vLLM process at startup (vllm/plugins/__init__.py,
# load_plugins_by_group).  The callable registers the checkpoint's
# architecture with the model registry; the model class itself is imported
# lazily by the registry when the architecture resolves.
rcp-ndcg-vllm-topk = "rcp_ndcg_vllm_topk.plugin:register"

[project.urls]
Homepage = "https://github.com/cohere-ai/rcp-ndcg"
Repository = "https://github.com/cohere-ai/rcp-ndcg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
