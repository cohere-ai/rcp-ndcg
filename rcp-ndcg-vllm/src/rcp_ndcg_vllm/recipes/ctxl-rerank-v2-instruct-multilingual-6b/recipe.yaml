# Serving recipe: ContextualAI/ctxl-rerank-v2-instruct-multilingual-6b on stock vLLM
# (vllm/vllm-openai:v0.31.0) as a pointwise reranker, reproducing the paper's in-process scorer
# (experiments/paper/rerankers/reference/contextual.py, ContextualRerank) through /rerank.
# 6B specifics against the 1B/2B siblings: the base architecture is Mistral
# (MistralForCausalLM, config.json model_type "mistral"), token id 0 is the "<unk>" added
# token (not "!"), and the tokenizer's TemplateProcessing post-processor prepends <s> (id 1)
# to every sequence -- so the score template emits no bos token itself (vLLM tokenizes the
# rendered prompt with add_special_tokens=True; a template bos line doubles the BOS, measured
# ids[0:3] = [1, 1, 9080] vs the reference's [1, 9080, 5627]).
# Serve with tokenizer-mode auto (the default; never --tokenizer-mode mistral: vLLM's
# cross-encoder processor refuses the mistral-common tokenizer, and the HF tokenizer.json is
# what the paper's reference reads with use_fast=True).
id: ctxl-rerank-v2-instruct-multilingual-6b
model: ContextualAI/ctxl-rerank-v2-instruct-multilingual-6b
revision: "f14ca1a2fc204dc0934c84a3d2e278f8ff646b80"
role: rerank
input: [text]
scoring: pointwise
licence: CC-BY-NC-SA-4.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0"}
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  # The ForSequenceClassification suffix maps the served model to runner=pooling + convert=classify
  # and wraps the base MistralForCausalLM with as_seq_cls_model; classifier_from_token names the
  # string whose lm_head row becomes the 1-row score head ("<unk>" is this tokenizer's id 0);
  # method no_post_processing lifts that row (no head retraining, the paper's quantity).
  hf_overrides:
    architectures: [MistralForSequenceClassification]
    classifier_from_token: ["<unk>"]
    method: no_post_processing
  # The score template vLLM serves (template.jinja, the one family-wide name): document before
  # query, no bos line (the post-processor adds
  # <s>), no instruction slot, no trailing content after the " ??" the score is read from. The file
  # ships in the recipe directory: without --chat-template, /rerank silently falls back to the
  # un-templated encode of the concatenated texts (io_processor.py:677-678 at v0.31.0); the
  # missing-template warning fires only for an original Qwen3 reranker (io_processor.py:430-432).
  chat_template: template.jinja
  # The classify pooler's default activation for num_labels < 2 is sigmoid; the raw logit the
  # reference reads (logits[:, -1, 0]) is pinned twice: the client sends use_activation from this
  # config on the wire (rcp-ndcg/src/rcp_ndcg/inference/clients/rerank.py), and this server-side default keeps
  # every other /rerank caller on the same scale.
  pooler_config: {use_activation: false}
  trust_remote_code: false
  max_model_len: 32768
  dtype: bfloat16
  plugin: null
  extra_args: []
client:
  api: rerank
  tokenizer: "ContextualAI/ctxl-rerank-v2-instruct-multilingual-6b@f14ca1a2fc204dc0934c84a3d2e278f8ff646b80"
  # The paper's budgets: the 8192-token pair budget the paper code sets (MAX_SEQ_LENGTH, not the
  # card's 32768) and the 4096-token query share of the migrated paper config
  # (experiments/paper/rerankers/ctxl_rerank_6b.yaml, migrated served-path form). The settle rule,
  # read from the merged rerank client (rcp-ndcg/src/rcp_ndcg/inference/clients/rerank.py): the pair fit binds
  # its share on overflow only, BUT the rerank client settles the shared query once per call and
  # ships it AT THE SHARE whenever it exceeds it. An over-share query (over 4096 tokens) is
  # therefore a declared divergence row -- the reference keeps the query whole and right-truncates
  # at encode -- so the gating pairs keep queries within the share.
  max_tokens: 8192
  query_max_tokens: 4096
  # The pair shape is the model's prompt, document first (a right cut would drop the query and the
  # " ??" anchor -- the anchors live at the tail). The client cuts the content spans only and
  # re-attaches the frame; the engine tokenizes the rendered string with add_special_tokens=True,
  # whose post-processor prepends <s> (id 1) -- reserved in the budget, declared here.
  template:
    pair:
      - {fixed: "Check whether a given document contains information helpful to answer the query.\n<Document> "}
      - {content: document}
      - {fixed: "\n<Query> "}
      - {content: query}
      - {fixed: " ??"}
    anchor: last
    add_special_tokens: true
  # The paper's served-path config passes the bare query (instruction: none): the paper's
  # in-process path never set ContextualRerank.instruction. The product's default is fold, which
  # would prepend "Task: ...\nQuery: ..." and diverge from the reference on instruction-bearing
  # data -- declared none here on purpose: a pairs row's instruction is ignored on both sides
  # (no side folds or appends it; the same decision as the 1b and 2b recipes).
  instruction: none
  # The reference's score is a raw logit (vocab position 0, final position): no activation. The
  # engine side is pinned by serve.pooler_config above; this records the client's intent.
  use_activation: false
  on_overflow: cut
  empty_doc: send
reference:
  kind: transformers
  score_scale: logit
  entry: reference.py
  # The paper's reference right-truncates the whole rendered prompt at 8192 tokens
  # (tokenizer truncation=True, max_length=8192), so for pairs over the cap it drops the tail
  # anchors (the query and the " ??"). The served path cuts the content spans only and
  # re-attaches the frame; stage 2 gates the under-cap pairs and reports the rest, non-gating.
  known_deviations: [anchor_drop_over_cap]
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/ContextualAI/ctxl-rerank-v2-instruct-multilingual-6b/tree/f14ca1a2fc204dc0934c84a3d2e278f8ff646b80 (config.json: MistralForCausalLM, model_type mistral, id2label {\"0\": \"LABEL_0\"}, vocab_size 131072, torch_dtype bfloat16; tokenizer.json: added tokens with id 0 \"<unk>\", 1 \"<s>\", 2 \"</s>\", 10 \"<pad>\", TemplateProcessing post-processor single: [<s>, A]; tokenizer_config.json: model_max_length ~1e30, add_bos_token true; no chat_template key in tokenizer_config.json -- the vendor chat_template.jinja emits a bos_token line)"
  - "https://huggingface.co/api/models/ContextualAI/ctxl-rerank-v2-instruct-multilingual-6b (sha f14ca1a2fc204dc0934c84a3d2e278f8ff646b80; licence tag cc-by-nc-sa-4.0; safetensors 14.93 GB stored, 13.59 GB bf16-equivalent; gated false)"
  - "https://huggingface.co/ContextualAI/ctxl-rerank-v2-instruct-multilingual-6b/blob/f14ca1a2fc204dc0934c84a3d2e278f8ff646b80/1_LogitScore/config.json (true_token_id 0; config_sentence_transformers.json activation_fn Identity -- the score is the raw vocab-position-0 logit)"
  - "vLLM v0.31.0 (image vllm/vllm-openai:v0.31.0; line numbers read at the tag): model_executor/models/registry.py:177 (MistralForCausalLM registered in v0.31.0); model_executor/models/adapters.py:600-617 and :659-663 (SEQ_CLS_LOAD_METHODS: load_weights_no_post_processing lifts lm_head row of classifier_from_token); config/model.py:2279 (the ForSequenceClassification suffix defaults to runner pooling + convert classify, v0.31.0); pooling_params.py:110-128 and :193-197 (pooler config merges into requests that omit the field -- how use_activation: false reaches every /rerank score); entrypoints/pooling/scoring/io_processor.py:693-705 (the /rerank render: two messages with roles query and document through --chat-template) and :625-627 (the per-text query pre-truncation, off unless max_tokens_per_query is sent -- the product never sends it); scoring/protocol.py:72 (the rendered prompt is tokenized with add_special_tokens=True); renderers/params.py:466-475 (engine-side truncation, right side -- unused here: the client cuts)"
  - "experiments/paper/rerankers/reference/contextual.py:37-151 (the paper-exact reference: prompt at :92-97, score at :113, left padding at :73, flash_attention_2 at :52; moved unchanged in behaviour from the pre-unification retrieval/external_rerankers.py:275-389 -- removed at the rfc-0001 merge -- when the in-process path left the package)"
  - "experiments/paper/rerankers/ctxl_rerank_6b.yaml (the paper's original in-process form set batch_size 8; the current served-path form carries max_tokens 8192, query_max_tokens 4096, instruction none, tokenizer pinned at the revision above)"
notes: >-
  Pointwise reranker; one raw logit (vocabulary position 0 at the final position) per document,
  no sigmoid/softmax. The score template puts the document before the query, so both the query
  and the trailing " ??" sit at the tail: the anchor is last, and the client's cut reserves every
  fixed token and re-attaches the frame -- the paper's in-process path instead right-truncates
  the whole prompt at 8192 (declared above as the reference's known deviation over the cap; the
  untruncated long-document prompt of the measurement made when the recipe was written is ~14.0k
  tokens, 14,037 ids for this checkpoint). template.jinja (the one family-wide template name) renders in the engine's
  context (vLLM's /rerank passes two messages, roles query and document) and in the CPU
  harness's context (flat query/document kwargs). Like the 1b and 2b templates it has no
  instruction slot: the vendor template's inline " {instruction}" (read from a kwarg or a system
  message) is dropped, because the client declares instruction: none and a pairs row's
  instruction is ignored on both sides (neither folded nor appended).

  reference.py keeps the paper's own prompt construction and score path; its prompt builder takes
  no instruction (the paper's factory never set one; this recipe's mode is none).
  Its render mode fills the harness's rerank span format with the paper's own spans -- the raw
  query and the raw documents its prompt builder receives, uncut -- and never reproduces the
  client's cut (neither the settle rule nor the anchor-preserving content cut): under the cap and
  within the share they equal the wire's spans byte for byte. Declared divergence rows and the pairs-file rule: an over-share query (over 4096 tokens
  and under the pair budget) is a declared divergence row -- the wire ships the query settled at
  its share, the reference keeps it whole -- and an over-cap pair is the declared
  anchor_drop_over_cap row; the gating pairs therefore keep queries within the share and
  documents within the budget.

  Serving needs no plugin and no image change: the architecture override, the template file and
  the pooler config suffice, and the engine's
  tokenizer-mode stays auto (never --tokenizer-mode mistral: vLLM's cross-encoder processor
  refuses the mistral-common tokenizer, and the HF tokenizer.json is what the paper's reference
  reads with use_fast=True). Numerics: bfloat16 weights; vLLM's pooling score head defaults to
  fp32 while the reference computes the whole model in bf16 -- bounded by the raw-logit gate,
  and --hf-overrides '{"head_dtype": "model"}' is the closer-to-reference fallback if the GPU
  wave's logit gate ever fails (not measured on CPU: the 14.9 GB weights are the GPU wave's). The
  GPU wave must check: the raw-logit scale of the served scores (the card's example logits
  should reproduce, not their sigmoid), the 8192 budget with the 4096-token query share on
  over-budget pairs, and stage 1's /tokenize agreement (R29).
