# The ctxl-rerank-v2-instruct-multilingual family (decision 34): one serving contract, three
# sizes, every size its own tested recipe id. The shared blocks below are the sizes' common
# contract, read off the three standalone recipes this family replaces; the variants table carries
# only the per-size facts: the checkpoint (id, model, revision), the engine's context limit, the
# score-head construction (hf_overrides: the 1b/2b checkpoints are Qwen3ForCausalLM with "!" as
# token id 0, the 6b is the vendor's MistralForCausalLM with "<unk>" as id 0).
#
# Paper reference: experiments/paper/rerankers/reference/contextual.py (ContextualRerank) with the
# paper configs experiments/paper/rerankers/ctxl_rerank_{1b,2b,6b}.yaml (batch_size 32/16/8,
# instruction: none in all three) and the paper budgets MAX_SEQ_LENGTH = 8192 and
# MAX_QUERY_LENGTH = 4096 (the pre-unified-inference retrieval/cross_encoder.py constants).
id: ctxl-rerank-v2-instruct-multilingual
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: rerank
input: [text]
scoring: pointwise
licence: CC-BY-NC-SA-4.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0"}
resources: {gpus: 1}
serve:
  runner: pooling
  # Not needed: the ForSequenceClassification architecture override applies the suffix default
  # (runner pooling, convert classify); the explicit equivalent is --runner pooling --convert classify.
  convert: null
  # hf_overrides is a per-variant override (the score-head construction: the base
  # architecture and the classifier token differ per size; see the variants table).
  chat_template: template.jinja
  # Server-side raw-logit default: the classify pooler's default activation for a 1-label head is
  # sigmoid, and _merge_default_parameters fills the unset per-request field from the pooler config
  # (vllm/pooling_params.py at the v0.31.0 tag), so every /rerank score is a raw logit for any
  # client. client.use_activation below sends the same value on the wire (the product's rerank
  # adapter carries it when the config sets it).
  pooler_config: {use_activation: false}
  trust_remote_code: false
  max_model_len: 32768       # the 1b/6b cards' context claim (config max_position_embeddings
                             # 40960); the 2b serves at 8192 (its variants-table override);
                             # every value >= the shared 8192 client budget.
                             # the paper's pair budget is the client's 8192 below
  dtype: bfloat16            # the checkpoint's torch_dtype and the paper's DTYPE
  plugin: null
  extra_args: []
client:
#   recipe: "vLLM v0.31.0 pooling runner; the ForSequenceClassification head from the checkpoint's own
#   LM (see the variants' hf_overrides); the paper prompt as the served template; raw-logit score head
#   (use_activation false both sides); client-side pair cut at 8192 tokens, the query settled at its
#   4096 share; no instruction slot (instruction: none)"
  api: rerank
  max_tokens: 8192           # the paper's MAX_SEQ_LENGTH (the pair budget the paper factory passed
                             # over the 32768 default; the pre-unification retrieval/cross_encoder.py
                             # constant, kept in experiments/paper/**); content spans are cut
                             # client-side, inside the frame, anchors reserved
  instruction: none          # the paper's served-path config (experiments/paper/rerankers/
                             # ctxl_rerank_1b.yaml says none) and what the reference reproduces: the
                             # bare query reaches the model, the instruction field is never sent and
                             # never folded into the query ("Task: ..." would be a different prompt
                             # family); template.jinja does not read the kwarg
  use_activation: false      # the reference scores the raw logit; probability-scale values would be a
                             # different stored score (serve.pooler_config pins the same server-side)
  query_max_tokens: 4096     # the served path's own query budget (the paper's MAX_QUERY_LENGTH:
                             # what the paper's served client sent as max_tokens_per_query). The
                             # settle rule, read from the merged rerank client
                             # (rcp-ndcg/src/rcp_ndcg/inference/clients/rerank.py): the pair fit binds its
                             # share on overflow only, BUT the rerank client settles the shared query
                             # once per call and ships it AT THE SHARE whenever it exceeds it. An
                             # over-share query (over 4096 tokens) is therefore a declared divergence
                             # row -- the reference keeps the query whole -- so the gating pairs keep
                             # queries within the share (known_deviations covers the over-cap rows).
  template:
    pair:
      - {fixed: "Check whether a given document contains information helpful to answer the query.\n<Document> "}
      - {content: document}
      - {fixed: "\n<Query> "}
      - {content: query}
      - {fixed: " ??"}       # the anchor: the score reads the last position, after this suffix
    anchor: last
    add_special_tokens: true # the /rerank route tokenizes with add_special_tokens=True
                             # (scoring/protocol.py:72); this checkpoint's ByteLevel post-processor
                             # adds no tokens, so the anchor edge is the " ??" ids themselves
  on_overflow: cut
  empty_doc: send            # the paper sends an empty document as the empty string
  empty_query: send          # the paper's scorer formats any query (no refusal): an empty query is
                             # sent and scored, matching the reference (owner decision 25's rule)
reference:
  kind: transformers
  score_scale: logit         # the raw bf16 logit at vocabulary position 0, final position
  entry: reference.py
  known_deviations: [anchor_drop_over_cap]
  # Declared, never chosen by torch.cuda.is_available(): the stock reference environment carries
  # the image's torch and no compiled extras, so the paper's flash-attention-2 path cannot load
  # there (GPU-E1). The follow-up measured sdpa references: 6b verified, 2b 0.0872 and 1b 0.249
  # against the 0.05 logit bound -- the fp32-head precision class, closed by the variants'
  # serve.hf_overrides head_dtype: model (the engine's score head becomes bf16 like the
  # reference's; the references stay faithful).
  attn_implementation: sdpa
  # reference.py derives from experiments/paper/rerankers/reference/contextual.py (the paper's
  # in-process scorer) with the harness's subprocess CLI; its environment is
  # experiments/paper/rerankers/reference/requirements.txt (torch 2.9.1, transformers 4.57.6;
  # flash-attn is dropped -- the reference declares sdpa above; the 1B's weights are a ~3.28 GB
  # download, so score() runs on the GPU wave).
gates: {}
status: {state: unverified, image: null, date: null, report: null}

variants:
  - id: ctxl-rerank-v2-instruct-multilingual-1b
    model: ContextualAI/ctxl-rerank-v2-instruct-multilingual-1b
    revision: "8fd1edf6a98564cb712064f884b8ef7df5c1b876"
    overrides:
      serve:
        hf_overrides:
          architectures: [Qwen3ForSequenceClassification]
          classifier_from_token: ["!"]
          method: no_post_processing
          head_dtype: model   # the engine's score head in the model's bf16, like the reference's
                              # (GPU-E1 follow-up: 1b max relative delta 0.249 at the fp32 head;
                              # vLLM's pooling head defaults to fp32, model.py at the tag)
    notes: |
      template.jinja is the vendor score template adapted for the served path: no instruction reaches the prompt (client.instruction: none, the paper's served-path mode -- the engine's instruction request field is never sent, so the template does not read the kwarg), and the bos line the vendor 6B template emits is absent (this checkpoint's ByteLevel post-processor adds no tokens; the 1B variant of the family's template). The engine renders exactly two messages (roles query and document) and tokenizes the render with add_special_tokens=True; the same render must equal the client template's segments (stage 1's template_render_check proves it).
      reference.py keeps the paper's own prompt construction and score path: the uncut prompt, whole- prompt right truncation at encode over the cap (the declared anchor_drop_over_cap deviation, stage 2's non-gating table), and no query share of its own. Its render mode fills the harness's rerank span format with the paper's own spans -- the raw query and the raw documents its prompt builder receives, uncut -- and never reproduces the client's cut (neither the settle rule nor the anchor-preserving content cut): under the cap and within the share these equal the wire's spans byte for byte; over the cap they differ by declaration and ride stage 1's non-gating table.
      Divergence rows and the pairs-file rule: an over-share query (over 4096 tokens and under the pair budget) is a declared divergence row -- the wire ships the query settled at its share, the reference keeps it whole -- and an over-cap pair is the declared anchor_drop_over_cap row. The gating pairs therefore keep queries within the share and documents within the budget; stage 1 reports over-cap pairs in its non-gating table under the declared deviation.
      The card's own vLLM recipe (VLLM_USE_V1=0 plus a logits processor over generate/logprobs) is unusable on v1 and is superseded by this one; the card documents the same target quantity (the raw logit at token id 0, final position). GPU-E1 and its follow-up: the engine's fp32 score head vs the reference's all-bf16 model measured max relative delta 0.249 at this size (bound 0.05) with an sdpa reference, so the recipe now serves `serve.hf_overrides.head_dtype: model` (the score head in the model's bf16, like the reference's) and declares `reference.attn_implementation: sdpa`; E2 re-measures both. The engine's /tokenize agreement (R29) was measured on this size: 3/70 texts diverged by 2..10 tokens (563/565, 179/184, 676/686) because `tokenizer_config.json` declares `pad_token: "+"`, which HF's AutoTokenizer adds as an added token and the product's tokenizer load now applies too (the product fix landed here); stage 1 gates it. The reference environment is reference.in/reference.lock beside reference.py (the paper's pins, flash-attn dropped).
    sources:
      - "https://huggingface.co/ContextualAI/ctxl-rerank-v2-instruct-multilingual-1b/tree/8fd1edf6a98564cb712064f884b8ef7df5c1b876 — config.json (Qwen3ForCausalLM, id2label {0: LABEL_0}, bfloat16, max_position_embeddings 40960), tokenizer.json (token id 0 \"!\", ByteLevel post-processor), 1_LogitScore/config.json (true_token_id 0), config_sentence_transformers.json (Identity activation), README (prompt, licence, 32K context)"
      - "experiments/paper/rerankers/ctxl_rerank_1b.yaml — the paper's served-path config (api rerank, the pinned revision and tokenizer, max_tokens 8192, query_max_tokens 4096, instruction: none, use_activation false); its original in-process form set batch_size 32"
      - "experiments/paper/rerankers/reference/contextual.py — ContextualRerank, the paper's in-process scorer this reference.py derives from (prompt, padding, truncation, logits[:, -1, 0], OOM halving): the move of the pre-unification retrieval/external_rerankers.py:275-389 (the rfc-0001 merge removes that path; behaviour byte-identical, built with max_seq_len=MAX_SEQ_LENGTH 8192 and the pinned revision)"
      - "reference.in/reference.lock — the reference environment (torch 2.9.1, transformers 4.57.6; flash-attn is dropped -- the reference declares attn_implementation: sdpa), from the paper's experiments/paper/rerankers/reference/requirements.txt"
      - "the paper's MAX_SEQ_LENGTH = 8192 pair budget and MAX_QUERY_LENGTH = 4096 query share (constants of the paper's original retrieval/cross_encoder.py, before the inference layer was unified; kept here as client.max_tokens/query_max_tokens)"
      - "rcp-ndcg/src/rcp_ndcg/data/templates.py — TemplateSpec: the pair frame, the anchor, add_special_tokens"
      - "rcp-ndcg/src/rcp_ndcg/data/preprocess.py — fit(): the content-only cut that reserves the frame (the anchors)"
      - "rcp-ndcg-vllm/src/rcp_ndcg_vllm/recipe.py — the Recipe schema; pooler_config keys validated against the pinned engine"
      - "vLLM v0.31.0 (verified at the tag): model_executor/models/adapters.py:307 as_seq_cls_model, :593 load_weights_no_post_processing, :637 the score head from the lm_head row, :659 SEQ_CLS_LOAD_METHODS; entrypoints/pooling/scoring/io_processor.py:605 get_score_prompt (chat-template render, :693-705), :677-678 the un-templated fallback when no template is passed; entrypoints/pooling/scoring/protocol.py:56-65 the instruction field folded into chat_template_kwargs, :72 add_special_tokens=True; pooling_params.py:111 _merge_default_parameters (pooler_config fills unset request fields); layers/pooler/activations.py (sigmoid for num_labels < 2); renderers/params.py (truncate right = slice(0, N))"
  - id: ctxl-rerank-v2-instruct-multilingual-2b
    model: ContextualAI/ctxl-rerank-v2-instruct-multilingual-2b
    revision: "6ffef5dc552583b8db58dc4a87f79f7aee78d2d9"
    overrides:
      serve:
        max_model_len: 8192
        hf_overrides:
          architectures: [Qwen3ForSequenceClassification]
          classifier_from_token: ["!"]
          method: no_post_processing
          head_dtype: model   # like the reference's bf16 head (GPU-E1 follow-up: 2b 0.0872 at fp32)
    notes: |-
      Template: the shipped template.jinja is the paper prompt as a dual-mode score template: when the harness's stage-1 check renders it with the query/document variables it renders the reference-exact prompt, and otherwise it falls back to the messages-based body (the engine's safe_apply_chat_template passes exactly two messages, roles query and document), so the engine renders the same prompt bit-exactly without the vendor template's pitfalls (the vendor chat_template.jinja reads the instruction only from a system message vLLM never sends, and would silently drop it). The template adds no instruction of its own and none is sent: the client's instruction mode is none (the paper's served-path config, experiments/paper/rerankers/ ctxl_rerank_2b.yaml: none; the paper's in-process reference never received an instruction either), so a pairs row's instruction is ignored on both sides and stage 1's template check proves the file renders exactly what fit renders. The template file MUST ship with the engine. The wave's T0 smoke should probe it (a /tokenize of one rendered prompt must carry the frame and end with the " ??" anchor token): served without --chat-template, vLLM falls back silently to the un-templated pair encode for this converted architecture (the missing-template warning fires only for an original Qwen3 reranker), which reads a different prompt with no error. Budget: max_tokens 8192 is the paper's MAX_SEQ_LENGTH, counted as the engine sees the whole prompt (frame + document + query + anchor). query_max_tokens 4096 is the paper's MAX_QUERY_LENGTH (its own served path sent it as max_tokens_per_query): the pair fit binds its share on overflow only, but the merged rerank client settles the shared query once per call and ships it at the share whenever it exceeds it (rcp-ndcg/src/rcp_ndcg/inference/clients/rerank.py) - every cut a content-span cut with the " ??" anchor reserved. The paper's in-process path instead right-truncates the whole prompt at 8192 (document first, so a long document pushes the query and the anchor out of the prompt): that drop is the declared anchor_drop_over_cap deviation, reported per pair at stage 2, non-gating. Declared divergence rows: a query over the share (over 4096 tokens and under the budget) ships settled at the share while the reference keeps it whole and scores it - so the gating pairs keep queries within the share and documents within the budget. Stage 1's render comparison holds the reference's spans (the raw query and documents the paper's prompt builder receives, uncut -- never a port of the client's cut) against the wire's: an over-share row fails it loudly, and over-cap rows ride its non-gating table. Scores: the served score is the raw logit of vocabulary position 0 at the final position (use_activation false on the client and in the pooler config); GPU-E1 and its follow-up measured the engine's fp32 score head against the reference's bf16 model at max relative delta 0.0872 (bound 0.05) with an sdpa reference, so the recipe now serves `serve.hf_overrides.head_dtype: model` and declares `reference.attn_implementation: sdpa`; E2 re-measures. No plugin: the architecture override, the chat template and the pooler config suffice on the stock v0.31.0 image.
    sources:
      - "https://huggingface.co/ContextualAI/ctxl-rerank-v2-instruct-multilingual-2b @ 6ffef5dc552583b8db58dc4a87f79f7aee78d2d9: config.json (Qwen3ForCausalLM, bfloat16, id2label {0: LABEL_0}), tokenizer.json (ByteLevel post-processor, id 0 = \"!\"), tokenizer_config.json (model_max_length 131072, truncation_side unset), 1_LogitScore/config.json (true_token_id 0), config_sentence_transformers.json (activation_fn Identity)"
      - "vLLM v0.31.0 (image vllm/vllm-openai:v0.31.0, every line below read at the tag): config/model.py:2279 (the ForSequenceClassification suffix maps to runner pooling + convert classify), model_executor/models/registry.py:201 (Qwen3ForCausalLM), model_executor/models/adapters.py:593-617 (the 1-row score head lifted from lm_head[classifier_from_token]) and :659 (SEQ_CLS_LOAD_METHODS), model_executor/layers/pooler/activations.py:134-139 (a <2-label head's default activation is sigmoid), model_executor/layers/pooler/seqwise/heads.py:194 (the per-request use_activation flag), pooling_params.py:111-128 (_merge_default_parameters fills unset request fields from the pooler config), entrypoints/pooling/scoring/io_processor.py:693-705 (/rerank renders roles query and document through --chat-template), entrypoints/pooling/scoring/protocol.py:72 (the rendered prompt is tokenized with add_special_tokens=True)"
      - "rcp-ndcg: the paper's MAX_SEQ_LENGTH = 8192 pair budget and MAX_QUERY_LENGTH = 4096 query share (constants of the paper's original retrieval/cross_encoder.py, before the inference layer was unified; kept here as client.max_tokens/query_max_tokens); experiments/paper/rerankers/ctxl_rerank_2b.yaml (the paper's config)"
      - "experiments/paper/rerankers/reference/contextual.py (the paper's original retrieval/external_rerankers.py:275-389, moved beside the paper configs when the inference layer was unified) — the paper-exact ContextualRerank this reference.py derives from (behaviour byte-identical)"
  - id: ctxl-rerank-v2-instruct-multilingual-6b
    model: ContextualAI/ctxl-rerank-v2-instruct-multilingual-6b
    revision: "f14ca1a2fc204dc0934c84a3d2e278f8ff646b80"
    overrides:
      serve:
        hf_overrides:
          architectures: [MistralForSequenceClassification]
          classifier_from_token: ["<unk>"]
          method: no_post_processing
          head_dtype: model   # like the reference's bf16 head (GPU-E1 follow-up: 6b 0.0307 at fp32)
    notes: |-
      Pointwise reranker; one raw logit (vocabulary position 0 at the final position) per document, no sigmoid/softmax. The score template puts the document before the query, so both the query and the trailing " ??" sit at the tail: the anchor is last, and the client's cut reserves every fixed token and re-attaches the frame -- the paper's in-process path instead right-truncates the whole prompt at 8192 (declared above as the reference's known deviation over the cap; the untruncated long-document prompt of the measurement made when the recipe was written is ~14.0k tokens, 14,037 ids for this checkpoint). template.jinja (the one family-wide template name) renders in the engine's context (vLLM's /rerank passes two messages, roles query and document) and in the CPU harness's context (flat query/document kwargs). Like the 1b and 2b templates it has no instruction slot: the vendor template's inline " {instruction}" (read from a kwarg or a system message) is dropped, because the client declares instruction: none and a pairs row's instruction is ignored on both sides (neither folded nor appended).
      reference.py keeps the paper's own prompt construction and score path; its prompt builder takes no instruction (the paper's factory never set one; this recipe's mode is none). Its render mode fills the harness's rerank span format with the paper's own spans -- the raw query and the raw documents its prompt builder receives, uncut -- and never reproduces the client's cut (neither the settle rule nor the anchor-preserving content cut): under the cap and within the share they equal the wire's spans byte for byte. Declared divergence rows and the pairs-file rule: an over-share query (over 4096 tokens and under the pair budget) is a declared divergence row -- the wire ships the query settled at its share, the reference keeps it whole -- and an over-cap pair is the declared anchor_drop_over_cap row; the gating pairs therefore keep queries within the share and documents within the budget.
      Serving needs no plugin and no image change: the architecture override, the template file and the pooler config suffice, and the engine's tokenizer-mode stays auto (never --tokenizer-mode mistral: vLLM's cross-encoder processor refuses the mistral-common tokenizer, and the HF tokenizer.json is what the paper's reference reads with use_fast=True). Numerics: bfloat16 weights; GPU-E1 and its follow-up measured the engine's fp32 score head against the reference's bf16 model at max relative delta 0.0307 (bound 0.05) with an sdpa reference -- the only size that passed -- so the recipe now serves `serve.hf_overrides.head_dtype: model` (the score head in the model's bf16, like the reference's) and declares `reference.attn_implementation: sdpa`; E2 re-measures. The GPU wave must check: the raw-logit scale of the served scores (the card's example logits should reproduce, not their sigmoid), the 8192 budget with the 4096-token query share on over-budget pairs, and stage 1's /tokenize agreement (R29).
