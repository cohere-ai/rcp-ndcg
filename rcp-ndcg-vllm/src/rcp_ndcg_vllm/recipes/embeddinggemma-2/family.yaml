  (fps 60, the 32-frame cap and the checkpoint's own uniform overflow strategy: video_processing_kwargs)
  -- transformers 5.19.0's EmbeddingGemma2VideoProcessor.sample_frames consumes all three and reproduces
  the digest-pinned engine's EmbeddingGemma2VideoBackend.compute_frames_index_to_sample exactly (W2
