  clip of at least 32/60 s (the client's own frame-count check admits a container only with at least 32
  frames, so a normal clip passes above that). The card's default is 1 fps and declares the rate
  configurable; this recipe's declared instrument is the 32-frame cap. The prompt renders one
  boi + 140-or-fewer soft tokens + eoi block PER FRAME (no temporal patch), so the client counts
  frames x (per-frame patches + 2).

  The pin's second home, and why it is needed (E2 round 13, the media stage's rows 36/37). The pod's engine
  is vLLM v0.31.0 (the job config's image; the wave records the pod's own version in its provenance, B5), and
  v0.31.0 has no EmbeddingGemma2VideoBackend (PR #60254 landed after the tag): the --media-io-kwargs pin
  reaches only the generic VideoBackend, which samples the 4.0 s / 8 fps / 32-frame clip whole and reports
  do_sample_frames=True, and the checkpoint's processor then resamples those 32 decoded frames with its own
  defaults (fps 1, max_frames 32) -- 4 frames, the engine's 492 = 4 x 123 against the client's 3936 = 32 x 123.
  serve.mm_processor_kwargs carries the same fps/max_frames numbers into the engine's processor call
  (vllm/model_executor/models/embedding_gemma2.py:707-721 hands the model's mm_processor_kwargs to the
  processor), so the processor samples at 60 fps capped at 32 frames -- 32 -- in every engine the pod runs;
  on the declared nightly (whose EmbeddingGemma2VideoBackend samples the pin itself and reports
  do_sample_frames=False) the processor keeps the backend's frames and the numbers are inert. CPU-proven on
  the pod's engine image + the staged plugin wheel with the shipped clip: without the pin the processor
  returns 4 frames / 492 tokens, with it 32 / 3936; the reference passes the same numbers through
  processing_kwargs (video_processing_kwargs), so both sides sample the clip the same way. The media wave
  must confirm the engine's sampled count and token count on a real clip; a clip whose frame rate exceeds
  60 fps and whose duration is under 0.53 s can make the engine sample fewer than 32 (the one declared open
  corner).

  Budgets. client.max_tokens 8192 is the card's 8K context, counted as the engine sees the whole prompt
  (BOS + prefix + content + EOS, plus any media tokens reserved whole); the content span is cut
  (on_overflow: cut) and the frame re-attached, so the prefix survives. The card's own ST path truncates the
  assembled prompt right at max_seq_length inside encode; the reference renders the full prompt and declares
  over_cap_cut_differs, so over-cap rows ride the non-gating table and under-cap rows gate exactly. dtype
  bfloat16 (the card's rule; never float16). empty_doc: send -- the card embeds an empty document as its
  bare document prompt, which is the empty string under the prefix. The 32-bit offset fault (a 262144-token
  warmup) and the exactly-max_model_len pooling hang (observed at 32768) do not arise at this recipe's 8192
  cap: the engine's warmup is one 8192-token sequence -- the pairs' length:at_budget row (8188 tokens) and
  the wave's smoke exercise the boundary.
  Media outputs (stage 2 compares them): the reference's embed mode reads the harness's `media` field --
  a media side becomes a one-user-turn conversation with the parts in order (the card injects the
  declared prompt as its system message, which the checkpoint's template renders first), an image a
  loaded PIL image PREPARED at the card's fixed point (the card's own resize rule, read from the loaded
  processor's own module -- `get_aspect_ratio_preserving_size` -- and iterated to the size the processor
  keeps, applied in one pass with the processor's own `resample`: the pixels the client's preparation
  sends the engine, so the processor's own resize is the identity on them; see the image-row paragraph
