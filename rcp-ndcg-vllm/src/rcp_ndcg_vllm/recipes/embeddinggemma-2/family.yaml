  would give [0, 1, 2, ...]), so the reference never samples with the generic rule -- and computes the
  card's vectors for media rows exactly as for text rows, so stage 2 gates them by the same cosine rule;
  the media stage still gates placement, geometry and tokens.

  The two image rows' input difference (E2 rounds 13-14, rows 31/32, cosines 0.9956 and 0.9941 full width,
  0.994-0.998 at every declared k in round 13). The cause is measured on CPU against the checkpoint's own
  processor (transformers 5.19.0, the pinned revision): the product prepares an image at
  `rcp_ndcg.data.resolution.gemma4_fixed_point` -- the size the processor KEEPS, so the engine's own resize
  is the identity -- while the card's processor resizes the RAW image in ONE step
  (`get_aspect_ratio_preserving_size`), and for these two extreme-aspect images the two differ: the shipped
  576x4096 receipt lands on 288x2160 (2,430 patches = 270 soft + the 2 markers = the 272 tokens the client
  counts and the engine's usage delta reports) where the card's single resize gives 288x2112 (2,376 patches =
  264 + 2 = 266), and the 3000x20 strip on 13344x48 (2,502 patches = 278 + 2 = 280, the engine's 280) where
  the card's gives 9792x48 (1,836 patches = 204 + 2 = 206). The engine
  sees the prepared bytes (272/280, the client's count -- the media stage's engine check passes on both
  rows); the reference's embed mode handed the checkpoint's processor the RAW image (266/206), so the two
  sides' patch layouts differed and the pooled vectors moved by exactly the observed amount. Every other image
  row is at or beside its fixed point, which is why only these two were off. Round 14's fix: the reference's
  embed mode prepares the image at the card's fixed point before the processor sees it, so the processor's
  own resize is the identity on the reference's side too -- the same pixels the served path sends -- with the
  rule taken from the loaded processor's own module rather than a second implementation (measured on CPU
  with the checkpoint's own processor: the reference's prepared image is pixel-identical to the client's
  prepared bytes for these rows and for the rows already at their fixed point, and the processor's own count
  of it is 272/280, the client's numbers). The wave's re-run re-measures the rows: they must land at the
  bf16 floor (>= 0.999) or the residual must be explained with the same evidence. No per-variant bound is
  declared: a `gates.vec_min_cosine` low enough for these rows (0.994) would hide the same-sized difference
  on every row of the variant.

  MRL. The card's Matryoshka set {128, 256, 512, 768} is declared once, in the client's mrl_kind/mrl_dims
  and in serve.hf_overrides (the engine refuses a per-request dimensions without is_matryoshka, and the
  checkpoint declares neither key). The recipe ships the full 768-wide vector; a run selects k from the
  declared set (engine-side `dimensions` or the client-side mrl_dim), and the GPU wave gates each declared
  k (the stage-2 ex-post cut) -- the 768 is the model's own projected output, so both paths are the
  card's truncation order.
