# Serving recipe family: microsoft/harrier-oss-v1 (270m, 0.6b, 27b) on stock vLLM (image
# vllm/vllm-openai:v0.31.0). One family, three sizes (owner decision 34): every fact below is measured
# at each variant's pinned revision (the variant rows carry their own file citations), and the shared
# blocks are shared because the checkpoints agree byte for byte where it matters -- modules.json is
# byte-identical at all three revisions (sha256 84e40c8e006c9b1d6c122e02cba9b02458120b5fb0c87b746c41e0207cf642cf:
# sentence-transformers Transformer -> Pooling -> Normalize), config_sentence_transformers.json is
# byte-identical (sha256 ad2096929147368b5d0ba5322ea394d50911be4d348091c9f3b0ad06c3763d91), the MTEB
# v2 evaluation prompts are byte-identical (sha256 08aaf10dc3d61ac54af15027d3a491ea06b2ed3edcb06dc05584539f5555fe51),
# and 1_Pooling/config.json differs only in word_embedding_dimension (640 / 1024 / 5376 -- the per-size
# dim). The backbones differ (Gemma3TextModel for the 270m and the 27b, Qwen3Model for the 0.6b), and
# each variant's tokenizer follows from its own model id (injected per variant as model@revision); the
# only template-visible consequence is WHICH post-processor token is appended -- the anchor declaration
# below (anchor: last with add_special_tokens: true) covers both. Nothing else differs per size, so the
# family shares one template, one reference and one client shape.
#
# Served path (every fact measured at the v0.31.0 tag): the engine is told --runner pooling and the
# decoder backbones are converted to embedding models (convert auto -> embed for a pooling runner on a
# non-pooling architecture: the *Model suffix default at vllm/config/model.py:2288 and the
# sentence-transformers fallback at :1310; the conversion wraps the loaded class at
# vllm/model_executor/model_loader/utils.py:272-277). The pooler needs no flag: the checkpoints' own
# sentence-transformers metadata resolves LAST pooling + L2 normalize (modules.json -> 1_Pooling/config.json
# pooling_mode_lasttoken + the Normalize module; vllm/transformers_utils/config.py:982-1066, applied at
# vllm/config/model.py:733-753 unless a user --pooler-config overrides). Attention is causal (the card:
# "decoder-only architectures"; the Gemma3 layers are DECODER attention with the per-layer type from
# config.layer_types at vllm/model_executor/models/gemma3.py:153-156, 175-182, 198; Qwen3 is plain
# causal). dtype bfloat16 is the checkpoints' own dtype, and v0.31.0 refuses float16 for gemma3_text
# outright (vllm/config/model.py:2330-2335).
id: harrier-oss-v1
schema_version: "1" # the recipe file format's version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: embed
input: [text]
licence: mit
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0"}
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null # auto-resolves to embed for a pooling runner on either backbone: the *Model suffix
    # default (model.py:2288, try_match_architecture_defaults :2296-2311) matches both Gemma3TextModel
    # and Qwen3Model; the :1310-1311 ST fallback is for the *ForCausalLM case
  hf_overrides: {} # the checkpoints declare their architectures; the engine normalizes the unregistered
    # Qwen3Model to Qwen3ForCausalLM itself (registry.py:1287-1313 _normalize_arch, called at :1348/:1402)
    # and the lm_head is tied
  chat_template: null # no template file ships: the served route renders no template over string inputs
    # (vllm/entrypoints/pooling/base/io_processor.py:136-160; renderers/inputs/preprocess.py:129-132 is
    # the decode-only prompt path), and the checkpoints' own chat templates (the Gemma and Qwen instruct
    # templates) are for chat, not for the embeddings route
  pooler_config: {} # resolved from the checkpoints' own ST metadata (LAST + normalize); the argv sends
    # an empty object, which overrides nothing (a user --pooler-config would)
  trust_remote_code: false # no remote code in any of the three repos (no *.py among the Hub siblings)
  max_model_len: 32768 # the card's own "Max Tokens" column for every variant (32,768) and its
    # transformers snippet's max_length; the 27b's larger max_position_embeddings (131072) is NOT
    # served -- the 32-bit arithmetic is in the notes. Given explicitly so a tokenizer change cannot
    # silently raise it.
  dtype: bfloat16 # config.json dtype (bfloat16) on all three; gemma3_text refuses float16 at the tag
  plugin: null
  extra_args: []
client:
#   recipe: "vllm v0.31.0: --runner pooling (convert auto -> embed); the pooler resolves from the checkpoints' sentence-transformers metadata (last-token + L2 normalize); bare strings on /v1/embeddings with the post-processor anchor appended (the Gemma variants' eos id 1, the 0.6b's endoftext id 151643)"
  api: openai_embeddings
  # The frame is the template below: the client prepends nothing (the product refuses
  # query_prompt/doc_prompt beside a template -- one home for a prompt prefix), so the two fields
  # stay undeclared and resolve empty.
  request_shape: text # rendered strings to /v1/embeddings, never `messages` (the chat-embed drift)
  # The card's own budget: "Max Tokens 32,768" for every variant and max_length=32768 in the
  # transformers snippet. The cut is content-spans-only with every fixed token and the post-processor's
  # anchor reserved and re-attached (the product's fit) -- the anchor always survives. The merged
  # product's embedding client fits every request to this budget on the wire
  # (rcp_ndcg.data.preprocess.fit), audited in stage 1 against the captured wire; the GPU wave's
  # /tokenize and vector gates catch drift.
  max_tokens: 32768
  template:
    query:
      # The checkpoint's own sentence-transformers "web_search_query" prompt, byte-identical at all
      # three revisions (config_sentence_transformers.json prompts.web_search_query) and to the card's
      # get_detailed_instruct fold -- WITH the trailing space after "Query: " this checkpoint's prompt
      # carries (unlike the Qwen3-Embedding family's no-space form; both ST prompts file and the
      # card's f-string agree here).
      - {fixed: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "}
      - {content: query}
    document:
      # Documents are embedded bare ("No need to add instruction for retrieval documents", card).
      - {content: document}
    anchor: last             # the models pool the last token: the post-processor's appended anchor
                             # (the Gemma variants' eos id 1; the 0.6b's endoftext id 151643), whose
                             # place this content-final shape declares with add_special_tokens: true
    add_special_tokens: true # both routes: vLLM's pooling routes add the post-processor tokens
  on_overflow: cut
  empty_doc: send # no empty-document rule exists in the checkpoints' own config; the served engine
    # embeds the post-processor's tokens alone
  normalize: true # the server pooler already L2-normalises (the ST Normalize module); the client's is
    # idempotent
reference:
  kind: sentence_transformers
  score_scale: cosine
  entry: reference.py
  # The card's sentence-transformers path truncates ids at encode at the module's max_seq_length --
  # unset in the checkpoints (no sentence_bert_config.json, no max_seq_length in modules.json), so
  # sentence-transformers INFERS it as min(config.max_position_embeddings, tokenizer.model_max_length)
  # (models/Transformer.py at >=3.0): 32768 for the 270m and the 0.6b, 131072 for the 27b. The
  # post-processor appends the pooled anchor after truncation, so the anchor survives the ST cut
  # (measured at the pinned revisions). The card's transformers snippet cuts ids at 32768 keeping the
  # anchor; the client cuts verbatim text and re-tokenizes with the anchor reserved: both keep every
  # anchor, the content boundary can differ over the cap. The reference renders/encodes the card's
  # prompt (never the client's cut), so over-cap rows ride the non-gating table;
  # under-cap rows gate exactly.
  known_deviations: [over_cap_cut_differs]
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/microsoft/harrier-oss-v1-270m (card: the family description, the table's Max Tokens 32,768, the sentence-transformers and transformers usage, the FAQ's instruction requirement)"
  - "https://huggingface.co/microsoft/harrier-oss-v1-0.6b (card: the same usage; the card text is identical across the three variants except the model name)"
  - "https://huggingface.co/microsoft/harrier-oss-v1-27b (card: the same usage and Max Tokens 32,768)"
  - "modules.json, byte-identical at all three pinned revisions (sha256 84e40c8e006c9b1d6c122e02cba9b02458120b5fb0c87b746c41e0207cf642cf): Transformer -> Pooling -> Normalize -- the family's shared pipeline"
  - "1_Pooling/config.json at each pinned revision: pooling_mode_lasttoken true, every other mode false; the only differing key is word_embedding_dimension (640/1024/5376)"
  - "config_sentence_transformers.json, byte-identical at all three pinned revisions (sha256 ad2096929147368b5d0ba5322ea394d50911be4d348091c9f3b0ad06c3763d91): prompts.web_search_query is the query frame above, similarity_fn_name cosine"
  - "mteb_v2_eval_prompts.json, byte-identical at all three pinned revisions (sha256 08aaf10dc3d61ac54af15027d3a491ea06b2ed3edcb06dc05584539f5555fe51): 131 per-task instructions, the model-owned MTEB v2 prompts (decision 33's task-instruction field)"
  - "vllm tag v0.31.0 vllm/model_executor/models/registry.py:228 (Gemma3TextModel -> gemma3.Gemma3Model, _EMBEDDING_MODELS) and :201 (Qwen3ForCausalLM; the Qwen3Model architecture normalizes to it at :1287-1313, called at :1348/:1402)"
  - "vllm tag v0.31.0 vllm/config/model.py:2288 (the *Model suffix default -> pooling/embed; try_match_architecture_defaults :2296-2311) and :1310-1311 (the fallback for a *ForCausalLM checkpoint)"
  - "vllm tag v0.31.0 vllm/model_executor/model_loader/utils.py:272-277 (convert=embed wraps the resolved class as_embedding_model) and vllm/model_executor/models/adapters.py:250-268 (the default: the normalized hidden state of the last token)"
  - "vllm tag v0.31.0 vllm/transformers_utils/config.py:982-1066 (get_pooling_config: modules.json + the Pooling module's config resolve seq_pooling_type LAST and use_activation) applied at vllm/config/model.py:733-753"
  - "vllm tag v0.31.0 vllm/model_executor/models/gemma3.py:153-156, 175-182, 198 (per-layer attention from config.layer_types: sliding_attention with config.sliding_window, full_attention global; per_layer_sliding_window) and :175-182 (is_causal -> DECODER: causal attention, the card's decoder-only)"
  - "vllm tag v0.31.0 vllm/config/model.py:2330-2335 (_FLOAT16_NOT_SUPPORTED_MODELS: gemma3/gemma3_text refuse float16) and vllm/config/model.py:2132-2166 (causal + LAST pooling supports chunked prefill)"
  - "vllm tag v0.31.0 vllm/engine/arg_utils.py:2860-2866 (default max_num_batched_tokens 16384 on >=160 GB GPUs) and vllm/config/scheduler.py:315-327 (max_num_batched_tokens < max_model_len requires chunked prefill)"
  - "vllm tag v0.31.0 vllm/renderers/params.py:183 (add_special_tokens defaults to true on the pooling routes) and vllm/entrypoints/pooling/base/io_processor.py:136-160 (no chat template is applied to string inputs)"
  - "sentence-transformers >=3.0 sentence_transformers/models/Transformer.py (the Transformer module infers max_seq_length = min(config.max_position_embeddings, tokenizer.model_max_length) when the checkpoint sets none; the post-processor appends the pooled anchor after truncation)"
  - "rcp-ndcg/src/rcp_ndcg/inference/clients/embed.py (the wired client prepends query_prompt/doc_prompt, then the budget renders the template -- hence empty prompts here and the frame as fixed segments)"
  - "rcp-ndcg-vllm/src/rcp_ndcg_vllm/recipes/harrier-oss-v1/reference.in (the reference environment: sentence-transformers for the card's usage; render mode needs only huggingface-hub)"
notes: >
  One family, three sizes (decision 34), the evidence for one: the pipeline files agree byte for byte
  (modules.json, config_sentence_transformers.json, mteb_v2_eval_prompts.json identical at all three
  pinned revisions; 1_Pooling/config.json differs only in word_embedding_dimension), the cards are the
  same text with the same usage for all three sizes, and the served path is identical: --runner
  pooling, convert auto -> embed, the pooler from the checkpoints' own sentence-transformers metadata
  (last-token + L2 normalize), causal attention, bfloat16, no plugin, no trust-remote-code, no
  template file. The backbones differ (Gemma3TextModel 270m/27b, Qwen3Model 0.6b) and each variant's
  tokenizer follows from its model id (injected per variant); the only template-visible consequence is
  which post-processor token the route appends (the anchor declaration covers both), and the dims
  640/1024/5376 are the checkpoints' own (no Matryoshka field exists in the cards, so the client
  declares none). Served = the client renders the template (the query prompt for queries, bare text
  for documents) and POSTs strings to /v1/embeddings; vLLM v0.31.0 serves each checkpoint with
  --runner pooling only. Prompt format: the frame ends "Query: " WITH a trailing space -- the
  checkpoint's own web_search_query prompt carries it (config_sentence_transformers.json, byte-pinned)
  and the card's get_detailed_instruct f-string writes "Query: {query}" the same way; the other
  preconfigured prompts (sts_query, bitext_query) are other tasks' frames -- specialising the task
  means a new recipe whose frame is that prompt (a new content identity), never a per-run field.
  Instructions (decision 33): the checkpoint's mteb_v2_eval_prompts.json holds the model's 131 per-task
  instructions; decision 33 assigns them to Dataset.task_instruction (model-owned, per task) and this
  family's target placement is the card's own fold: "Instruct: <instruction>\nQuery: <text>" -- this
  recipe's frame is exactly that fold with the retrieval default baked in, so a task-specialised recipe
  replaces the Instruct text and keeps the frame (the card's own usage wins over the generic Task:
  prefix, decision 9). The field's product-side plumbing lands with workstream 10 (the embed role's
  template refuses an instruction span today), so until then a task-specialised serving recipe is a new
  content identity. A per-query instruction
  (Query.instruction) no template slot exists for on the embed roles: the generic appended default
  applies product-side when a dataset carries one, and any instruction a pairs row carries is ignored
  on both sides of the equivalence check. Anchor: the served route appends the tokenizer's
  post-processor token and last-token pooling reads it -- both shapes end on their content span and
  pin add_special_tokens: true (the Gemma variants append the eos token, id 1, and lead with bos id 2;
  the 0.6b's Qwen tokenizer appends the endoftext id 151643 -- measured at the pinned revisions). The
  card's example (its own queries and documents) renders to 27 framed-query ids per variant and ends
  on the anchor (measured, pinned by the family test). Budgets: client.max_tokens is 32768 -- the
  card's "Max Tokens" for every variant and the transformers snippet's max_length; the cut applies to
  the content spans only, after reserving the frame (19-20 content ids of head, measured) and the
  appended anchor, and re-attaching the frame, so the anchor always survives. The card's
  transformers path truncates ids at 32768 (tokenizer(truncation=True, max_length=32768)); its
  sentence-transformers path truncates at the Transformer module's max_seq_length, which
  sentence-transformers infers when the checkpoint sets none (no sentence_bert_config.json, no
  max_seq_length in modules.json) as min(config.max_position_embeddings, tokenizer.model_max_length)
  (models/Transformer.py at >=3.0) -- 32768 for the 270m and the 0.6b, 131072 for the 27b -- and the
  post-processor appends the anchor after truncation, so it survives that cut too (measured at the
  pinned revisions); the client cuts verbatim text: over the cap the content boundary can differ
  while both keep the anchor, so the recipe declares over_cap_cut_differs, the reference's render is
  the card's own prompt (it never ports the client's cut), over-cap rows ride the harness's
  non-gating table and under-cap rows gate byte-exactly. No separate query cap exists in the referent -- the card truncates queries and
  documents alike at 32768 -- so query_max_tokens is not declared and both shapes draw on max_tokens.
  Wiring: every request is fitted to the declared budget on the wire by the merged product's embedding
  client (rcp_ndcg.data.preprocess.fit), audited in stage 1 against the captured wire. The 27b's
  131072 max_position_embeddings is NOT served: the card declares Max Tokens 32,768 for every variant
  (its transformers snippet truncates at 32768), and serving the full context would put the GPU-E1
  32-bit element-index limits under one forward of 131072 tokens -- the MLP activation alone is
  131072 x 21504 (intermediate_size) = 2.82e9 elements, over 2^31 (2,147,483,648), the fault class
  that killed pplx-embed-v2-context-9b-preview at 262144 (GPU-E1); at the card's own 32768 the same
  product is 32768 x 21504 = 7.0e8 elements, well under. Pooling hang: on v0.31.0 a pooling prompt of
  exactly max_model_len tokens can stick under the default chunked prefill (max_num_batched_tokens
  16384 on the >=160 GB GPUs; GPU-E1; fixed upstream in vllm#48039). ALL THREE VARIANTS NEED THE
  OPT-IN: client.max_tokens == serve.max_model_len == 32768, so the client's over-cap cut lands exactly
  on the documented trigger, and no flag workaround ships (a --max-num-batched-tokens raise would
  re-open the 32-bit arithmetic the 27b's budget exists to avoid, and the flag is not the recipe's
  contract). The family opts into the pooling-full-context patch module (lane rf-engine) as soon as
  the recipe opt-in field exists; until then this note is the declaration and the wave monitors the
  at-budget ladder. The engine image's transformers pin at the tag is >=5.10.4,<5.18.0
  (requirements/common.txt); the tokenizer files are pinned by revision and the stage-1 zero-tolerance
  token-id check on the GPU host is the designed catch for library drift. No media processor settings
  apply: the models are text-only (input: [text], no processor files in any of the three repos).
  resources.gpus: 1 for every variant: the 27b's bf16 weights are ~54 GB, inside one B200. Reference
  environment: reference.in/reference.lock (sentence-transformers for the card's usage; render mode
  needs only huggingface-hub -- see reference.py).
variants:
  - id: harrier-oss-v1-270m
    model: microsoft/harrier-oss-v1-270m
    revision: "31de22b673913c7d658c0f03f792d77c2dcf8ebd"
    notes: >
      The 270m size: a Gemma3TextModel backbone (config.json model_type gemma3_text, 18 layers, hidden
      640, intermediate 2048) whose layer_types are all full_attention -- the config's sliding_window
      512 and sliding_window_pattern 1 never apply (vLLM reads layer_types per layer, gemma3.py:153-156),
      so every layer is global causal attention. Embedding dim 640 (1_Pooling/config.json
      word_embedding_dimension). The tokenizer appends the eos token (id 1) after the content and leads
      with bos (id 2) -- the appended eos is the pooled anchor.
    sources:
      - "https://huggingface.co/microsoft/harrier-oss-v1-270m/raw/31de22b673913c7d658c0f03f792d77c2dcf8ebd/config.json (architectures [Gemma3TextModel], dtype bfloat16, layer_types 18x full_attention, max_position_embeddings 32768, use_bidirectional_attention false: causal)"
      - "https://huggingface.co/microsoft/harrier-oss-v1-270m/raw/31de22b673913c7d658c0f03f792d77c2dcf8ebd/1_Pooling/config.json (lasttoken pooling, dim 640)"
  - id: harrier-oss-v1-0.6b
    model: microsoft/harrier-oss-v1-0.6b
    revision: "f9b9dc8d367d443f2479d27aa5d8d2850c0774ee"
    notes: >
      The 0.6b size: a Qwen3Model backbone (config.json model_type qwen3, 28 layers, all
      full_attention, hidden 1024, intermediate 3072, tie_word_embeddings true -- the engine normalizes
      the unregistered Qwen3Model architecture to Qwen3ForCausalLM and the unused lm_head ties to
      embed_tokens, so no weights are missing). Embedding dim 1024. The tokenizer appends the Qwen
      endoftext token (id 151643) -- the pooled anchor; no bos is added. Its tokenizer_config's
      model_max_length is 131072, but the model config and the card both declare 32768.
    sources:
      - "https://huggingface.co/microsoft/harrier-oss-v1-0.6b/raw/f9b9dc8d367d443f2479d27aa5d8d2850c0774ee/config.json (architectures [Qwen3Model], dtype bfloat16, layer_types 28x full_attention, tie_word_embeddings true, max_position_embeddings 32768)"
      - "https://huggingface.co/microsoft/harrier-oss-v1-0.6b/raw/f9b9dc8d367d443f2479d27aa5d8d2850c0774ee/1_Pooling/config.json (lasttoken pooling, dim 1024)"
  - id: harrier-oss-v1-27b
    model: microsoft/harrier-oss-v1-27b
    revision: "0c0fc62f6d8af9e8604cb818c412301b103a0093"
    notes: >
      The 27b size: a Gemma3TextModel backbone (config.json model_type gemma3_text, 62 layers in the
      5:1 sliding_attention:full_attention pattern with sliding_window 1024, hidden 5376, intermediate
      21504, rope_scaling linear factor 8 on the global layers, head_dim 128, 32 heads over 16 kv
      heads). Embedding dim 5376. max_position_embeddings is 131072 but it is NOT served: the card
      declares Max Tokens 32,768 for every variant, and one forward of 131072 tokens would push the
      MLP activation (131072 x 21504 = 2.82e9 elements) over 2^31 (the GPU-E1 32-bit element-index
      limits) -- see the family notes. ~54 GB of bf16 weights fit the slot's one GPU. Over-cap
      declaration, precisely: the card's sentence-transformers path truncates this variant at 131072
      (its inferred max_seq_length), i.e. beyond the client's 32768 boundary, so at the client's cap
      the reference is WHOLE and the client is the only side that cuts -- the comparison over the cap
      is a whole-prompt vs content-cut one, not two different cut points. The only declaration that
      matches what the reference does is over_cap_cut_differs (anchor_drop_over_cap would be false:
      no anchor is dropped on either side; the post-processor appends after truncation), and its
      effect -- the client-changed texts are reported non-gating -- is the right one.
    sources:
      - "https://huggingface.co/microsoft/harrier-oss-v1-27b/raw/0c0fc62f6d8af9e8604cb818c412301b103a0093/config.json (architectures [Gemma3TextModel], dtype bfloat16, layer_types 52x sliding_attention + 10x full_attention, sliding_window 1024, rope_scaling linear factor 8, max_position_embeddings 131072)"
      - "https://huggingface.co/microsoft/harrier-oss-v1-27b/raw/0c0fc62f6d8af9e8604cb818c412301b103a0093/1_Pooling/config.json (lasttoken pooling, dim 5376)"
