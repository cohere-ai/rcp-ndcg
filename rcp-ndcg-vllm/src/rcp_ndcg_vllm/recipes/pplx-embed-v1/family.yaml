# Serving recipe for the pplx-embed-v1 family (perplexity-ai/pplx-embed-v1-0.6b and
# -4b): dense text embedders on a diffusion-continued-pretrained Qwen3 backbone with
# bidirectional attention -- one mean-pooled float vector per text (1024 dims at 0.6B,
# 2560 at 4B), no instruction and no prompt prefix, Matryoshka-capable, and an
# int8/binary storage view the checkpoint's sentence-transformers pipeline applies after
# pooling. The checkpoint's architecture PPLXQwen3Model is Qwen3Model with an all-to-all
# attention mask (modeling.py), so the stock engine serves it as its own Qwen3ForCausalLM
# converted to pooling with is_causal false (see the notes, "The serving path"); the only
# plugin need is the config class that lets config.json parse locally (model_type
# bidirectional_pplx_qwen3 -> rcp_ndcg_vllm.models.pplx.hf_config.PplxV1Config, registered by
# the folded pplx plugin). Sources are revision-pinned.
id: pplx-embed-v1
schema_version: "1"   # the recipe file format version (decision 18)
role: embed  # one mean-pooled vector per text, compared by cosine
input: [text]
licence: MIT  # the model card metadata; the repositories ship no LICENSE file
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  min_version: "0.31.0"
resources: {gpus: 1}  # bf16 weights ~1.2 GB (0.6B) / ~8.0 GB (4B) + KV; one 80 GB-class GPU each
serve:
  runner: pooling
  convert: null  # no --convert flag: a pooling runner on the non-pooling Qwen3ForCausalLM
                 # architecture auto-resolves to embed (vllm/config/model.py:1311 at the tag)
  hf_overrides:
    # The checkpoint's own architecture (PPLXQwen3Model) is not in vLLM's registry
    # (registry.py:201 carries Qwen3ForCausalLM only), and its modeling.py is exactly
    # Qwen3Model with bidirectional attention: post_init flips every layer's is_causal and
    # forward builds an all-to-all mask. The stock class reads the same contract from the
    # config (qwen3.py:191-197: is_causal false -> AttentionType.ENCODER_ONLY), so the
    # architecture and the contract are pinned here, not inferred.
    architectures: ["Qwen3ForCausalLM"]
    is_causal: false
  chat_template: null  # no chat template anywhere: the checkpoint ships none
                       # (tokenizer_config.json has no chat_template key) and the card's
                       # usage embeds raw text; the /v1/embeddings string route renders none
  pooler_config: {}  # resolved from the checkpoint's own sentence-transformers metadata:
                     # modules.json -> 1_Pooling/config.json pooling_mode_mean_tokens ->
                     # seq_pooling_type MEAN, and no Normalize module -> use_activation
                     # false (vllm/transformers_utils/config.py:982-1063, merged at
                     # vllm/config/model.py:730-746). A user --pooler-config would override
                     # it; the declared empty {} sends no values and overrides nothing
  trust_remote_code: false  # the checkpoint's config.json carries an auto_map to
                            # configuration.PPLXQwen3Config, but the plugin registers that
                            # class locally with transformers' AutoConfig (same model_type),
                            # so the engine parses config.json itself and never fetches or
                            # executes the checkpoint's remote configuration.py
  max_model_len: 32768  # config.json max_position_embeddings: the model's own context
                        # (the card's "Context 32K"). The tokenizer's model_max_length is
                        # 131072 (tokenizer_config.json), ABOVE the model's range; the
                        # client's budget and this flag are the model's number, never the
                        # tokenizer's
  dtype: bfloat16  # the served dtype. The checkpoint's weights are float32 (config.json
                   # dtype); bf16 halves them (~1.2 GB / ~8.0 GB) and is the family's
                   # uniform choice. The reference runs the checkpoint's own fp32 (the
                   # card's SentenceTransformer passes no dtype override), so the
                   # served-vs-reference cast is a declared deviation quantified by stage
                   # 2's vector gate and the wave's retrieval numbers
  plugin: rcp-ndcg-vllm  # the model plugins fold into this wheel (layout-move item 3; pure
                         # Python, installed with --no-deps before the engine starts); it
                         # registers the family's config class and the two other pplx
                         # architectures, and nothing of it reaches the argv
  plugin_architectures: [PplxV1Config]  # the plugin registration this recipe's engine uses (a config-only class: the stock Qwen3ForCausalLM serves the model)
  io_processor_plugin: null  # the stock string-route IO processor suffices
  mm_processor_kwargs: {}
  limit_mm_per_prompt: null
  extra_args: []
  # The pooling hang at exactly max_model_len (GPU-E1): client.max_tokens EQUALS
  # serve.max_model_len (32768) on both variants, so a full-budget request is exactly the
  # prompt the v0.31.0 scheduler never finishes (32768 hangs, 32767 returns). The
  # pooling-full-context patch is the upstream fix (vllm-project/vllm#48039, commit e6fc81bc78);
  # delete it when engine.image moves to the first release that carries the commit.
  patches: [pooling-full-context]
client:
  api: openai_embeddings
  request_shape: text  # raw rendered strings to /v1/embeddings; the card's usage embeds
                       # the text itself (no instruction, no chat render)
  recipe: "vLLM v0.31.0 pooling runner; the stock Qwen3ForCausalLM converted to embed with is_causal false; the plugin-registered config class parses config.json locally; the checkpoint's own ST metadata resolves MEAN pooling and no activation; raw text on /v1/embeddings; the 32768-token right cut client-side"
  # The budget is the model's own context, as the card's table states (32K): config.json
  # max_position_embeddings 32768. The checkpoint ships no sentence_bert_config.json and no
  # config_sentence_transformers.json, so there are no per-task caps and no prompts; both
  # shapes are capped by this one number, and the reference's own cut derives the same
  # number from min(tokenizer_config model_max_length, config max_position_embeddings) --
  # sentence-transformers' Transformer caps the tokenizer at max_position_embeddings.
  max_tokens: 32768
  template:
    # The card's "Instruction: No": the model embeds the text as given, so both shapes are
    # the bare content span. No special token is added on either side: the tokenizer's
    # post-processor is ByteLevel with no BOS/EOS template (tokenizer.json), so
    # add_special_tokens is a measured no-op (ids(text, True) == ids(text, False)), and
    # mean pooling reads every kept position (no fixed head to reserve).
    query:
      - {content: query}
    document:
      - {content: document}
    anchor: mean  # per-token mean pooling: the model reads its output from every kept
                  # position, not one fixed position
    add_special_tokens: true  # the pooling routes' engine default; a measured no-op for
                              # this tokenizer
  on_overflow: cut
  empty_doc: omit_zero  # an empty document renders ZERO tokens for this tokenizer (no
                        # frame, no post-processor): sent, the engine's MEAN pooler would
                        # divide by zero (NaN), and the card's path pools an empty input to
                        # a zero vector. omit_zero never sends it and places a zero vector,
                        # recorded as the declared empty policy -- the pairs generator
                        # leaves the empty-content row out and records the stratum absent
  instruction: none     # the card's own instruction is baked into the fixed frame; a dataset task
                        # instruction is refused, never silently folded
  normalize: true  # the card compares by cosine and the served vectors are unnormalized
                   # (use_activation false: no Normalize module); the client L2-normalises,
                   # which the cosine comparison does not need but the pipeline's uniform
                   # rule applies
  dimensions: null  # the full width (1024 / 2560). The card's table marks MRL available,
                    # but the checkpoint's config.json declares neither is_matryoshka nor
                    # matryoshka_dimensions, so a per-request `dimensions` would be refused
                    # by the engine; a sub-dimension serving is its own recipe with its own
                    # gates (the qwen3-embedding precedent)
  # No MRL head (owner decision 39): the card's table says "MRL: Yes" but the card gives no set and
  # no method, and config.json declares neither is_matryoshka nor matryoshka_dimensions; the card's
  # claim is not a supported set (nothing is cut or defaulted silently), so the declaration is `none`
  # until a set is named.
  mrl_kind: none
reference:
  kind: sentence_transformers  # the model card's own path: SentenceTransformer(repo,
                               # trust_remote_code=True) -- the checkpoint's remote
                               # configuration.py/modeling.py/st_quantize.py are its own code
  score_scale: cosine  # dense vectors; the card compares them by cosine
  entry: reference.py
  known_deviations: [over_cap_cut_differs]  # the card's own path right-cuts the text's ids
                                            # at 32768 (sentence-transformers'
                                            # truncation="longest_first" at the capped
                                            # max_seq_length); the reference renders exactly
                                            # that cut by character offsets and keeps whole
                                            # tokens of whole characters, while the client
                                            # cuts text -- an id cut inside a multi-token
                                            # character reads one id no text carries
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  # The checkpoints, every file fetched at the pinned revisions (2026-10-09).
  - "https://huggingface.co/perplexity-ai/pplx-embed-v1-0.6b @ 2c4d510dd4a732063c31a0f70193e35067b51fd8 (README.md: the model table -- 1024 dims, 32K context, MRL yes, INT8/BINARY, instruction No, Mean pooling, 'All models are built on diffusion continued pre-trained Qwen3 at Perplexity AI', the SentenceTransformers usage with trust_remote_code=True and encode(texts, quantization='binary'), the ONNX float+int8+binary outputs, 'natively produce *unnormalized* int8-quantized embeddings ... compare them via *cosine similarity*', licence mit; config.json: architectures [PPLXQwen3Model], auto_map AutoConfig/AutoModel, model_type bidirectional_pplx_qwen3, hidden_size 1024, num_hidden_layers 28, num_attention_heads 16, num_key_value_heads 8, head_dim 128, intermediate_size 3072, max_position_embeddings 32768, dtype float32, tie_word_embeddings true, use_bidirectional_attention true, layer_types all full_attention, vocab_size 151936, rope_theta 1000000; configuration.py: PPLXQwen3Config(Qwen3Config) with model_type only; modeling.py: PPLXQwen3Model(Qwen3Model), post_init sets every layer's is_causal False, forward builds the all-to-all mask via create_causal_mask with or_mask_function; modules.json: Transformer -> 1_Pooling -> st_quantize.FlexibleQuantizer; 1_Pooling/config.json: word_embedding_dimension 1024, pooling_mode_mean_tokens true (the 4B's identical file omits include_prompt); st_quantize.py: FlexibleQuantizer default quantization 'int8' = round(tanh(x) * 127).clamp(-128, 127); tokenizer_config.json: model_max_length 131072, bos null, eos/pad endoftext (id 151643), no chat_template, split_special_tokens false; tokenizer.json: ByteLevel post-processor with no BOS/EOS template, NFC normaliser, 151669 entries incl. the added Qwen specials; model.safetensors header: 310 F32 tensors, 596,049,920 params, names unprefixed (embed_tokens.weight, layers.*, norm.weight), no lm_head (tied) and no projection; the card's MRL row gives no set -- mrl_kind: none is the declaration)"
  - "https://huggingface.co/perplexity-ai/pplx-embed-v1-4b @ 06456497a00540a582918fe8dcd3a5eabb207772 (README.md: 2560 dims, the same 32K/MRL/INT8/No/Mean row, licence mit; config.json: hidden_size 2560, num_hidden_layers 36, num_attention_heads 32, num_key_value_heads 8, head_dim 128, intermediate_size 9728, max_position_embeddings 32768, dtype float32, tie_word_embeddings true, use_bidirectional_attention true; 1_Pooling/config.json: word_embedding_dimension 2560, pooling_mode_mean_tokens true; model.safetensors header: 398 F32 tensors, 4,022,468,096 params, the same unprefixed names, no lm_head and no projection; the tokenizer.json, tokenizer_config.json, configuration.py, modeling.py, modules.json and st_quantize.py are byte-identical to the 0.6B's at their pinned revisions -- measured by SHA-256 -- and special_tokens_map.json differs only in the serialization of sep_token as a plain string instead of an object)"
  # vLLM at the pinned image: the v0.31.0 tag (db9527a46873454610df6dbedf79a36d6bf1a7f6).
  - "vllm v0.31.0, why the stock class serves it: vllm/model_executor/models/registry.py:201 -- the registry carries Qwen3ForCausalLM ('qwen3', 'Qwen3ForCausalLM') and no PPLXQwen3Model entry; vllm/model_executor/models/qwen3.py:265 Qwen3Model(Qwen2Model) and :272 Qwen3ForCausalLM; :191-197 Qwen3DecoderLayer reads getattr(config, 'is_causal', True) and builds AttentionType.ENCODER_ONLY (bidirectional) when false -- the hook the recipe's hf_overrides is_causal: false drives; vllm/config/model.py:1311 the pooling-runner fallback returns convert 'embed' for a non-pooling architecture, and vllm/model_executor/model_loader/utils.py:277 wraps the class with as_embedding_model (adapters.py:250)"
  - "vllm v0.31.0, why the weight names load: vllm/model_executor/models/adapters.py:189-192 -- the converted pooling wrapper's _load_pooling_model_weights probes the candidate prefixes ['', 'model.'] against its parameter names and prepends the one that matches, so this checkpoint's UNPREFIXED tensors (embed_tokens.weight, layers.*, norm.weight; the model class is the bare Qwen3Model) land on Qwen3ForCausalLM's model.* parameters; config.json tie_word_embeddings true and the absent lm_head load as the tied alias the loader already skips (vllm/model_executor/models/utils.py:202-215, :475-486)"
  - "vllm v0.31.0, the pooling and the budget: vllm/transformers_utils/config.py:982-1063 get_pooling_config reads modules.json and the pooling module's config.json (the module type table at :57-60 includes sentence_transformers.models.Pooling) and resolves pooling_mode_mean_tokens true -> seq_pooling_type MEAN with use_activation = the presence of a Normalize module (false here: the pipeline's third module is the quantiser); vllm/config/model.py:730-746 merges that base config under the user's pooler_config; vllm/model_executor/layers/pooler/seqwise/poolers.py:97-105 builds the embed pooler (EmbeddingPoolerHead + PoolerNormalize) and vllm/pooling_params.py:164-168 defaults use_activation only when nothing set it, so the metadata's false stands; seqwise/methods.py:60-107 MeanPool averages over each sequence's prompt tokens"
  - "vllm v0.31.0, the config parse: vllm/transformers_utils/config.py HFConfigParser.parse (~:359-437) -- a model_type outside the engine's _CONFIG_REGISTRY goes through AutoConfig.from_pretrained with the request's trust_remote_code; the plugin's AutoConfig.register of model_type bidirectional_pplx_qwen3 (rcp_ndcg_vllm.models.pplx.hf_config.PplxV1Config, the checkpoint's own class restated) makes transformers resolve the local class and skip the remote-code branch, so trust_remote_code stays false and nothing remote runs"
  - "vllm v0.31.0, the pooling hang at exactly max_model_len: the first GPU wave's measured result -- any pooling prompt of exactly max_model_len tokens that is chunked never completes (32768 hangs, 32767 returns); the jina recipe's wave verified with --max-num-batched-tokens 32768; this family's client budget EQUALS its max_model_len, so a full-budget request is exactly that input (see the notes, 'The exactly-max_model_len hang')"
  - "sentence-transformers v6.x (the card's own dependency): sentence_transformers/base/modules/transformer.py -- __init__ caps tokenizer.model_max_length at config.max_position_embeddings when no model_max_length was passed (:874-883); the max_seq_length property reads the capped tokenizer value (:1136-1146); the text modality defaults to padding + truncation 'longest_first' (:1260) with max_length = the task cap when one is configured (none is: the checkpoint ships no sentence_bert_config.json) and the tokenizer's capped model_max_length otherwise. The reference restates exactly this cap derivation (min of tokenizer_config.json model_max_length and config.json max_position_embeddings)"
  - "rcp-ndcg: rcp-ndcg/src/rcp_ndcg/inference/config.py (EmbeddingEndpoint: max_tokens, template, empty_doc/omit_zero, normalize, dimensions, request_shape); rcp-ndcg/src/rcp_ndcg/data/templates.py (TemplateSpec: content-only shapes, anchor mean, add_special_tokens); rcp-ndcg/src/rcp_ndcg/data/preprocess.py (TextBudget/fit: content-only cuts, census)"
  - "docs/how-to/add-a-model.md (the anchor rule: cuts touch content spans only, never the fixed tokens a model reads its output from; a content-only shape declares mean pooling)"
notes: |
  What the model is. A dense text embedder: one mean-pooled vector per text (1024 dims
  at 0.6B, 2560 at 4B), no instruction and no prompt prefix (the card's model table:
  "Instruction: No", "Pooling: Mean"), Matryoshka-capable (the card's "MRL: Yes"), and an
  int8/binary *storage* view of the pooled vector (the card: "natively produce
  *unnormalized* int8-quantized embeddings. Ensure that you compare them via *cosine
  similarity*"). The checkpoint is a Qwen3 backbone whose weights were
  diffusion-continued-pretrained ("All models are built on diffusion continued pre-trained
  Qwen3 at Perplexity AI") and whose attention is bidirectional: modeling.py's
  PPLXQwen3Model is Qwen3Model with post_init setting every layer's is_causal false and
  forward building an all-to-all mask (create_causal_mask with an or_mask_function). The
  sentence-transformers pipeline is Transformer -> 1_Pooling (mean tokens) ->
  st_quantize.FlexibleQuantizer (the int8/binary storage step). There is no head and no
  projection: the output width is the hidden size.

  The serving path (established from the v0.31.0 tag source, no model class needed):
  - The architecture. vLLM v0.31.0's registry carries Qwen3ForCausalLM and no
    PPLXQwen3Model (registry.py:201). The checkpoint's class is Qwen3Model with
    bidirectional attention, so the recipe pins hf_overrides {architectures:
    [Qwen3ForCausalLM], is_causal: false}: the stock Qwen3DecoderLayer reads the flag
    (qwen3.py:191-197) and builds ENCODER_ONLY attention, and a pooling runner on a
    non-pooling architecture auto-resolves to convert embed (model.py:1311).
  - The config. model_type bidirectional_pplx_qwen3 is outside vLLM's _CONFIG_REGISTRY;
    the plugin registers the checkpoint's own class locally with transformers'
    AutoConfig (rcp_ndcg_vllm.models.pplx.hf_config.PplxV1Config, a plain Qwen3Config
    subclass with the model_type), so config.json parses locally and
    trust_remote_code stays false. This is the plugin's only role for this family: no
    model class registers, because the stock Qwen3ForCausalLM conversion is the model.
  - The weights. The checkpoint saves the bare Qwen3Model state dict, so its tensor names
    are UNPREFIXED (embed_tokens.weight, layers.*, norm.weight; safetensors header).
    The converted pooling wrapper's loader probes the candidate prefixes ["", "model."]
    (adapters.py:189-192) and prepends model. to land them on Qwen3ForCausalLM's
    parameters; the tied lm_head (tie_word_embeddings true, no lm_head tensors) loads as
    the skipped alias.
  - The pooling. The checkpoint's own ST metadata resolves the pooler: modules.json ->
    1_Pooling/config.json pooling_mode_mean_tokens true -> seq_pooling_type MEAN, and no
    Normalize module -> use_activation false (config.py:982-1063, merged at
    model.py:730-746). The engine therefore returns the unnormalized mean-pooled hidden
    state; the client L2-normalises it (cosine is scale-invariant, so the comparison is
    unaffected).
  - The wire. Raw text on /v1/embeddings (request_shape text), no chat template
    (tokenizer_config.json has none), add_special_tokens a measured no-op (ByteLevel
    post-processor with no BOS/EOS template; ids(text, True) == ids(text, False)).

  The reference contract (stage 2): the card's own sentence-transformers path, loaded with
  trust_remote_code=True, stopped before its trailing FlexibleQuantizer. The served engine
  returns the float mean-pooled vector; the quantiser is a storage format applied after
  pooling, and comparing the served float vector against a lossy re-encoding would measure
  the quantiser, not the serving path. The reference asserts the pipeline's module classes
  (Transformer, Pooling, FlexibleQuantizer) before dropping the last, so a checkpoint
  revision that changes the pipeline fails loudly. The reference's own cut derives the
  card's cap from min(tokenizer_config.json model_max_length 131072, config.json
  max_position_embeddings 32768) = 32768 -- exactly what sentence-transformers'
  Transformer caps the tokenizer to -- and renders the card's right cut of the ids; where
  the card's id cut and the client's text cut differ (an id cut inside a multi-token
  character), the recipe declares over_cap_cut_differs and the harness reports those rows
  non-gating. The int8 view's cosine to the float view is data-dependent (the quantiser is
  round(tanh(x) * 127).clamp(-128, 127)); the wave's T3 numbers are the served float
  retrieval numbers, with the card's published int8 numbers as the sanity column and any
  deviation explained.

  The exactly-max_model_len hang (GPU-E1, applies to both variants): the client's
  max_tokens EQUALS serve.max_model_len (32768 = the model's own context; the
  tokenizer's 131072 is above the model's range and is not a budget). Any pooling prompt
  of exactly max_model_len tokens that is chunked never completes on vLLM v0.31.0
  (GPU-E1: 32768 hangs, 32767 returns); the jina recipe's wave verified with
  --max-num-batched-tokens 32768. The declared `serve.patches: [pooling-full-context]` is the remedy
  (the upstream fix, exported into the engine process by the serve path); this family's two variants need it
  (a request that fills the whole budget is exactly the hanging input).

  The 32-bit check at max_model_len (GPU-E1's second lesson: attention q bytes and MLP
  activation elements below 2^31 for one forward): at 32768 tokens, 0.6B q bytes =
  32768 x 16 heads x 128 head_dim x 2 B = 134,217,728 and MLP elements = 32768 x 3072 =
  100,663,296; 4B q bytes = 32768 x 32 x 128 x 2 = 268,435,456 and MLP elements =
  32768 x 9728 = 318,767,104. Every number is below 2^31, so no variant needs the
  32-bit warmup guard (contrast pplx-embed-v2-context-9b-preview, whose 262144-token
  warmup overflows).

  Per-size facts (each variant's own notes carry the file:key citations): the output
  width is 1024 (0.6B) / 2560 (4B) -- 1_Pooling/config.json word_embedding_dimension,
  equal to config.json hidden_size; the context limit is 32768 for both (config.json
  max_position_embeddings; the card's 32K); the weights are float32 (config.json dtype);
  and both sizes fit one 80 GB-class GPU at bf16: ~1.2 GB (596,049,920 params) / ~8.0 GB
  (4,022,468,096 params) plus the KV cache (0.6B 114,688 B/token x 32768 = 3.8 GB; 4B
  147,456 B/token x 32768 = 4.8 GB), so resources.gpus 1 for both.

  What the GPU wave must check (NOT MEASURED on CPU):
  - T0: the plugin wheel loads (pip freeze differs by exactly that wheel), the config
    parses locally (no remote code fetch; trust_remote_code stays false in the argv), and
    the engine's --max-model-len is 32768.
  - T2 stage 2: served vs reference vector cosine per text (the bf16 cast is the declared
    deviation; the bidirectional ENCODER_ONLY attention is the serving contract), and the
    /tokenize equality on prompts over 32768 tokens.
  - The exactly-max_model_len hang: the declared `serve.patches: [pooling-full-context]` carries the
    upstream fix into the engine process; the wave records that the full-budget request completes.
  - The empty document: the client's omit_zero never sends it (the pairs generator
    records the empty-content stratum absent); a served empty prompt would be a NaN --
    assert the policy, never send one.
  - The quantiser sanity: the reference's float vectors against the card's int8 view
    (round(tanh(x) * 127)) on the wave's pairs, as the T3 sanity column.

  Record hygiene: every per-size number above is derived from the pinned files' headers
  and keys; the wave's observations are the only place served numbers move.
  Precision bounds (the E2 round-2 wave, stage 2): the reference runs the checkpoint's own fp32
  (the card's SentenceTransformer passes no dtype override) while the engine serves bf16, so
  stage 2's cosine gate quantifies the cast. Measured served-vs-reference minimum cosine per
  variant: 0.6b 0.998196 (two of 67 vectors), 4b 0.999169 (above the published 0.999 floor). The
  0.6b declares its measured floor in overrides.gates.vec_min_cosine 0.9981 (the measured
  0.998196 rounds to 0.9982, which the `>=` gate would miss, so the declared bound is one step
  below the rounded value); the 4b keeps the published 0.999. Every bound is declared with that
  measured evidence, never defaulted; the re-run measures them again.
