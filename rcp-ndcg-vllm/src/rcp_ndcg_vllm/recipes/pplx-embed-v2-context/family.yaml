# Serving recipe for perplexity-ai/pplx-embed-v2-context-9b-preview on the stock
# vllm/vllm-openai:v0.31.0 image plus the folded model plugin of
# rcp-ndcg-vllm (rcp_ndcg_vllm.models). Sources are
# revision-pinned.
id: pplx-embed-v2-context
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: multi_vector  # one 2048-d int8-valued vector per document chunk; the query is one vector
input: [text]  # the checkpoint ships a vision tower, but the embedding code is text-only
licence: MIT
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  min_version: "0.31.0"
  startup_timeout_s: 3600  # above the 1800 default: 33.6 GB of fp32 checkpoint to fetch and cast on a cold cache
resources: {gpus: 1}  # bf16 weights 16.8 GB (see serve.dtype) + KV; an 80 GB-class GPU
serve:
  runner: pooling
  convert: null  # the plugin's model class sets is_pooling_model itself (colqwen3_5.py:133 precedent)
  hf_overrides: {}  # the plugin's config handler promotes text_config.is_causal=false to the level vLLM reads
  chat_template: null  # see notes: the /pooling completion route applies no chat template at the pinned engine
  pooler_config: {task: token_embed}
  trust_remote_code: false  # not needed: the plugin registers the checkpoint's config class with
                            # transformers' AutoConfig (hf_config.PplxContextualConfig, a line-for-line
                            # restatement of the remote configuration_pplx_contextual.py:6-27 class),
                            # so config.json parses locally and the remote module never executes
  max_model_len: 262144  # the model's own limit (query_length/document_length); the model raises beyond it
  dtype: bfloat16  # the served dtype: vLLM v0.31.0's GDN prefill kernels refuse float32 on every
                   # backend (see notes, "dtype"), so the reference's fp32 run (the card loads the
                   # checkpoint at its config dtype, float32) cannot be matched exactly on this
                   # engine; bfloat16 rather than float16 keeps fp32's exponent range for the
                   # cast. A declared served-vs-reference deviation, quantified by stage 2's
                   # tolerance gate and the wave's retrieval numbers
  plugin: rcp-ndcg-vllm  # the models fold into this wheel (layout-move item 3); --no-deps install
  plugin_architectures: [PplxContextualModel]  # the architecture this recipe's engine registers; the behaviour fingerprint keys its modules
  patches: []  # no engine patch this recipe opts into
  extra_args: []
client:
#   recipe: "vLLM v0.31.0 pooling runner; plugin-registered PplxContextualModel (Qwen3_5-based contextual chunk model: span-mean per chunk, int8 tanh head, bidirectional attention); the role-prefix frame (by name in the template); token-id wire; 262142-token right cuts client-side"
  api: vllm_pooling
  request_shape: token_ids  # the plugin's contract: the model reads the reference's id-level render
  # The model's own limit is 262144 model-side ids; the model-side count of a render
  # is the engine-side count plus a content-dependent prefix delta (the [D] prefix
  # crosses as two literal ids where the engine-side count keeps one special id, and
  # the first content pretoken re-tokenizes with the prefix's trailing space: measured
  # deltas 0..+2, worst 2), so 262142 reserves two tokens and no measured render hits
  # the model's own over-limit raise. See the notes.
  max_tokens: 262142
  outputs: per_chunk  # the contextual chunk model answers one slice of chunk vectors per
                      # input (the remote code pools one span mean per chunk), so the
                      # pooling adapter's one-vector-per-prompt-token cross-check does
                      # not apply and is skipped
  template:
    # The role prefixes by NAME (the product's special-name resolution keeps a name's
    # significant whitespace exactly; these added tokens' names carry a
    # significant trailing space). The render check pins the resolved spelling against
    # the reference's constants.
    query:
      - {fixed: "{special:[Q] }"}
      - {content: query}
    document:
      - {fixed: "{special:[D] }"}
      - {content: document}
    anchor: first  # the leading role prefix is the load-bearing fixed token: the query mean includes it, the document spans are located after it, and the plugin reads it to tell the roles apart
    add_special_tokens: true  # the pooling route's engine default; this tokenizer's post-processor appends nothing (measured)
  on_overflow: cut
  empty_doc: send  # the model's own empty-chunk branch pools to the zero vector
  normalize: true
  embed_dtype: float16  # the owner's Q11 decision; int8-valued vectors survive the cast exactly
  dim: 2048
  # The card's MRL declaration (owner decision 39): "trained with Matryoshka losses at 1024 and 2048
  # dimensions. To use 1024-dimensional embeddings, take the first 1024 values of each unnormalized
  # embedding and normalize afterwards" (README.md:80-88, code sample e[:, :1024] then e / norm).
  # Truncation of the projected output: the served head is span-mean -> contextual_projection -> slice
  # -> L2, and /pooling refuses a per-request dimensions, so the client-side mrl_dim applies exactly
  # the card's cut-then-renormalise. 2048 is the full width (the default); a run selects 1024.
  mrl_kind: truncation
  mrl_dims: [1024, 2048]
reference:
  kind: remote_code  # the checkpoint's trusted code (custom_code tag), transformers AutoModel with trust_remote_code=True
  score_scale: cosine
  entry: reference.py
  known_deviations: []
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
