    revision: "5cf2132abc99cad020ac570b19d031efec650f2b"
    overrides:
      serve: {max_model_len: 40960}   # config.json max_position_embeddings at this size (the 0.6b's is 32768)
    notes: >-
      Per-size facts, read at the pinned revision. Architecture: Qwen3ForCausalLM
      (config.json:architectures), model_type qwen3. Width: hidden_size 2560 (config.json:hidden_size),
      equal to the served vector width (1_Pooling/config.json:word_embedding_dimension); 36 layers,
      32 attention heads, 8 KV heads, head_dim 128, intermediate_size 9728 (config.json). Context:
      config.json:max_position_embeddings is 40960, so serve.max_model_len carries 40960 (the
      family's rule: the checkpoint's own limit, given explicitly); the card's Model Overview table
      advertises 32K and no served request reaches either cap (client.max_tokens 8192). One forward
      of 40960 tokens stays inside the 32-bit envelope: attention q 32 x 128 x 40960 x 2 B = 3.4e8 B,
      MLP activations 9728 x 40960 = 4.0e8 elements. Weights: bfloat16 (config.json:torch_dtype),
      8,043,548,672 B = 7.49 GiB in 2 shards (model.safetensors.index.json:metadata.total_size),
      embeddings tied (config.json:tie_word_embeddings true). KV at 40960 tokens: 2 x 36 layers x
      8 KV heads x 128 head_dim x 2 B = 147,456 B/token x 40960 = 6.04 GB = 5.6 GiB, so bf16 weights +
      KV fit one 80 GB-class GPU (resources.gpus 1, the family's). Tokenizer: vocab.json (sha256
      ca10d7e9...) and merges.txt (sha256 8831e4f1...) are byte-identical to the 0.6b row's, the 14
      special added tokens are identical (endoftext 151643 among them), and the post-processor is the
      same ByteLevel + TemplateProcessing that appends endoftext (tokenizer.json:post_processor): the
      card's example query renders to the same 27 ids and its document to 8, each ending on 151643.
      The tokenizer.json file itself is the earlier build (sha256 83cdf8c3..., 22 added tokens: it
      carries none of the 0.6b build's four non-special tool/think tokens), config.json:eos_token_id
      is 151645 rather than the 0.6b's 151643, and tokenizer_config.json:chat_template is the earlier
      Qwen3 template rather than the 0.6b's thinking-aware one: rendering the card's example query
      through this size's own template gives 24 ids (23 without the tokenizer specials) without a
      generation prompt and 27 (26) with one, where the family's shared comment cites the 0.6b's
      13/12 and 15-16. None of the three is read on this route (the pooled anchor is the
      post-processor's appended endoftext and no template is rendered, request_shape text). Prompts:
      config_sentence_transformers.json:prompts.query and :prompts.document are byte-identical to the
      0.6b row's (similarity_fn_name cosine), so the family's fixed query frame is this checkpoint's
      own prompt; the card's get_detailed_instruct snippet and its 8192-token example budget are the
      same. MRL: the card offers 32..2560 output dimensions (README.md); client.dimensions stays null
      (the full 2560-wide vector is served). Pooling and normalisation: 1_Pooling/config.json:
      pooling_mode_lasttoken true with every other mode false, and modules.json ending in the
      Normalize module -- LAST + L2, the family's served path. The family's ONE reference loads this
      row's model and revision from --recipe.
