# Serving recipe: Qwen/Qwen3-Embedding-0.6B on stock vLLM (image vllm/vllm-openai:v0.31.0).
#
# Served path (every fact measured at the pinned revision and the v0.31.0 tag): the checkpoint declares
# architectures=[Qwen3ForCausalLM] (config.json:4), a generate architecture by suffix, so the engine
# is told --runner pooling and converts the decoder itself (--convert resolves to embed; the fallback
# return sits at vllm/config/model.py:1311 at tag v0.31.0). The pooler needs no flag: the checkpoint's own sentence-transformers metadata resolves
# LAST pooling + L2 (modules.json -> 1_Pooling/config.json pooling_mode_lasttoken, Normalize module;
# vllm/transformers_utils/config.py:982-1063, applied at vllm/config/model.py:740-746). The client
# owns the content: queries are the sentence-transformers "query" prompt (the model card's
# get_detailed_instruct, no space after "Query:"), documents are bare, and the engine tokenizes the
# rendered strings with the tokenizer's post-processor (add_special_tokens=True, the route default,
# vllm/renderers/params.py:183), appending the endoftext anchor (id 151643) that last-token pooling
# reads.
id: qwen3-embedding
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: embed
input: [text]
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0"}
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null # auto-resolves to embed for a pooling runner on a ForCausalLM arch (model.py:1311 tag)
  hf_overrides: {} # the checkpoint already declares the architecture vLLM converts
  chat_template: null # no template file ships: the served route renders no template over string
    # inputs (vllm/renderers/inputs/preprocess.py:129-132; io_processor.py:126-160), and the
    # checkpoint's own chat template is the Qwen3 *instruct* template -- for the card's example
    # query it renders 13 ids with the tokenizer specials on and no assistant generation prompt
    # (12 without the specials, 15-16 with the generation prompt) vs the reference's 27 (measured).
    # A template file ships only for a route that renders one; this route never does, so a
    # template file would be inert or harmful.
  pooler_config: {} # resolved from the checkpoint's own ST metadata (LAST + normalize); the
    # recipe sends no values (serve_argv always renders --pooler-config '{}', so the flag is present
    # and empty; a user override is a different content identity)
  trust_remote_code: false # no remote code in the repo (no *.py among the Hub siblings)
  max_model_len: 32768 # config.json max_position_embeddings, given explicitly so a tokenizer change
    # cannot silently raise it
  dtype: bfloat16 # config.json torch_dtype
  plugin: null
  extra_args: []
client:
#   recipe: "vllm v0.31.0: --runner pooling (convert auto -> embed); the pooler resolves from the checkpoint's sentence-transformers metadata (last-token + L2 normalize); bare strings on /v1/embeddings with the post-processor anchor appended"
  api: openai_embeddings
  # The frame is the template below: the client prepends nothing (the product refuses
  # query_prompt/doc_prompt beside a template -- one home for a prompt prefix), so the two fields
  # stay undeclared and resolve empty.
  request_shape: text # rendered strings to /v1/embeddings, never `messages` (the chat-embed drift)
  # The card's transformers example cuts at 8192 tokens (the architecture allows 32768). The cut is
  # content-spans-only with every fixed token and the post-processor's anchor reserved and
  # re-attached (the product's fit) -- the anchor always survives. The merged product's embedding
  # client fits every request to this budget on the wire (rcp_ndcg.data.preprocess.fit), audited in
  # stage 1 against the captured wire; the GPU wave's /tokenize and vector gates catch drift.
  max_tokens: 8192
  template:
    query:
      # The sentence-transformers "query" prompt, byte-identical to config_sentence_transformers.json
      # prompts.query and to the card's get_detailed_instruct task fold: no space after "Query:"
      # (the card's own TEI curl example carries a space -- a measured id drift at index 19).
      - {fixed: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"}
      - {content: query}
    document:
      # Documents are embedded bare ("No need to add instruction for retrieval documents", card);
      # config_sentence_transformers.json prompts.document is "".
      - {content: document}
    anchor: last             # the model pools the last token: the post-processor's appended endoftext anchor,
                             # whose place this content-final shape declares with add_special_tokens: true
    add_special_tokens: true # both routes: vLLM's pooling routes add the post-processor tokens
  on_overflow: cut
  empty_doc: send # no empty-document rule exists in the checkpoint's own config; the served engine
    # embeds the lone endoftext token
  instruction: none  # the card's own instruction is baked into the fixed frame; a dataset task
                     # instruction is refused, never silently folded
  normalize: true # the server pooler already L2-normalises (ST Normalize module); the client's is
    # idempotent
  dimensions: null # full 1024-d vectors. MRL 32..1024 is available per request via the OpenAI
    # dimensions field (cut BEFORE L2, vllm seqwise/heads.py:85-105); a sub-dimension serving is its
    # own recipe with its own gates
reference:
  kind: transformers
  score_scale: cosine
  entry: reference.py
  # The CPU reference materially moves the gate (GPU-E1: 0.99885 on CPU vs 0.99948 on GPU at the
  # 0.6b against the 0.999 vector bound), so the wave must run the reference on a GPU of its own.
  # The same bf16-on-CPU class applies to the 4b/8b sizes; E2 confirms per size.
  device: cuda
  # The card truncates the ids (HF truncation=True, max_length=8192: 8191 content+frame ids, then the
  # appended anchor), the client cuts verbatim text and re-tokenizes: both keep every anchor, the
  # content boundary can differ over the cap. The reference renders the card's uncut prompt and never
  # ports the client's cut, so over-cap rows ride the non-gating table; under-cap rows gate exactly.
  known_deviations: [over_cap_cut_differs]
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B (card: prompt format, padding, Matryoshka, 32k, TEI curl example)"
  - "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B/raw/97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3/config.json (architectures, torch_dtype, max_position_embeddings)"
  - "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B/raw/97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3/config_sentence_transformers.json (prompts.query / prompts.document, byte-pinned in the template)"
  - "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B/raw/97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3/modules.json and 1_Pooling/config.json (LAST pooling + Normalize)"
  - "vllm tag v0.31.0 vllm/config/model.py:2272-2293 (ForCausalLM suffix -> generate) and :1311 (pooling runner on a non-pooling arch falls back to convert=embed)"
  - "vllm tag v0.31.0 vllm/model_executor/models/registry.py:201 (Qwen3ForCausalLM registration)"
  - "vllm tag v0.31.0 vllm/transformers_utils/config.py:990-1076 (the checkpoint's ST metadata resolves the pooler)"
  - "vllm tag v0.31.0 vllm/renderers/params.py:183 (add_special_tokens defaults to true on the pooling routes), :342-348 (truncate_prompt_tokens with truncation_side unset reaches the tokenizer), :334-341 and :451-465 (a side-set truncation slices ids and drops the anchor)"
  - "vllm tag v0.31.0 vllm/renderers/inputs/preprocess.py:129-132 and vllm/entrypoints/pooling/base/io_processor.py:126-160 (no chat template is applied to string inputs)"
  - "vllm tag v0.31.0 vllm/entrypoints/pooling/embed/protocol.py:39-41 and vllm/model_executor/layers/pooler/seqwise/heads.py:85-105 (dimensions: MRL cut before L2)"
  - "vllm tag v0.31.0 vllm/entrypoints/pooling/base/protocol.py:325-340 (embed_dtype affects base64/bytes only; encoding_format float is float32)"
  - "vllm tag v0.31.0 docs/models/pooling_models/embed.md:53,99 (Qwen3ForCausalLM converted embed; the 0.6B example)"
  - "rcp-ndcg/src/rcp_ndcg/inference/clients/embed.py (the wired client prepends query_prompt/doc_prompt, then the budget renders the template -- hence empty prompts here and the frame as fixed segments)"
  - "sglang docs/docs/supported-models/embedding_models.mdx:91-97 and python/sglang/srt/models/qwen3_embedding.py:41-43 (the SGLang alternative: --is-embedding, native LAST + normalize -- a different engine, never mixed into this vLLM recipe)"
  - "rcp-ndcg-vllm/src/rcp_ndcg_vllm/recipes/qwen3-embedding/requirements-reference.txt (the reference environment: torch, transformers>=4.51 for embed mode; render mode needs only tokenizers + huggingface_hub)"
notes: >
  Served = the client renders the template (the query prompt for queries, bare text for documents)
  and POSTs strings to /v1/embeddings; vLLM v0.31.0 serves the checkpoint with --runner pooling only
  (pooling and normalisation resolve from the checkpoint's own sentence-transformers metadata; no
  --hf-overrides, no chat template, no trust_remote_code, no plugin). Prompt format: the frame ends
  with "Query:" and the query follows with NO space; the card's own TEI curl example writes a space
  after "Query:" and shifts the ids (measured divergence at index 19) -- the sentence-transformers
  prompts and the card's Python snippets are the canonical no-space form. Instruction: the query
  frame IS the instruction (config_sentence_transformers.json prompts.query); specialising the task
  means rewriting the frame in this recipe (a new content identity), never a per-run or server-side
  instruction field. Anchor: the served route appends the tokenizer's post-processor endoftext (id
  151643) and last-token pooling reads it -- the query shape ends on its content span and pins
  add_special_tokens: true, declaring that appended token as the shape's anchor (the harness's
  anchor audit reads the post-processor's tail alone there; the product refuses an empty fixed
  segment, and this content-final declaration is what it offers instead). Truncation: client.max_tokens is 8192
  (the card's example budget); the cut applies to the query span only, after reserving the frame
  (19 content ids + the appended anchor: overhead 20 and 1 for query and document, measured) and
  re-attaching the frame, so the anchor always survives -- the card's own HF truncation keeps the
  same invariant (8191 content+frame ids + the anchor at 8192, measured at 9008 tokens), while a
  naive first-8192-token cut of the rendered ids drops it and diverges at exactly the pooled token
  (measured). The card cuts ids while the client cuts verbatim text, so over the cap the content
  boundary can differ while both keep the anchor: the recipe declares over_cap_cut_differs, the
  reference's render is the card's uncut prompt (it never ports the client's cut), over-cap rows
  ride the harness's non-gating table and under-cap rows gate byte-exactly. Wiring: every request is fitted to
  the declared budget on the wire by the merged product's embedding client
  (rcp_ndcg.data.preprocess.fit), audited in stage 1 against the captured wire. Per-shape query
  caps (whether query_max_tokens applies): no separate query cap exists in the
  referent -- the card's transformers path truncates queries and documents alike at 8192 -- so
  query_max_tokens is not declared and both shapes draw on max_tokens. The engine image's transformers
  pin at the tag is >=5.10.4, <5.18.0 (requirements/common.txt); the tokenizer files are pinned by
  revision and the stage-1 zero-tolerance token-id check on the GPU host is the designed catch for
  library drift. No media processor settings (mm_processor_kwargs) apply: the model is text-only (input: [text], no
  processor files in the repo). Reference environment: requirements-reference.txt (torch,
  transformers; render mode needs only huggingface_hub -- see reference.py).
