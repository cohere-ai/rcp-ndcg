notes: >-
  Template: template.jinja is the family's one template file, byte-identical across
  qwen3-reranker-0.6b/4b/8b: the stock vLLM example template
  (examples/pooling/score/template/qwen3_reranker.jinja) with the paper's default instruction
  baked in (instruction: none; a request instruction is not read) and one trailing newline added:
  transformers' apply_chat_template compiles with keep_trailing_newline=False and strips ONE
  trailing newline from the template file, so the stock file (which ends with the think-close
  marker and two newlines) renders a prompt one token short of the paper reference at the scored
  position (single vs double newline token; measured on all probe pairs by the research lane).
  The query and document read the engine's chat variables with a fallback: the engine's
  safe_apply_chat_template passes [{role: query}, {role: document}] messages, while the harness's
  stage-1 check passes query/document variables; the recipe tests render both branches against
  the paper prompt. The template file MUST ship with the engine: served without --chat-template,
  vLLM only logs a warning (io_processor.py:431-447 at the v0.31.0 tag) and then concatenates query
  and documents with no frame at all (:677-678). R10: stage 1's template_render_check proves the declared
  shapes render to the file's render; the wave's T0 smoke must assert the engine loaded it (a
  /tokenize probe of one rendered prompt must carry the frame). Budget: max_tokens 8192 is the
  paper's MAX_SEQ_LENGTH, counted as the engine sees the whole prompt (frame + query + document);
  query_max_tokens 4096 is the client-side share (the paper's MAX_QUERY_LENGTH). Settle rule,
  read from the merged rerank client (rcp-ndcg/src/rcp_ndcg/inference/clients/rerank.py and the
  query_max_tokens docstring in rcp-ndcg/src/rcp_ndcg/inference/config.py): the pair fit binds on overflow
  (an under-budget pair is sent uncut), and the rerank client settles the shared query once per
  call - it ships at its declared query_max_tokens whenever the query exceeds it. Over-share
  queries are therefore declared divergence rows: the served span is cut at the 4096-token share
  while the reference (the paper's QwenOGRerank) keeps the whole query inside its pair cut. The
  pairs files of the waves must keep queries well within the share (the paper's datasets do) and
  drop any row stage 1 goes red on; an over-share query in an UNDER-budget pair is an under-cap
  row and gates red by design. Over-cap policy (one, family wide): for pairs whose query is within
  the 4096-token share and whose pair exceeds the 8192-token budget, the reference truncates the
  pair string longest_first at 8144 tokens (the prefix and the 9-token assistant suffix reserved
  and re-attached - no anchor is ever dropped) and NEVER copies the client's cut, so
  reference.known_deviations declares over_cap_cut_differs: the harness reports over-cap rows in
  a non-gating table and gates under-cap rows exactly. The two cuts keep the same content tokens
  whenever the query is within the share (the client cuts the document span at assembled-render
  token boundaries where the reference cuts the pair string at pair-token boundaries, usually the
  same word boundary - measured byte-identical on every probe row of the research lane and the
  sweep's 13-row adversarial battery (english, CJK, emoji, punctuation, NFD text; queries up to
  4090 tokens)); when a cut boundary lands a token apart (e.g. a multi-byte decomposition at the
  boundary) or the query is over its share, the two keep different content tokens - over-cap rows
  then land in the non-gating table, never silently fail a gate (research risk R4 resolved);
  anchors survive both paths. The render comparison is character-exact on raw input text (the
  kept text is cut at raw character offsets, never a decode(encode()) round trip: this
  checkpoint's normalizer maps non-NFC text to NFC, keeping the token ids equal but not the
  characters). The instruction is
  fixed: the client's instruction mode is `none` (the paper's served path passed the bare query
  and the class's default instruction), the default instruction is hardcoded in the frame and
  equals the model card's config_sentence_transformers.json prompt; instruction-bearing dataset
  rows would silently keep the default (research risk R6 - the paper configs set none). Serving
  pins the score head's activation both sides (pooler_config use_activation: true beside
  client.use_activation: true; the one family rule - the classify pooler's default for a 1-label
  head is sigmoid, so an unpinned server flip would change the score scale for every client) and
  uses no plugin. min_version declares the verified image (v0.31.0); the feature floor is 0.30.1:
  the is_original_qwen3_reranker conversion overrides first shipped in v0.30.1rc0 (measured by
  git log -S in the r-qwen3-rer lane).