# Recipe: Qwen/Qwen3-Reranker-8B served with stock vLLM, paper-exact.
#
# The served prompt is the model card's chat frame (the paper reference's prefix + pair + suffix,
# 39 + pair + 9 tokens); the client-side cut reserves every fixed token and cuts the content spans
# only. The reference is the paper's QwenOGRerank (experiments/paper/rerankers/reference/qwen3.py):
# it never copies the client's cut, and over-cap pairs are declared over_cap_cut_differs.
id: qwen3-reranker-8b
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
model: Qwen/Qwen3-Reranker-8B
revision: "77d193c791ed757ca307ee72715aa132723da912"
role: rerank
input: [text]
scoring: pointwise
licence: apache-2.0
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  min_version: "0.31.0"
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides:
    architectures: [Qwen3ForSequenceClassification]
    classifier_from_token: ["no", "yes"]
    is_original_qwen3_reranker: true
  chat_template: template.jinja
  # The score head's activation pinned server-side and on the wire (one family rule): the classify
  # pooler's default for a 1-label head is sigmoid (vllm/model_executor/layers/pooler/activations.py:139-140
  # at the v0.31.0 tag), and pooler_config is the engine-side default every /rerank request merges with
  # (vllm/pooling_params.py:111-125); the pin covers any client that does not send the field.
  # client.use_activation below sends the same value on the wire.
  pooler_config: {use_activation: true}
  trust_remote_code: false
  max_model_len: 10000        # the family's serving value (the 0.6B/4B cards' vLLM example); >= the 8192 budget
  dtype: bfloat16
  plugin: null
  io_processor_plugin: null
  mm_processor_kwargs: {}
  limit_mm_per_prompt: null
  extra_args: []
client:
#   recipe: "vLLM v0.31.0 pooling runner; Qwen3ForCausalLM converted to Qwen3ForSequenceClassification in-engine (hf_overrides: classifier_from_token [no, yes], is_original_qwen3_reranker); the paper chat template (template.jinja); sigmoid-activated 1-label score head; client-side pair cut at 8192 tokens"
  api: rerank
  tokenizer: "Qwen/Qwen3-Reranker-8B@77d193c791ed757ca307ee72715aa132723da912"
  max_tokens: 8192
  query_max_tokens: 4096
  template:
    pair:
      - {fixed: "{special:im_start}system\nJudge whether the Document meets the requirements based on the Query and the Instruct provided. Note that the answer can only be \"yes\" or \"no\".{special:im_end}\n{special:im_start}user\n<Instruct>: Given a web search query, retrieve relevant passages that answer the query\n<Query>: "}
      - {content: query}
      - {fixed: "\n<Document>: "}
      - {content: document}
      - {fixed: "{special:im_end}\n{special:im_start}assistant\n{special:<think>}\n\n{special:</think>}\n\n"}
    anchor: last
    add_special_tokens: true
  instruction: none
  use_activation: true
  on_overflow: cut
  empty_doc: send
  empty_query: send             # the paper's QwenOGRerank.predict formats any query, the empty one included
                               # (reference/qwen3.py:128); one rule with the zerank family (the product's
                               # post-refusal default is `refuse`)
  request_shape: text
  listwise: false
reference:
  kind: transformers
  score_scale: probability
  entry: reference.py
  # One over-cap policy family-wide: the reference keeps every anchor and cuts over-cap content the
  # paper's way (the pair string right-cut longest_first at 8144 tokens), never copying the client's
  # cut -- so the harness reports over-cap rows non-gating and gates under-cap rows exactly.
  known_deviations: [over_cap_cut_differs]
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/Qwen/Qwen3-Reranker-8B (revision 77d193c791ed757ca307ee72715aa132723da912): README.md, config.json, config_sentence_transformers.json, 1_LogitScore/config.json, chat_template.jinja"
  - "https://huggingface.co/Qwen/Qwen3-Reranker-8B/commit/77d193c791ed757ca307ee72715aa132723da912 (the pinned revision, re-checked against the Hub API)"
  - "vLLM checkout d0d6e5f3a (the .refs/vllm pin of the working copy; image vllm/vllm-openai:v0.31.0): examples/pooling/score/qwen3_reranker_online.py:25 (the serve flags this recipe renders), examples/pooling/score/template/qwen3_reranker.jinja (the stock template; template.jinja here is that file with the instruction baked and one trailing newline added)"
  - "vLLM checkout d0d6e5f3a: vllm/model_executor/models/adapters.py:566-571 (the yes-no score head, float32 weight difference, sigmoid == softmax([no, yes])[yes]); vllm/model_executor/models/config.py:783-801 (is_original_qwen3_reranker); vllm/entrypoints/pooling/scoring/io_processor.py:460-469 (the startup warning when the chat template is missing), io_processor.py:706-736 (the /rerank route applies the chat template to query and document role messages); tests/models/language/pooling_mteb_test/test_qwen3_reranker.py"
  - "experiments/paper/rerankers/reference/qwen3.py (the paper-exact in-process reference, QwenOGRerank) and experiments/paper/rerankers/reference/requirements.txt (its pinned environment)"
  - "experiments/paper/rerankers/qwen3_reranker_8b.yaml at HEAD (the served-path config: max_tokens 8192, query_max_tokens 4096, instruction none); the paper's batch_size 4 is the pre-unified-inference config (git show 28dc100^:experiments/paper/rerankers/qwen3_reranker_8b.yaml)"
  - "pre-unified-inference tree (git show 28dc100^): rcp-ndcg/src/rcp_ndcg/retrieval/cross_encoder.py:42,46 (MAX_SEQ_LENGTH 8192, MAX_QUERY_LENGTH 4096; the latter applied only to the served path's request fields, never to QwenOGRerank) and rcp-ndcg/src/rcp_ndcg/retrieval/external_rerankers.py (QwenOGRerank's former in-process home); both files are gone at the unified-inference merge"
  - "rcp-ndcg/src/rcp_ndcg/data/preprocess.py (fit: the client-side cut that reserves every fixed template token, cuts content spans only, and re-attaches the frame) and rcp-ndcg/src/rcp_ndcg/data/templates.py (TemplateSpec)"
  - "https://huggingface.co/Qwen/Qwen3-Reranker-0.6B/discussions/3 (the sequence-classification conversion vLLM's hf_overrides applies here)"
  - "vLLM at the v0.31.0 tag (the image's source): vllm/config/model.py:2279 (the ForSequenceClassification suffix -> runner pooling, convert classify); vllm/model_executor/models/registry.py:1287-1310 (_normalize_arch) and vllm/model_executor/model_loader/utils.py:278-280 (as_seq_cls_model over Qwen3ForCausalLM); vllm/model_executor/models/config.py:793-812,1057 (is_original_qwen3_reranker -> method from_2_way_softmax); vllm/model_executor/models/adapters.py:416-441 (num_labels 1) and :516-583 (score weight = lm_head[yes] - lm_head[no] in float32; this checkpoint's lm_head is untied, tie_word_embeddings false); vllm/model_executor/layers/pooler/activations.py:139-140 (1 label -> sigmoid); vllm/pooling_params.py:111-125,195-197 (pooler_config defaults merge, classify use_activation default true); vllm/entrypoints/pooling/scoring/io_processor.py:431-447 (the missing-template warning), :677-705 (the --chat-template is applied to the query/document messages; without one, plain concatenation); vllm/entrypoints/pooling/scoring/protocol.py:38-66 (a request instruction routes into chat_template_kwargs; this template reads none) and :69-74 (add_special_tokens=True)"

notes: >-
  The template file must reach the engine: vllm serve --chat-template (R10). Without it vLLM only
  warns at startup (the warning is specific to is_original_qwen3_reranker, io_processor.py:431-447 at
  the v0.31.0 tag) and concatenates query and document with no frame (:677-678), so no anchor survives.
  The harness T0 check fails, not warns, when the engine did not load it.

  template.jinja: the family's one template file, byte-identical across qwen3-reranker-0.6b/4b/8b - the
  stock vLLM example template with the paper's default instruction baked in (the recipe declares
  instruction: none; the paper's runs never vary it, and a request instruction is not read) and one
  trailing newline added. The extra newline is measured, not cosmetic: jinja2 environments strip a
  template file's final newline (keep_trailing_newline=False, the engine's own render settings), so the
  stock file renders the assistant suffix one newline short and the scored position lands on the wrong
  token (the research instrument measured last-token 'Ċ' vs 'ĊĊ' on every probe pair). The query and
  document read the engine's chat variables with a fallback: the /rerank route applies the template to
  [{role: query}, {role: document}] messages (io_processor.py:693-703), while stage 1's template check
  renders query/document directly; the recipe tests render both branches and stage 1's
  template_render_check proves the declared shape byte-equals the file.

  Budget: max_tokens 8192 is the paper's MAX_SEQ_LENGTH, counted as the engine sees the whole prompt
  (frame + query + document); the frame's fixed overhead is 73 tokens (39-token prefix, 9-token suffix,
  25 for the instruction and the query/document labels). query_max_tokens 4096 is the paper's
  MAX_QUERY_LENGTH, which the paper applied only on its served path; its in-process QwenOGRerank caps no
  query. Settle rule, read from the merged rerank client (rcp-ndcg/src/rcp_ndcg/inference/clients/rerank.py and
  the query_max_tokens docstring in rcp-ndcg/src/rcp_ndcg/inference/config.py): the pair fit binds on overflow
  (an under-budget pair is sent uncut), and the rerank client settles the shared query once per call -
  it ships at its declared query_max_tokens whenever the query exceeds it. Over-share queries are
  therefore declared divergence rows: the served span is cut at the share while the reference keeps the
  whole query inside its pair cut; an over-share query in an UNDER-budget pair is an under-cap row and
  gates red by design, so the pairs files of the waves keep queries well within the share (the paper's
  datasets do) and drop any row stage 1 goes red on.

  Over-cap policy (one, family wide): the reference truncates the pair string longest_first at 8144
  tokens (the paper's _process_inputs: on a single sequence a right cut, the document first, then the
  query tail), re-attaches the 39-token prefix and the 9-token assistant suffix - no anchor is ever
  dropped - and NEVER copies the client's cut, so reference.known_deviations declares
  over_cap_cut_differs: the harness reports over-cap rows in a non-gating table and gates under-cap rows
  exactly. For over-cap pairs whose query is within the share the two cuts usually keep the same content
  tokens (the sweep's adversarial battery measured them byte-identical for queries up to 4090 tokens);
  where a cut boundary lands a token apart or the query is over its share they differ, and the row is
  reported, never silently gated. The render comparison is character-exact on raw input text: the
  reference locates its cut at raw character offsets, never a decode(encode()) round trip (this
  checkpoint's normalizer maps non-NFC text to NFC, keeping the ids equal but not the characters).

  Scores: the client declares use_activation: true and serve.pooler_config pins the same value - the
  converted 1-label head scores sigmoid(x.(W_yes-W_no)) (adapters.py:569-571 at the tag, float32), which equals the
  reference's softmax([no, yes])[yes]; both sides are probability-scale. dtype bfloat16 (the paper
  pipeline's DTYPE); the reference batches at 4 (the paper's 8B config) with the OOM-halving backoff the
  paper code carries.

  Engine: the image is the unmodified vllm/vllm-openai:v0.31.0 (min_version declares the verified image;
  the feature floor is 0.30.1, where the conversion overrides first shipped in v0.30.1rc0); no plugin, no
  custom image, no extra environment. The GPU wave must check: T0 that the engine loaded template.jinja
  (fails, not warns), and the R29 /tokenize equality of fit's renders per shape with
  add_special_tokens: true (the Qwen tokenizer's post-processor adds no tokens, so both flags encode alike -
  the declared flag is the route's default behaviour). Reference environment: requirements-reference.txt
  beside reference.py (the paper reference's pins).
