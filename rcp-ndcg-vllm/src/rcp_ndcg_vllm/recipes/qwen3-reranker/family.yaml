    notes: >-
      The one measured fix the recipe carries is the trailing newline in template.jinja (the stock vLLM example file renders one newline short of the paper prompt: the renderer strips the file's final newline, and the paper's suffix ends with a double newline, token 271 of this tokenizer). template.jinja is the family's one template file, byte-identical across qwen3-reranker-0.6b/4b/8b (the paper's default instruction baked in; a request instruction is not read); the recipe tests render both its branches (the engine's query/document messages, stage 1's variables). The declared client.template and the served file render to the same token ids, which stage 1 proves; the GPU wave re-proves it against the engine (/tokenize, R29) and must confirm the loaded template in the serve log. Budgets: max_tokens 8192 = MAX_SEQ_LENGTH; the frame (prefix 39 + instruction frame + suffix 9 tokens, 73 total with the default instruction) is reserved and only the query/document spans are cut. Settle rule, read from the merged rerank client (rcp-ndcg/src/rcp_ndcg/inference/clients/rerank.py and the query_max_tokens docstring in rcp-ndcg/src/rcp_ndcg/inference/config.py): the pair fit binds on overflow (an under-budget pair is sent uncut), and the rerank client settles the shared query once per call - it ships at its declared query_max_tokens (4096 = MAX_QUERY_LENGTH) whenever the query exceeds it. Over-share queries are therefore declared divergence rows: the served span is cut at the share while the reference (the paper's QwenOGRerank) keeps the whole query inside its pair cut, and an over-share query in an UNDER-budget pair is an under-cap row that gates red by design; the pairs files of the waves must keep queries well within the share (the paper's datasets do) and drop any row stage 1 goes red on. The paper-era served path instead sent max_tokens_per_query=4096 and truncate_prompt_tokens=8192 as request fields and let the engine right-cut the RENDERED prompt, dropping the assistant suffix on over-cap pairs (measured: 2882 tokens cut on an 11026-token probe, last token mid-document); this recipe does the cutting on the client, where the anchors are reserved, and never engine-truncates. Over-cap policy (one, family wide): the reference truncates the pair string longest_first at 8144 tokens at raw character offsets (never a decode(encode()) round trip: the checkpoint's normalizer maps non-NFC text to NFC, keeping the ids equal but not the characters), re-attaches both anchors and NEVER copies the client's cut, so reference.known_deviations declares over_cap_cut_differs: the harness reports over-cap pairs in a non-gating table and gates under-cap rows exactly. For pairs whose query is within the share the two cuts keep the same content tokens (measured byte-identical on the research lane's probes and the sweep's 13-row adversarial battery: english, CJK, emoji, punctuation, NFD text; queries up to 4090 tokens); when a cut boundary lands a token apart or the query is over its share, the two keep different content tokens and the row is reported, never silently gated (research risk R4); anchors survive both paths. Risks the GPU wave must check (the research report's risk list): R5 (a >4096-token query is settled at its share on the served path while the reference keeps it whole -- declared divergence rows, see the settle rule above), R6 (instruction-bearing dataset rows are dropped by declaration, instruction: none - a run with instructions is a new judgement family and needs its own recipe), and REVIEW-LOG R10 (the engine must load template.jinja: the serve log must show it and /tokenize of a rendered prompt must end with the suffix ids 151645,198,151644,77091,198,151667,271,151668,271), and the score head (probability scale: use_activation true both sides + serve.pooler_config use_activation true; the reference's softmax([no, yes])[yes] with no/yes ids 2152/9693). Reference environment: requirements-reference.txt beside reference.py (the paper pins of experiments/paper/rerankers/reference/requirements.txt: torch 2.9.1, transformers 4.57.6, accelerate, flash-attn 2.8.3), the family's one convention.
