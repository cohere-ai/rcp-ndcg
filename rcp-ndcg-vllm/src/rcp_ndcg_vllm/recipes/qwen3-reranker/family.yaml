# The Qwen3-Reranker family (decision 34): one serving contract, three sizes, every size its own
# tested recipe id. The shared blocks below are the sizes' common contract, read off the three
# standalone recipes this family replaces: they resolved byte-identically apart from id, model,
# revision and the derived tokenizer, so the variants table carries only the per-size facts (id,
# model, revision, notes, sources).
#
# Paper reference: experiments/paper/rerankers/reference/qwen3.py (QwenOGRerank, moved unchanged
# from the former rcp-ndcg/src/rcp_ndcg/retrieval/external_rerankers.py of the pre-unified-inference tree
# when the package stopped carrying in-process models; it lands at HEAD with the
# unified-inference merge) with the paper configs experiments/paper/rerankers/qwen3_reranker_{0_6b,4b,8b}.yaml
# (batch_size 16/8/4) and the paper budgets MAX_SEQ_LENGTH = 8192 (the pair budget) and
# MAX_QUERY_LENGTH = 4096 (the pre-unified-inference retrieval/cross_encoder.py constants).
# The served prompt is the model card's chat frame; the research lane (r-qwen3-rer) measured every
# claim below on the tokenizer files alone.
id: qwen3-reranker
schema_version: "1"   # the family/recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: rerank
input: [text]
scoring: pointwise
licence: apache-2.0
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  # min_version is the engine image actually verified (the notes name the feature floor: the
  # conversion overrides first shipped in 0.30.1rc0, measured by git log -S in the r-qwen3-rer lane).
  min_version: "0.31.0"
resources: {gpus: 1}
serve:
  runner: pooling
  convert: null
  hf_overrides:
    architectures: [Qwen3ForSequenceClassification]
    # Quoted: YAML would read both as booleans (the two label tokens of the 2-way softmax head).
    classifier_from_token: ["no", "yes"]
    is_original_qwen3_reranker: true
  chat_template: template.jinja
  # The score head's activation pinned server-side and on the wire (one family rule): the
  # classify pooler's default for a 1-label head is sigmoid (vllm/model_executor/layers/pooler/
  # activations.py at the v0.31.0 tag), and pooler_config is the engine-side default every
  # /rerank request merges with (vllm/pooling_params.py); the pin covers any client that does
  # not send the field. client.use_activation below sends the same value on the wire.
  pooler_config: {use_activation: true}
  trust_remote_code: false
  # The model card's own serving value; must stay >= client.max_tokens (8192).
  max_model_len: 10000
  dtype: bfloat16
  plugin: null
  extra_args: []
client:
#   recipe: "vLLM v0.31.0 pooling runner; Qwen3ForCausalLM converted to Qwen3ForSequenceClassification in-engine (hf_overrides: classifier_from_token [no, yes], is_original_qwen3_reranker); the paper chat template (template.jinja); sigmoid-activated 1-label score head; client-side pair cut at 8192 tokens"
  api: rerank
  max_tokens: 8192
  query_max_tokens: 4096
  template:
    pair:
      # The fixed frame: system turn, judge sentence, user turn, the instruction (fixed: the
      # client's instruction mode is `none`, the template default is the paper default) and the
      # query lead. Specials by name, resolved from the recipe tokenizer at render time.
      - fixed: "{special:im_start}system\nJudge whether the Document meets the requirements based on the Query and the Instruct provided. Note that the answer can only be \"yes\" or \"no\".{special:im_end}\n{special:im_start}user\n<Instruct>: Given a web search query, retrieve relevant passages that answer the query\n<Query>: "
      - {content: query}
      - fixed: "\n<Document>: "
      - {content: document}
      # The anchor tail: the assistant turn and the empty think block the paper prompt ends with.
      - fixed: "{special:im_end}\n{special:im_start}assistant\n{special:<think>}\n\n{special:</think>}\n\n"
    anchor: last
    add_special_tokens: true
  instruction: none
  use_activation: true
  on_overflow: cut
  empty_doc: send
  empty_query: send             # the paper's QwenOGRerank.predict formats any query, the empty one included
                               # (reference/qwen3.py:128); one rule with the zerank family (the product's
                               # post-refusal default is `refuse`)
reference:
  kind: transformers
  score_scale: probability
  entry: reference.py
  # One over-cap policy family-wide (the sweep's one family decision): the reference keeps every
  # anchor and cuts over-cap content the paper's way (the joint longest_first pair cut), never
  # copying the client's cut -- so the harness reports over-cap rows non-gating and gates
  # under-cap rows exactly. anchor_drop_over_cap is wrong here: no anchor is ever dropped
  # (prefix and suffix reserved and re-attached).
  known_deviations: [over_cap_cut_differs]
gates: {}
status: {state: unverified, image: null, date: null, report: null}

variants:
