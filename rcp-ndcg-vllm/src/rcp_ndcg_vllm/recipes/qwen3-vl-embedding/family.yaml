      (config.json:architectures), model_type qwen3_vl; text_config.hidden_size 4096, 36 layers,
      32 attention heads, 8 KV heads, head_dim 128, intermediate_size 12288, max_position_embeddings
      262144, tie_word_embeddings false (config.json:tie_word_embeddings); vision_config.depth 27,
      hidden_size 1152, deepstack_visual_indexes [8, 16, 24], out_hidden_size 4096
      (config.json:vision_config). Width: the served vector is 4096-d
      (1_Pooling/config.json:embedding_dimension); the card's Model Overview table says 4096 with an
      MRL range of 64..4096 (README.md), declared here as mrl_kind: truncation (the family's shared
      kind) with this size's mrl_range [64, 4096], mirrored in serve.hf_overrides.is_matryoshka.
      Weights: bfloat16 (config.json:dtype), 16,289,587,680 B =
      15.17 GiB in 4 shards (model.safetensors.index.json:metadata.total_size); KV at the family's
      8192-token serve.max_model_len is 2 x 36 layers x 8 KV heads x 128 head_dim x 2 B/token x 8192
      = 1.21 GB = 1.1 GiB, so bf16 weights + KV fit one 80 GB-class GPU (resources.gpus 1, the family's). One
      forward of 8192 tokens stays inside the 32-bit envelope: attention q 32 x 128 x 8192 x 2 B =
