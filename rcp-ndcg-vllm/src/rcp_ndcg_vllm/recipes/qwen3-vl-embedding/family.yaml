# Recipe: Qwen/Qwen3-VL-Embedding-2B served with stock vLLM (vllm/vllm-openai:v0.31.0).
# The pixel pin rides ONE shape across the media recipes -- nested images_kwargs, decided from the
# v0.31.0 tag source (cited in sources) -- and the video sampling is one declared rule on every side.
id: qwen3-vl-embedding
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: embed
input: [text, image, video]     # the model's capability (card); text, images and video ride the messages route -- see notes, "Media"
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0"}   # min_version = the image actually verified (the family convention)
resources: {gpus: 1}            # 2B bf16 (~4.0 GiB weights) fits one GPU; the card states no multi-GPU requirement
serve:
  runner: pooling
  convert: embed                # a generative VLM as an embedder; auto would resolve to embed, explicit silences the log (v0.31.0 config/model.py:113)
  hf_overrides: {is_matryoshka: true}  # the card's Matryoshka range 64..2048 is a per-request /v1/embeddings capability (dimensions, cut before L2 at seqwise/heads.py:85-105); the checkpoint declares no is_matryoshka, so the gate is declared here with no set (the card's prose gives a range, and the client's mrl_range carries the floor the engine does not check)
  chat_template: null           # no template file: the messages route renders the checkpoint's own chat_template.jinja at the pinned revision, which frames the content exactly as the declared template (the harness's template check reads that file; see notes, "Frame")
  pooler_config: {seq_pooling_type: LAST}   # the default seq pooler, pinned explicitly; the head is the default PoolerNormalize (L2, v0.31.0 seqwise/poolers.py:97-110)
  trust_remote_code: false      # no auto_map in config.json; the native class needs none (the card's script passes true, inert there too)
  max_model_len: 8192           # == the reference's MAX_LENGTH; an over-length prompt is an HTTP 400, never a silent engine cut
  dtype: bfloat16               # the checkpoint's dtype
  plugin: null                  # no out-of-tree model class: stock vLLM serves it
  mm_processor_kwargs: {"images_kwargs": {"min_pixels": 4096, "max_pixels": 1843200}, "videos_kwargs": {"min_pixels": 4096, "max_pixels": 7864320}}   # the pixel pin, the ONE shape (nested images_kwargs): the card script's MIN/MAX_PIXELS (4*32^2 / 1800*32^2) and the card's per-clip video total_pixels 7864320 (the HF Qwen3VL video processor's max_pixels is the whole clip's budget, video_processing_qwen3_vl.py at transformers 5.17:360-381). At the tag the nested dict reaches the HF processor's images_kwargs/videos_kwargs and the vLLM-side token budget alike, while flat keys also re-size every VIDEO clip (qwen3_vl.py:1371-1382) -- see sources. Load-bearing: at the checkpoint default max_pixels=1310720 a 1700x2200 page renders 1240 image tokens vs the reference's 1776 (measured on the checkpoint's own processor)
  limit_mm_per_prompt: {"image": 1, "video": 1}   # one media item per request (the client's max_images/max_videos carry the same numbers): never the engine's multi-item hoist
  extra_args:                  # the ONE video policy's engine half: a container is sampled at the engine's own rate
    - "--media-io-kwargs"
    - '{"video": {"fps": 2}}'      # v0.31.0 multimodal/video.py:360-400: the Qwen3-VL backend samples int(total/original_fps * fps) frames (its 30 fps ceiling, 4..768 bounds) and IGNORES num_frames, so the pin is the rate (fps 2: the checkpoint video processor's own fps, video_preprocessor_config.json)
client:
#   recipe: "vLLM 0.31.0 pooling runner (--convert embed), seq_pooling_type LAST with the default PoolerNormalize head; no served chat template (the checkpoint's own frames the messages route); media: nested images_kwargs min_pixels=4096 max_pixels=1843200 (serve.mm_processor_kwargs, the one pixel-pin shape), one media item per request (serve.limit_mm_per_prompt image=1 video=1 = client.max_images/max_videos 1/1), video_policy fps 2 as video_url with --media-io-kwargs video fps 2 pinned (engine_video_pinning; the Qwen3-VL backend's fps rule, which ignores num_frames); request_shape messages with add_generation_prompt and add_special_tokens true: the checkpoint's chat template frames each item once and the engine's post-processor appends the end anchor; image_processor qwen3_vl under the pinned budget (engine_pixel_pinning)"
  api: openai_embeddings
  request_shape: messages       # the chat-style /v1/embeddings input: each item one conversation carrying its content (the cut text, its image or video parts), framed once by the engine's chat template -- the only route that carries media (notes, "Media")
  add_generation_prompt: true   # the declared frame ends with the assistant header, which the checkpoint's template renders only under add_generation_prompt; vLLM v0.31.0's chat routes default it to false (vllm/entrypoints/pooling/base/protocol.py:230-237), so the flag is sent
  max_tokens: 8192              # the declared budget: the frame's fixed tokens (including the instruction and the post-processor anchor) are reserved, only the content span is cut (on_overflow: cut). No query_max_tokens: the card caps the WHOLE prompt (MAX_LENGTH 8192), queries and documents alike
  image_processor: qwen3_vl     # the checkpoint's Qwen3VLProcessor family (patch 16 x merge 2 = 32 px per token edge): the client resizes and counts every image as the engine's processor does
  image_policy: {min_px: 4096, max_px: 1843200, engine_pixel_pinning: true}   # the pixel pin's client half: the same numbers as serve.mm_processor_kwargs; engine_pixel_pinning declares the engine pinned to them, which admits the card's 4096 px floor below the family's stock 65536 (notes, "Media")
  max_images: 1                 # the same number as serve.limit_mm_per_prompt: one media item per request
  max_videos: 1                 # ditto (the media capacity on both sides)
  video_policy: {fps: 2, wire: video_url, engine_video_pinning: true, engine_video_min_pixels: 4096, engine_video_max_pixels: 7864320}   # THE video sampling policy, one rule on every side: the container sent as video_url and the engine pinned to its own fps rule at the checkpoint video processor's rate (fps 2) by serve.extra_args --media-io-kwargs (engine_video_pinning); the client counts int(total_frames / original_fps * fps) clamped to the backend's 4..768 bounds (qwen3_vl_video_frame_indices) and the clip's tokens under the pinned total_pixels 7864320 (the card's own number, matching serve.mm_processor_kwargs.videos_kwargs). A pinned num_frames would be inert on this backend: it samples by fps and ignores num_frames
  template:
    query:
      - {fixed: "{special:im_start}system\nRepresent the user's input."}   # the card frames a query exactly like a document: its default instruction (format_model_input; config_sentence_transformers.json prompts.default) -- every usage example on the card encodes queries with it. The instruction closes its own segment, so it is a whole delimited unit of the query frame (the case loader's rule)
      - {fixed: "{special:im_end}\n{special:im_start}user\n"}
      - {content: query}
      - {fixed: "{special:im_end}\n{special:im_start}assistant\n"}
    document:
      - {fixed: "{special:im_start}system\nRepresent the user's input."}   # the same default instruction, part of the fixed frame (split as the query's)
      - {fixed: "{special:im_end}\n{special:im_start}user\n"}
      - {content: document}
      - {fixed: "{special:im_end}\n{special:im_start}assistant\n"}   # the trailing fixed segment + the post-processor's endoftext are the anchor the model pools from
    anchor: last
    add_special_tokens: true    # sent with every messages request (the chat route's own default is false, v0.31.0 base/protocol.py ChatRequestOptionsMixin): the tokenizer's post-processor appends endoftext (id 151643, tokenizer.json TemplateProcessing) after the chat render -- the pooled last token
  on_overflow: cut
  empty_doc: send_text
  instruction: none             # the card's own instruction is baked into the fixed frame; a dataset task
                                # instruction is refused, never silently folded
  empty_doc_text: "NULL"        # the card's empty-input rule: format_model_input renders the text "NULL" when text, image and video are all empty
  normalize: true               # the server L2-normalises (PoolerNormalize); the client normalising again is harmless
  # The card's MRL declaration (owner decision 39): "supports user-defined output dimensions ranging
  # from 64 to 2048" (README.md:44; the table's MRL Support: Yes). Truncation kind, a prose range --
  # the card gives no discrete table -- so a run selects any k in [64, 2048] and the client enforces
  # the floor the engine does not (its gate accepts 1..width). The recipe ships the full width.
  mrl_kind: truncation
reference:
  kind: transformers            # the model card's scripts/qwen3_vl_embedding.py (Qwen3VLEmbedder, transformers), vendored verbatim beside reference.py
  score_scale: cosine
  entry: reference.py
  # The CPU reference materially moves the gate (GPU-E1: 0.99897 on CPU vs 0.99906 on GPU at the 2b
  # against the 0.999 vector bound), so the wave must run the reference on a GPU of its own; E2
  # confirms per size.
  device: cuda
  known_deviations: [anchor_drop_over_cap]   # the card's processor truncation (truncation=True at MAX_LENGTH=8192) right-cuts the rendered prompt: the frame's tail (im_end, the assistant header) is cut and only the post-processor's endoftext is re-appended. reference.py renders exactly that cut; the client keeps the whole frame. Which over-cap rows the harness reports rather than gates today: see notes, "Budgets"
gates: {}
status: {state: unverified, image: null, date: null, report: null}
sources:
  - "https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B (card README, revision 9f2f7e710d6d81056aa5c0a4f04764fec6bb7bda: lines 105-151 the sentence-transformers usage -- queries and documents alike under the default 'Represent the user's input.' system prompt; lines 155-205 the transformers usage, queries without an instruction)"
  - "https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B (card README: the model table's 'MRL Support: Yes' and the details bullet 'Embedding Dimension: Up to 2048, supports user-defined output dimensions ranging from 64 to 2048', the range the client's mrl_range declares)"
  - "https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B/raw/9f2f7e710d6d81056aa5c0a4f04764fec6bb7bda/config.json (architectures, no auto_map)"
  - "https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B/raw/9f2f7e710d6d81056aa5c0a4f04764fec6bb7bda/chat_template.jinja (SHA-256 a47e6afb389f86f45be7810f17d2686fd42b2bec7ba6e6958abf85845af258c5: the frame both declared shapes reproduce, pinned by the recipe's test)"
  - "https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B/raw/9f2f7e710d6d81056aa5c0a4f04764fec6bb7bda/scripts/qwen3_vl_embedding.py (the reference path; MAX_LENGTH 8192, MIN/MAX_PIXELS 4096/1843200; FPS 1, MAX_FRAMES 64, total_pixels 7864320 -- the card's own video numbers; _preprocess_inputs calls the processor with truncation=True at max_length)"
  - "https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B/raw/9f2f7e710d6d81056aa5c0a4f04764fec6bb7bda/tokenizer.json (post_processor TemplateProcessing: every single sequence ends with <|endoftext|> 151643)"
