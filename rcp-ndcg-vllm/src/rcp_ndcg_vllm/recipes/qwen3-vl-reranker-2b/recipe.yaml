  - "the pixel-pin shape (the full chain is cited once, in qwen3-vl-embedding-2b's sources): vllm v0.31.0
     vllm/multimodal/processing/context.py:44-84 (the image-only overlay of a nested images_kwargs
     dict), :293-331 (no overlay at processor construction and HF __call__: the nested dict reaches
     the HF processor); vllm/model_executor/models/qwen3_vl.py:939-985 (the vLLM-side image token
     budget reads through the overlay) and :1371-1382 (flat min_pixels/max_pixels re-size every
