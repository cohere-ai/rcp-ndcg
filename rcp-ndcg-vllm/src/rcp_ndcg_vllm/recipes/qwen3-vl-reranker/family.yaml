    notes: >-
      Per-size facts, read at the pinned revision. Architecture: Qwen3VLForConditionalGeneration
      (config.json:architectures); text_config.hidden_size 4096, 36 layers, 32 attention heads,
      8 KV heads, head_dim 128, intermediate_size 12288, max_position_embeddings 262144,
      tie_word_embeddings false (config.json:tie_word_embeddings); vision_config.depth 27, hidden_size 1152,
      deepstack_visual_indexes [8, 16, 24] (config.json:vision_config). Context: the card's Model
      Overview table says 32K and the family's serve.max_model_len 32768 is that number (the
      checkpoint's config allows 262144); no served request reaches the cap (client.max_tokens 8192).
      Weights: bfloat16 at the top level (config.json:dtype; text_config and vision_config declare
      float32, exactly as the 2b row's do -- the card script's from_pretrained resolves the top-level
      dtype), 17,534,247,392 B = 16.33 GiB in 4 shards (model.safetensors.index.json:metadata.total_size);
      embeddings untied (config.json:tie_word_embeddings false), so the score head is built from
      lm_head's own yes/no rows; KV at 32768 tokens is 2 x 36 layers x 8 KV heads x 128 head_dim x
      2 B/token x 32768 = 4.83 GB = 4.5 GiB, so bf16 weights + KV fit one 80 GB-class GPU (resources.gpus 1,
      the family's). One forward of 32768 tokens stays inside the 32-bit envelope: attention q
      32 x 128 x 32768 x 2 B = 2.7e8 B, MLP activations 12288 x 32768 = 4.0e8 elements; the served
      budget (8192) is below max_model_len, so a full-budget request is not the chunked
      full-context case. Score head: the same yes/no construction as the 2b row
      (1_LogitScore/config.json:true_token_id 9693, :false_token_id 2152, JSON-equal); modules.json
      names its module directory 1_CausalScoreHead where the 2b names 1_LogitScore -- both entries
      declare the same sentence_transformers.cross_encoder.modules.logit_score.LogitScore class,
      and the file the reference cross-checks (1_LogitScore/config.json) is present with the same
      ids, so the served score is sigmoid((W_yes - W_no) . h_last) as the family declares.
      Family membership, every file byte- or JSON-identical to the 2b row at its own pinned
      revision: tokenizer.json (sha256 aeb13307...), chat_template.jinja (sha256 3636d0f0...),
      additional_chat_templates/reranker.jinja (sha256 47c758cb...),
