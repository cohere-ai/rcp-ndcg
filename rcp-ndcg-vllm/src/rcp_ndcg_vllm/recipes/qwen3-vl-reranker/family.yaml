      (4095..1310720 px; the recipe's pin raises the floor to 4096), video_preprocessor_config.json (video is out of scope: input [text,
      image]), and the card script scripts/qwen3_vl_reranker.py (byte-identical at every variant's pinned
      revision; reference.py re-implements it; sha256 bd5d2f5d...:
      MAX_LENGTH 8192, the same truncation and the same default instruction). The family's ONE
      reference loads this row's checkpoint from the resolved recipe's model/revision (--recipe) and its
      tokenizer's own 1_LogitScore/config.json.
    sources:
