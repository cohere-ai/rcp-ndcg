  - "https://huggingface.co/nvidia/Qwen3.5-397B-A17B-NVFP4/raw/0368c1b3233414cd4a617b8ff9515e25752dc16c/config.json (Qwen3_5MoeForConditionalGeneration, 60 layers, hidden 4096, 512 experts top-10, vocab 248 320, mpe 262 144, full_attention_interval 4, 2 KV heads, head_dim 256), hf_quant_config.json (quant_algo NVFP4, kv_cache_quant_algo FP8), model.safetensors.index.json (metadata.total_size 251 135 201 368 B, 11 shards), preprocessor_config.json (patch 16, merge 2, shortest 65 536 / longest 16 777 216 px)"
  - "vLLM v0.31.0 (image vllm/vllm-openai:v0.31.0): engine/arg_utils.py:952 (--quantization), :1334 (--kv-cache-dtype), :1093 (--reasoning-parser), :1432 (--limit-mm-per-prompt); model_executor/models/registry.py:597-600; layers/quantization/modelopt.py:715,746 (ModelOptNvFp4Config name modelopt_fp4) and :138 (hf_quant_config NVFP4 mapping); docs/features/quantization/modelopt.md:24-40 (SM100 native FP4, Marlin W4A16 fallback)"
  - "handover/specs/judge-catalog.md sections 1-3.1 (the catalog's facts, pins and flag citations; the paper's SGLang command translated there)"
  - "experiments/paper/README.md at this tree's HEAD (the paper's judges ran on SGLang; this release serves the same checkpoints on vLLM v0.31.0)"
status: {state: unverified, image: null, date: null, report: null}
variants:
  - id: qwen3.5-397b-a17b-nvfp4
    model: nvidia/Qwen3.5-397B-A17B-NVFP4
    revision: "0368c1b3233414cd4a617b8ff9515e25752dc16c"
    notes: >-
      The paper's own pin (not the Hub head, 12b28061efd8145b11226e4fab2528ee4f39ef09): the paper's SGLang command
      named this revision and the preset carried it. The served name is the recipe id; the T4 scenarios override it
      to their slot name at run time. The FP8 sibling is deliberately absent (decision 15: the paper never ran it).
      B200: TP2 (resources.gpus 2). H100: `--set resources.gpus=4` (the arithmetic is the family note's).
    sources:
      - "https://huggingface.co/nvidia/Qwen3.5-397B-A17B-NVFP4/tree/0368c1b3233414cd4a617b8ff9515e25752dc16c (config.json, hf_quant_config.json, preprocessor_config.json, model.safetensors.index.json read at the pin)"
