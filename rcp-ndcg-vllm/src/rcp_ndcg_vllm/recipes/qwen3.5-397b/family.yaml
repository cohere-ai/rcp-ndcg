# The Qwen3.5-397B judge family (decision 34): the paper's primary judge, one variant.
#
# The family's client block is rcp-ndcg's judge config (decision 15, R30): rcp-ndcg validates it with
# `rcp_ndcg.judging.JudgeConfig` when it reads `recipe: qwen3.5-397b-a17b-nvfp4`, so this package carries no
# second model of a judge. The serve block is the paper's SGLang command translated to vLLM v0.31.0 flags
# (handover/specs/judge-catalog.md section 2, every flag cited there in the v0.31.0 source).
#
# Serving shape (owner decision 41): one engine fits the smallest TP that leaves a B200 useful cache, and the
# H100 shape is the documented `--set` override. This judge's weights do not fit one GPU of either class.
id: qwen3.5-397b
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: judge
input: [text, image]
licence: apache-2.0
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  min_version: "0.31.0"
  # 251 GB of weights over 2 GPUs; the paper's own client allowed 2400 s for a cold start.
  startup_timeout_s: 3600
resources: {gpus: 2}
serve:
  runner: generate
  convert: null
  hf_overrides: {}
  chat_template: null
  pooler_config: {}
  trust_remote_code: false
  max_model_len: 262144
  dtype: auto
  plugin: null
  mm_processor_kwargs: {}
  limit_mm_per_prompt: {image: 10}
  # NVFP4 (ModelOpt) is auto-detected from hf_quant_config.json (quant_algo NVFP4); the flag records what the
  # paper's engine command passed. KV in FP8 is the checkpoint's own kv_cache_quant_algo. --reasoning-parser
  # keeps the model's thinking in its own channel so the answer schema constrains the answer, not the
  # reasoning. The flags are carried verbatim (serve.extra_args is the declared mechanism for engine flags the
  # schema does not name), so the fingerprint of the already-recorded recipes never moves.
  extra_args:
    - --quantization
    - modelopt_fp4
    - --kv-cache-dtype
    - fp8_e4m3
    - --reasoning-parser
    - qwen3
client:
  api: chat
  # The checkpoint's own generation defaults, read from its generation_config.json at the pinned revision
  # (2026-10-10 owner decision, superseding decision 4.3's paper sampling): temperature 0.6, top_p 0.95,
  # top_k 20. The max_output_tokens stays 16384.
  temperature: 0.6
  extra_body: {top_p: 0.95, top_k: 20}
  max_output_tokens: 16384
  context_tokens: 262144
  concurrency: 256
  decoding: json_schema
  image_processor: qwen3_vl
  max_images: 10
notes: >-
  The paper's primary judge. Client block: temperature 0.6 / top_p 0.95 / top_k 20 -- the checkpoint's own
  generation_config.json at the pinned revision (2026-10-10 owner decision: every judge sends its
  checkpoint's generation defaults, superseding decision 4.3's paper sampling; the max_output_tokens stays
  16384) -- context_tokens 262144 (the checkpoint's own
  max_position_embeddings and the engine's --max-model-len), concurrency 256, decoding json_schema (each request
  carries the stage's answer schema as response_format, strict), image_processor qwen3_vl (the client sizes every
  image and video frame as the checkpoint's processor does: patch 16 x merge 2, image 65 536..16 777 216 px,
  matching the checkpoint's preprocessor_config.json at the pinned revision), max_images 10.
  Serving: the reasoning parser qwen3 keeps the model's thinking in its own channel so the answer schema
  constrains the answer, not the reasoning. limit_mm_per_prompt matches the client's max_images (without it each
  modality defaults to 999 at vLLM v0.31.0). The client declares no video (max_videos 0): the paper's judge ran
  the page-image path.
  Memory arithmetic, both GPU classes (GiB, --gpu-memory-utilization 0.92 default; the paper's 0.85 was its own
  SGLang setting). Weights 251.1 GB (11 safetensors shards, index metadata.total_size at the pin).
  - B200 (192 GB; 0.92 -> 176.6 GB budget): TP2 -> 125.6 GB weights/GPU, ~51 GB cache/GPU. KV (FP8): 15
    full-attention layers x 2 x 2 KV heads x 256 head_dim x 1 B = 15 360 B/token across ranks; at TP2 the 2 KV
    heads replicate x2, so 7 680 B/token/GPU -- a full-length 262 144-token sequence ~1.9 GiB/GPU. The
    linear-attention (Gated DeltaNet) recurrent state, fp32, is 45 layers x 64 value heads x 128 x 128 x 4 B
    ~189 MB/sequence, ~95 MB/GPU at TP2. resources.gpus: 2 is this shape, and throughput scales by replicas.
  - H100 (80 GB; 0.92 -> 73.6 GB budget): TP2 does not fit (125.6 > 73.6). The smallest TP that fits with useful
    cache is TP4 (62.8 GB weights/GPU, 10.8 GB cache/GPU; KV 7 680 B/token/GPU, ~1.9 GiB per full-length
    sequence): serve with `--set resources.gpus=4`. Native FP4 GEMM wants SM100; on Hopper vLLM falls back to
    Marlin W4A16 with a warning (docs/features/quantization/modelopt.md:24-40), a capacity note, not a blocker.
  History: the paper served this judge as TP4 x DP2 (8 GPUs, SGLang `--data-parallel-size 2`); vLLM v0.31.0 has
  --data-parallel-size too, and the decision-41 shape is one TP2 replica per engine, scaled by replicas, with
  the TP4 H100 shape above.
  Engine support: Qwen3_5MoeForConditionalGeneration is in vLLM v0.31.0's registry (registry.py:597-600,
  module qwen3_5); re-checked at the pinned revision 2026-10-09. No plugin, no hf_overrides: the stock image
  serves it. status: unverified until the E2 judge wave passes (decision 1).
sources:
