# The Qwen3.8-27B judge family (decision 34): the T4 identity/outage judge, one variant.
#
# The family's client block is rcp-ndcg's judge config (decision 15, R30); the client and serve blocks are the
# ones the T4 scenarios carry today, moved into a recipe (handover/specs/judge-catalog.md section 3.4).
#
# Serving shape (owner decision 41): the weights fit one GPU of either class, so TP1 and throughput by
# replicas.
id: qwen3.8-27b
schema_version: "1"
role: judge
input: [text, image]
licence: apache-2.0
engine:
  name: vllm
  image: "vllm/vllm-openai:v0.31.0"
  min_version: "0.31.0"
resources: {gpus: 1}
serve:
  runner: generate
  convert: null
  hf_overrides: {}
  chat_template: null
  pooler_config: {}
  trust_remote_code: false
  # The T4 scenario's choice (the checkpoint's own mpe is 262 144); it matches the client's context_tokens.
  max_model_len: 131072
  dtype: auto
  plugin: null
  mm_processor_kwargs: {}
  limit_mm_per_prompt: {image: 10}
  # FP8 block [128,128] is auto-detected: no --quantization. No --kv-cache-dtype (BF16 KV, as the scenarios).
  # Carried verbatim in serve.extra_args.
  extra_args: [--reasoning-parser, qwen3]
client:
  api: chat
  temperature: 1.0
  extra_body: {top_p: 0.95, top_k: 20}
  max_output_tokens: 16384
  context_tokens: 131072
  concurrency: 256
  decoding: json_schema
  image_processor: qwen3_vl
  max_images: 10
notes: >-
  The owner's T4 judge (the identity, outage and text-four-phases scenarios). Client block: temperature 1.0 /
  top_p 0.95 / top_k 20 -- the checkpoint's own generation_config.json at the pinned revision (2026-10-10
  owner decision: every judge sends its checkpoint's generation defaults, superseding decision 4.3's paper
  sampling) -- max_output_tokens 16384, context_tokens 131072 (the scenario's engine
  --max-model-len; the checkpoint's own mpe is 262 144 -- open question 5 keeps the scenario value because it
  matches the client budget), decoding json_schema, image_processor qwen3_vl, max_images 10. The scenarios'
  per-slot concurrency (64) is runtime tuning; the recipe carries the catalog's 256 (open question 4).
  Serving: --reasoning-parser qwen3, --max-model-len 131072, TP1, limit_mm_per_prompt {"image": 10}.
  Memory arithmetic, both GPU classes (GiB, --gpu-memory-utilization 0.92 default). Weights 30.9 GB (24.7 GB
  FP8 + 6.2 GB BF16 at the pin).
  - B200 (192 GB; 0.92 -> 176.6 GB budget): TP1 -> 30.9 GB weights, ~146 GB cache. KV (BF16): 16
    full-attention layers x 2 x 4 KV heads x 256 x 2 B = 65 536 B/token -> a full-length 131 072-token sequence
    ~8 GiB (~18 sequences); after 64 concurrent sequences' linear-attention state (48 layers x 48 value heads x
    128 x 128 x 4 B ~151 MB each, ~9.7 GB) still ~17 full-length sequences, or ~750 typical 2k-token
    tournament windows. resources.gpus: 1; throughput scales by replicas.
  - H100 (80 GB; 0.92 -> 73.6 GB budget): TP1 fits (30.9 GB weights, ~43 GB cache): ~5 full-length sequences,
    ~250 typical 2k-token windows after the 64-sequence linear state. Same shape -- no `--set` override.
  History: the paper never ran this checkpoint (it is the owner's T4 judge); the paper's TREC-DL judge is the
  separate qwen3.6-27b family.
  Engine support: Qwen3_5ForConditionalGeneration is in vLLM v0.31.0's registry (registry.py:596); checked at
  the pinned revision 2026-10-09. status: unverified until the E2 judge wave passes.
sources:
  - "https://huggingface.co/api/models/Qwen/Qwen3.8-27B-FP8 (revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a == the Hub head; licence apache-2.0; gated false; checked 2026-10-09)"
  - "https://huggingface.co/Qwen/Qwen3.8-27B-FP8/raw/017b9c7af6b5689d5dd426a76e0bc077eb5ca20a/config.json (Qwen3_5ForConditionalGeneration, same shape as Qwen3.6-27B: 64 layers, hidden 5120, head_dim 256, 4 KV heads, vocab 248 320, mpe 262 144, FP8 [128,128])"
  - "vLLM v0.31.0 (image vllm/vllm-openai:v0.31.0): engine/arg_utils.py:951 (--max-model-len), :1093 (--reasoning-parser), :1432 (--limit-mm-per-prompt); model_executor/models/registry.py:596; layers/quantization/fp8.py:92,138-139"
  - "handover/specs/judge-catalog.md sections 1-3.4 (the catalog's facts, the scenario blocks and open questions 2, 4, 5)"
  - "rcp-ndcg-test/scenarios/{identity,outage,text-four-phases}.yaml at this tree's HEAD (the scenario serve command and client block this family moves into a recipe)"
status: {state: unverified, image: null, date: null, report: null}
variants:
  - id: qwen3.8-27b-fp8
    model: Qwen/Qwen3.8-27B-FP8
    revision: "017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"
    notes: >-
      The scenario pin, equal to the Hub head at the check date. The served name is the recipe id; the T4
      scenarios override it to their slot name at run time. B200 and H100: TP1 (resources.gpus 1).
    sources:
      - "https://huggingface.co/Qwen/Qwen3.8-27B-FP8/tree/017b9c7af6b5689d5dd426a76e0bc077eb5ca20a (config.json read at the pin)"
