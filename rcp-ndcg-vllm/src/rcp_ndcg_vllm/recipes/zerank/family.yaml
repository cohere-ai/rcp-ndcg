# The zerank family (decision 34): one serving contract, three sizes, every size its own tested
# recipe id. The shared blocks below are the sizes' common contract, read off the three standalone
# recipes this family replaces: same base architecture (Qwen3ForCausalLM converted in-engine to the
# 1-label Qwen3ForSequenceClassification head, hf_overrides classifier_from_token ["Yes"] + method
# no_post_processing, the pooler's sigmoid(l_Yes / 5)), same prompt frame and scoring. The variants
# table carries only the per-size facts: the checkpoint (id, model, revision) and zerank-2's lower
# engine context (its paper truncation budget).
#
# Paper reference: experiments/paper/rerankers/reference/zerank.py (ZerankRerank, adapted from the
# vendor's zerank-1 code, Apache-2.0), the paper configs
# experiments/paper/rerankers/zerank_{1,1-small,2}.yaml, the paper budgets MAX_SEQ_LENGTH 8192 and
# MAX_QUERY_LENGTH 4096 (the pre-unified-inference retrieval/cross_encoder.py constants).
id: zerank
schema_version: "1"   # the recipe file format version (decision 18: the contract between rcp-ndcg and rcp-ndcg-vllm)
role: rerank
input: [text]
scoring: pointwise
licence: apache-2.0
engine: {name: vllm, image: "vllm/vllm-openai:v0.31.0", min_version: "0.31.0"}
resources: {gpus: 1}          # ~3.4 GB bf16 weights (single shard); 1 GPU
serve:
  runner: pooling
  convert: null               # auto resolves to `classify` from the ForSequenceClassification suffix;
                              # passing --convert classify is equivalent
  hf_overrides:
    architectures: ["Qwen3ForSequenceClassification"]
    classifier_from_token: ["Yes"]     # single token, id 9454 (measured on this revision's tokenizer.json)
    method: no_post_processing         # score head := the "Yes" LM-head row; num_labels := 1 is automatic.
                                       # Dropping either override silently yields the config's 2-label
                                       # softmax head - a different model (research risk R7).
  chat_template: template.jinja
  pooler_config:
    logit_sigma: 5           # sigmoid(l_Yes / 5); logit_mean stays None
    use_activation: true     # the 1-label head's default is already sigmoid; pinned so the served scale
                             # is explicit, and mirrored on the wire by client.use_activation below
  trust_remote_code: false   # measured: AutoConfig returns the native Qwen3Config with auto_map present
                             # AND modeling_zeranker.py staged; the engine never executes the remote code
  max_model_len: 32768       # the card's declared context (config max_position_embeddings is 40960);
                             # the paper's pair budget is the client's 8192 below
  dtype: bfloat16            # the checkpoint's torch_dtype and the paper's DTYPE
  plugin: null
  extra_args: []
client:
#   recipe: "vllm v0.31.0: --runner pooling, hf_overrides Qwen3ForSequenceClassification + classifier_from_token [Yes] + method no_post_processing, --chat-template template.jinja, pooler logit_sigma 5 + use_activation true (sigmoid(l_Yes/5) at the last token, 1-label head)"
  api: rerank
  max_tokens: 8192           # the paper's whole-pair budget (MAX_SEQ_LENGTH, retrieval/cross_encoder.py:42):
                             # the frame, the query and the document together, in this tokenizer's tokens;
                             # content spans are cut client-side, inside the frame, anchors reserved
  query_max_tokens: 4096     # the query's share of the pair budget (the paper's query cap; the pair
                             # cap is its MAX_SEQ_LENGTH 8192, both as the paper config declares them,
                             # experiments/paper/rerankers/zerank_1_small.yaml). The settle rule, read from
                             # the merged rerank client (one rule for the family): the pair fit binds on
                             # overflow; the client settles the shared query ONCE per request, at this
                             # share whenever the query exceeds it, then each (query, document) pair is
                             # fitted under the budget. An over-share query ships cut at the share while
                             # the in-process reference keeps it whole: a declared divergence row (notes)
  template:
    pair:
      - {fixed: "{special:im_start}system\n"}
      - {content: query}
      - {fixed: "{special:im_end}\n{special:im_start}user\n"}
      - {content: document}
      - {fixed: "{special:im_end}\n{special:im_start}assistant\n"}
    anchor: last             # the assistant generation prompt: the position the score head reads
    add_special_tokens: true # the scoring route tokenizes the rendered string with add_special_tokens=True
                             # (scoring/protocol.py:69-74); for this tokenizer it is measured to add no
                             # tokens (empty render included), so the overhead is the frame alone
    normalize: [strip]       # one rule for the family: the paper's query.strip()/doc.strip() is the
                             # DECLARED content normalisation (TemplateSpec.normalize), applied by fit
                             # before measuring and shipped on the wire -- never a jinja trim filter in
                             # the template file
  instruction: none          # the family takes no instruction parameter; the reference raises on one. A
                             # dataset task text, when a run passes one, is dropped on the served path and
                             # in the reference alike (the paper pipeline never passed one)
  on_overflow: cut
  empty_doc: send            # the paper sends an empty document as the empty string; no omit rule
  empty_query: send          # declared: the product's post-refusal default is `refuse` (p1-tail 2f), but the
                             # paper path scores an empty query against every candidate as given (its chat
                             # template renders the empty system turn); the recipe's row 20 pins that edge
  use_activation: true       # the served score is the probability sigmoid(l_Yes / 5) (the reference's
                             # score_scale); raw logits would be a different stored score
reference:
  kind: transformers
  score_scale: probability   # sigmoid(l_Yes / 5) in [0, 1]
  entry: reference.py
  known_deviations: [anchor_drop_over_cap]   # the paper's code truncates the WHOLE rendered prompt from
                                             # the right at 8192 (at forward time), which drops the
                                             # assistant header - the anchor - on over-cap pairs; the
                                             # served path reserves it and cuts the content instead
gates: {}
status: {state: unverified, image: null, date: null, report: null}

variants:
  - id: zerank-1-reranker
    model: zeroentropy/zerank-1-reranker
    revision: "d03c467e29e29c0a16a130a86ce3b62d30116a2c"
    notes: |-
      Score = sigmoid(yes_logit / 5) at the last prompt position ("Yes" is single token 9454; the repo's own pad token is the id-151643 end-of-text special; padding/truncation right). The prompt is ChatML: system=query, user=document, ending with the assistant header whose trailing newline is the token the score is pooled from.
      template.jinja is REQUIRED and load bearing (R10): the tokenizer's own chat template is refused on the score path (io_processor.py:701-710), and without a template file vLLM silently tokenizes query and document as a pair - no warning fires for this converted architecture (the warning needs is_original_qwen3_reranker, io_processor.py:460-476). Serve-time smoke check for the GPU wave: boot with serve_argv, then POST /rerank for one short pair and require the reply's relevance_score in (0, 1); a dropped template file scores a raw logit-shaped number outside (0, 1) or errors. The template's declared normalisation (client.template normalize: [strip] = the paper's query.strip()/doc.strip()): fit strips the content spans before measuring, the wire ships the stripped spans, the reference's spans (the paper's own strip) agree on every under-cap row, and the template file carries no jinja trim filter anywhere (measured token-id equal on the whitespace-padded case too, r-zerank1 check_cpu.py 21/21). The template check compares raw against raw and passes on any pairs file. The vendor zerank-2 chat_template.jinja is NOT reusable: it emits the assistant header only under add_generation_prompt, which vLLM's rerank path never passes, so the header (the anchor) is lost - 4/7 measured rows fail; hence the shipped file.
      Over-cap behaviour is the one declared reference deviation: the paper right-cuts the whole rendered prompt at 8192 tokens and drops the assistant header (the anchor); the served path reserves the frame, cuts the content spans only, and re-attaches the header - declared as reference.known_deviations: [anchor_drop_over_cap]: stage 1 and stage 2 report the over-cap rows in a non-gating table and gate the under-cap rows exactly. reference.py's --mode render writes the paper's own cut as the content spans (raw character offsets of the whole-prompt right cut); it never ports the client's cut. Settle rule (read from the merged rerank client, one rule for the family): the pair fit binds on overflow; the client settles the shared query once per request, at its declared query_max_tokens share whenever the query exceeds it. A query over the 4096-token share therefore ships cut at the share while the in-process reference keeps it whole: over-share queries are declared divergence rows - an over-share query in an UNDER-budget pair is an under-cap row and gates red by design (the reference never ports the client's settle rule), so the wave's pairs files keep queries well within the share and drop any row stage 1 goes red on. The score head runs fp32 (the pooling runner's default) against the paper's bf16 lm_head logits: served scores are more precise, not bit-equal; the probability gates (|delta| <= 0.02 for 99%, <= 0.05 max) bound it (research risk R4). Datasets with run-level instructions: the paper scored the bare query; this recipe pins instruction: none so the served path does the same - nothing folds Task:/Query: (research R3). trust_remote_code stays false: with auto_map present and modeling_zeranker.py staged, AutoConfig resolves native Qwen3Config (measured), so the remote code is never executed. Post-serve, wave T0 must GET /v1/models and fire one /rerank; the recorder's exchanges cover the route.
    sources:
      - "https://huggingface.co/zeroentropy/zerank-1-reranker (canonical repo; sha d03c467e29e29c0a16a130a86ce3b62d30116a2c)"
      - "https://huggingface.co/zeroentropy/zerank-1 (HF 307 -> zerank-1-reranker; the alias the paper's config names)"
      - "experiments/paper/rerankers/zerank_1.yaml:1-4 (the paper's served-path config: provider local, model zeroentropy/zerank-1, no overrides)"
      - "experiments/paper/rerankers/reference/zerank.py:41-134 (the paper-exact reference in this tree: strip + chat template :78-87, the whole-prompt 8192 cap :47, yes-logit/5 :103, expit :132-134)"
      - "experiments/paper/rerankers/zerank_1.yaml (the paper's served-path config: budgets 8192/4096 and instruction: none)"
      - "vllm d0d6e5f3a: vllm/model_executor/models/adapters.py:593-647 (load_weights_no_post_processing; score.weight := the \"Yes\" row of the tied lm_head)"
      - "vllm d0d6e5f3a: vllm/model_executor/layers/pooler/activations.py:138-140 (num_labels < 2 -> F.sigmoid) with vllm/model_executor/layers/pooler/seqwise/heads.py:177-200 ((logit - logit_mean) / logit_sigma)"
      - "vllm d0d6e5f3a: vllm/config/pooler.py:105,140-141 (logit_sigma is a PoolerConfig field; 0 is refused)"
      - "vllm d0d6e5f3a: vllm/entrypoints/pooling/scoring/io_processor.py:701-733 (the score prompt: the CLI chat template is required, the tokenizer's own is refused, encode with add_special_tokens=True)"
      - "vllm d0d6e5f3a: vllm/entrypoints/pooling/scoring/io_processor.py:460-476 (the missing-template warning fires only for is_original_qwen3_reranker - silent for this converted architecture)"
  - id: zerank-1-small-reranker
    model: zeroentropy/zerank-1-small-reranker
    revision: "a65fd51c450e9b47fdddab98e31166ecad21af8d"
    notes: |
      Template: template.jinja is the family's one template file (decision 34) and is the research lane's derived score template with the `messages is defined` guard: the engine's score route renders the zerank branch (query message to the system turn, document message to the user turn, unconditional assistant header) and the harness's stage-1 check renders the plain-text branch; both build the identical frame, and stage 1 asserts the equality byte-for-byte (template_render_check). The content spans carry the family's declared normalisation (client.template normalize: [strip]): fit strips the spans before measuring and the wire ships them stripped - the paper's query.strip()/doc.strip() - the reference's spans agree byte for byte on every under-cap row, and the template file carries no jinja trim filter. The research's strip asymmetry (report section 6 row 1) closes as declared policy here, one rule for the family. Known served-vs-reference differences, all inherited from the paper's own paths and recorded in the research report section 6/7: (1) the reference truncates only the whole rendered prompt at 8192 from the right (declared known_deviations: anchor_drop_over_cap), the served path cuts the content spans and keeps the assistant header; (2) the settle rule (above) settles a query over its 4096-token share served-side while the in-process reference keeps it whole - the r-zerank1 research measured 904 prompt tokens lost at a 5000-token query under the former engine-side constant; over-share queries are declared divergence rows - an over-share query in an UNDER-budget pair is an under-cap row and gates red by design (the reference never ports the client's settle rule), so the wave's pairs files keep queries well within the share and drop any row stage 1 goes red on; (3) the score-head matmul runs in fp32 on the engine (head_dtype default for pooling) and bf16 in the reference - expected well inside the probability gates; --hf-overrides '{"head_dtype": "model"}' is the closer-to-reference option if the gate ever fails. The paper's last prompt token is the newline after the assistant header (dropping it flips the render: the research lane's mutation M1); the template file ends with the header inside every branch. Budget: max_tokens 8192 is the paper's MAX_SEQ_LENGTH, counted as the engine sees the whole prompt (frame + query + document; the frame's fixed overhead measures 13 tokens on this tokenizer, add_special_tokens adds none - both measured); query_max_tokens 4096 is the query's settled share (the settle rule above). The checkpoint's card truncates the query at 2000 CHARACTERS pre-template and never token-truncates - the paper's whole-prompt token cut wins (r-zerank1 report section 6 row 1). trust_remote_code stays false: the native Qwen3Config loads with auto_map present and the remote code staged (measured; the engine never executes modeling_zeranker.py). GPU wave must check: T0 smoke that the engine loaded the chat template (a /tokenize probe of one rendered prompt must carry the frame; without the file this model gets NO warning and pair-encodes raw query+document - R10), the engine's /tokenize agreement (stage 1 reports it not_run on CPU), the fp32-head epsilon (difference 3 above), and the query-length histogram (difference 2 above). reference.py derives from experiments/paper/rerankers/reference/zerank.py (the paper's ZerankRerank, unchanged in behaviour: strip, chat template, right padding, whole-prompt right cut at 8192, the "Yes" logit at the last non-pad position over 5, sigmoided); its --mode render writes the paper's own cut as the content spans (the whole-prompt right cut at raw character offsets; under the cap the stripped texts), never the client's cut. Environment: requirements-reference.txt beside reference.py (the paper reference's pins, minus flash-attn and accelerate, neither of which zerank.py imports).
    sources:
      - "https://huggingface.co/zeroentropy/zerank-1-small-reranker @ a65fd51c450e9b47fdddab98e31166ecad21af8d (card README; config.json: Qwen3ForCausalLM, bfloat16, hidden 2048, 28 layers, tie_word_embeddings, max_position_embeddings 40960, auto_map; tokenizer.json + tokenizer_config.json: chat template, pad '...' set, padding right; the tree at that revision holds exactly 13 files - no 1_LogitScore directory, that one is zerank-2's). https://huggingface.co/zeroentropy/zerank-1-small 307-redirects to it (live check at recipe time; same sha). The Yes token is id 9454, a single token, measured on the pinned tokenizer.json (the recipe tests pin it)."
      - "https://huggingface.co/Qwen/Qwen3-1.7B — the base checkpoint by config match: 25/26 shared keys equal (27 keys vs 26; the extra key is auto_map; transformers_version 4.51.3 vs 4.51.0 differs). The card's 'Base Model: Qwen/Qwen3-4B' row is wrong (audit-synth correction for r-zerank1)."
      - "vLLM v0.31.0 / d0d6e5f3a (read at the .refs/vllm checkout, 376 commits past the v0.31.0 tag; pooling diff error-handling only in the named scoring files — r-zerank1 report R9): vllm/model_executor/models/adapters.py:307 as_seq_cls_model, :593 load_weights_no_post_processing (score head := the classifier_from_token lm_head row, num_labels := 1); vllm/config/model.py:2295-2342 (the ForSequenceClassification suffix -> runner pooling / convert classify), :2079-2091 head_dtype (pooling defaults to an fp32 score head; --hf-overrides '{\"head_dtype\": \"model\"}' disables); vllm/config/pooler.py:98-109,140-141 (logit_mean/logit_sigma); vllm/model_executor/layers/pooler/ activations.py:140 (num_labels < 2 -> sigmoid); .../seqwise/heads.py:170-200 (the /5, the per-request use_activation); vllm/entrypoints/pooling/scoring/io_processor.py (get_score_prompt def :634, the chat-template render over query/document messages, :706-724; :654-668 the query/document pre-truncation hooks; :661-699 default_tokenizer_encode, the un-templated pair-encode fallback taken when the template file is missing, :706-710); vllm/entrypoints/pooling/ scoring/protocol.py:69-74 (add_special_tokens=True on the score route); vllm/renderers/hf.py:780-845 (safe_apply_chat_template, the renderer the engine calls); vllm/renderers/params.py get_encode_kwargs."
      - "rcp-ndcg: experiments/paper/rerankers/reference/zerank.py (the paper-exact ZerankRerank reference.py derives from), with experiments/paper/rerankers/reference/requirements.txt (its environment); experiments/paper/rerankers/zerank_1_small.yaml (the paper's served-path config: provider local, model zeroentropy/zerank-1-small, budgets 8192/4096: the pair cap is that ZerankRerank's max_seq_len 8192 at reference/zerank.py:47); the historically named constants MAX_SEQ_LENGTH 8192 / MAX_QUERY_LENGTH 4096 lived at rcp-ndcg/src/rcp_ndcg/retrieval/cross_encoder.py:42,46 in the pre-unification tree (this branch carries the unified rcp-ndcg/src/rcp_ndcg/retrieval/ and no such constants); rcp-ndcg/src/rcp_ndcg/data/templates.py (TemplateSpec: the pair frame, the anchor, add_special_tokens, the declared normalize); rcp-ndcg/src/rcp_ndcg/data/preprocess.py (token_prefix and fit: the content-only cut that reserves the frame, and the declared normalisation applied there); rcp-ndcg/src/rcp_ndcg/inference/config.py RerankEndpoint (the client block IS this model); rcp-ndcg/src/rcp_ndcg/inference/clients/rerank.py (the settle rule the notes describe)."
      - "research lane r-zerank1: research/r-zerank1/out/ (report.md: the paper path, the flag-by-flag serve mechanism, risks R1-R10, the 21/21 prompt-equivalence measurement and the check_maxquery divergence table; digest.md; recipe-draft-zerank-1-small.yaml; reference-draft.py; zerank_reranker.jinja) and the audit-synth corrections for r-zerank1 (research/audit-synth/out/corrections.md), applied here: the config-match is 25/26 shared keys (not 26), the recipe sources cite 21/21 (not 14/14) and that auto_map also differs, the prompt-equivalence guard's config fallback check is a measurement, not a gate, and the serve-time revision pin is rendered by the harness's serve_argv (--revision), closing the corrections' serve-time revision risk."
  - id: zerank-2-reranker
    model: zeroentropy/zerank-2-reranker
    revision: "5eae30d5ee3c6b2df2ef6d723bde45172d761c4c"
    overrides:
      serve:
        max_model_len: 8192
    notes: |
      CPU evidence (research lane r-zerank2): the derived template renders byte-identically through transformers' own apply_chat_template and a hand-rolled environment, token ids match the paper's render with add_special_tokens True==False, truncation at 8192 is identical, the prompt ends with the assistant header, and the paper's strip is the family's declared normalisation (below) (10 PASS, 0 failures; the mutation re-gating the generation prompt fails). This recipe declares that template and adds the `messages is defined` guard so the harness's stage-1 template check (which renders the file from the plain request texts) and the engine's score route (which renders it over query/document messages) execute different branches that produce the same prompt: stage 1 asserts the plain-text branch against the declared shape (template_render_check, zero tolerance), the recipe's tests additionally render the engine's messages context with the serving environment's jinja settings and assert byte-identity with it and with the declared shape's render for every sampled row, and stage 2 on the GPU wave exercises the engine branch end to end. The paper's query.strip()/doc.strip() is the declared content normalisation (client.template normalize: [strip]): fit strips the spans before measuring, the wire ships the stripped spans and the reference's spans agree byte for byte on every under-cap row (the r-zerank2 "strip asymmetry" closes as declared policy, one rule for the family). Known served-vs-reference differences, all inherited from the paper's served path and recorded in the research report section 6: (1) the reference truncates only the whole rendered prompt at 8192 (declared known_deviations: anchor_drop_over_cap), the served path cuts the content spans and keeps the anchor; (2) the settle rule (above) settles a query over its 4096-token share served-side while the in-process reference keeps it whole (experiments/paper/rerankers/zerank_2.yaml); over-share queries are declared divergence rows - an over-share query in an UNDER-budget pair is an under-cap row and gates red by design (the reference never ports the client's settle rule), so the wave's pairs files keep queries well within the share and drop any row stage 1 goes red on; (3) the score-head matmul runs in fp32 on the engine (head_dtype default for pooling) and bf16 in the reference - expected well inside the probability gates; (4) reference.py's --mode render writes the paper's own cut as the content spans (the whole-prompt right cut at raw character offsets; under the cap the stripped texts), never the client's cut. template.jinja is the family's one template file (decision 34), shared by every variant. GPU wave must also: run the negative control (serve without --chat-template falls back to raw concatenation with no warning on this model), and check /tokenize agreement (stage 1 does with an engine URL).
    sources:
      - "https://huggingface.co/zeroentropy/zerank-2-reranker @ 5eae30d5ee3c6b2df2ef6d723bde45172d761c4c (card, config.json, chat_template.jinja, sentence_bert_config.json, 1_LogitScore/config.json)"
