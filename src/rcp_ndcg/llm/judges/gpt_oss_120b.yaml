# gpt-oss-120b served by vLLM or SGLang on this host (example commands: docs/concepts/serving.md; the paper's:
# experiments/paper/serve/).
# No temperature is sent: the server's default sampling, as the paper's runs used.
base_url: http://127.0.0.1:8000/v1
model: gpt-oss-120b
temperature: null
max_output_tokens: 8192
context_tokens: 131072
# Text limits and the window budget are counted in this tokenizer's tokens (its tokenizer.json on the Hub).
tokenizer: openai/gpt-oss-120b
concurrency: 256
# The server constrains each answer to the stage's JSON schema (response_format json_schema). Serve the model with
# its reasoning parser, so the schema applies to the answer, not the reasoning (docs/concepts/serving.md).
decoding: json_schema
